<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; }
        #gameCanvas { width: 100vw; height: 100vh; display: block; }
        
        /* Прицел */
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: #0f0;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }
        
        #health {
            color: #0f0;
            margin-bottom: 10px;
        }
        
        #ammo {
            color: #ff0;
        }
        
        /* Мобильное управление */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            z-index: 100;
        }
        
        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
        }
        
        #leftJoystick { left: 20px; bottom: 20px; }
        #rightJoystick { right: 20px; bottom: 20px; }
        
        #fireButton {
            position: absolute;
            right: 160px;
            bottom: 60px;
            width: 80px;
            height: 80px;
            background: rgba(255,0,0,0.5);
            border-radius: 50%;
            border: 3px solid rgba(255,0,0,0.8);
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Экран старта */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
        }
        
        #startButton {
            margin-top: 30px;
            padding: 20px 60px;
            font-size: 24px;
            background: #0f0;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        
        #startButton:hover { background: #0a0; }
        
        @media (max-width: 768px) {
            #mobileControls { display: block; }
            #hud { font-size: 18px; bottom: 220px; }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="crosshair"></div>
    
    <div id="hud">
        <div id="health">❤️ 100</div>
        <div id="ammo">🔫 30 / 90</div>
    </div>
    
    <div id="mobileControls">
        <div id="leftJoystick" class="joystick"></div>
        <div id="rightJoystick" class="joystick"></div>
        <div id="fireButton">FIRE</div>
    </div>
    
    <div id="startScreen">
        <h1 style="font-size: 48px; margin-bottom: 20px;">🎯 CS MINI</h1>
        <p style="font-size: 20px; margin-bottom: 10px;">Управление:</p>
        <p style="font-size: 16px; margin-bottom: 5px;">WASD - движение</p>
        <p style="font-size: 16px; margin-bottom: 5px;">Мышь - обзор</p>
        <p style="font-size: 16px; margin-bottom: 5px;">ЛКМ - стрельба</p>
        <p style="font-size: 16px; margin-bottom: 5px;">R - перезарядка</p>
        <p style="font-size: 16px; margin-bottom: 30px;">Пробел - прыжок</p>
        <button id="startButton">ИГРАТЬ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 10, 100);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas') });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        scene.add(directionalLight);

        // Пол
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshLambertMaterial({ color: 0x808080 });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Стены (простая арена)
        const wallMaterial = new THREE.MeshLambertMaterial({ color: 0x606060 });
        const walls = [];
        
        function createWall(x, z, width, depth) {
            const wallGeometry = new THREE.BoxGeometry(width, 4, depth);
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(x, 2, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        createWall(0, -20, 40, 2);
        createWall(0, 20, 40, 2);
        createWall(-20, 0, 2, 40);
        createWall(20, 0, 2, 40);
        createWall(-10, -10, 4, 4);
        createWall(10, 10, 4, 4);

        // Игрок
        const player = {
            position: new THREE.Vector3(0, 1.7, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            health: 100,
            ammo: 30,
            maxAmmo: 30,
            reserveAmmo: 90,
            isReloading: false,
            rotation: { x: 0, y: 0 }
        };

        camera.position.copy(player.position);

        // Боты
        const bots = [];
        const botGeometry = new THREE.BoxGeometry(1, 2, 1);
        const botMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });

        function createBot(x, z) {
            const bot = new THREE.Mesh(botGeometry, botMaterial);
            bot.position.set(x, 1, z);
            bot.castShadow = true;
            scene.add(bot);
            
            bots.push({
                mesh: bot,
                health: 100,
                velocity: new THREE.Vector3(0, 0, 0),
                lastShot: 0,
                targetPosition: new THREE.Vector3(x, 1, z)
            });
        }

        createBot(-15, -15);
        createBot(15, 15);
        createBot(-15, 15);
        createBot(15, -15);

        // Управление
        const keys = {};
        let isPointerLocked = false;

        document.addEventListener('keydown', (e) => keys[e.code] = true);
        document.addEventListener('keyup', (e) => keys[e.code] = false);

        document.addEventListener('click', () => {
            if (!isPointerLocked && document.getElementById('startScreen').style.display === 'none') {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === document.body;
        });

        document.addEventListener('mousemove', (e) => {
            if (isPointerLocked) {
                player.rotation.y -= e.movementX * 0.002;
                player.rotation.x -= e.movementY * 0.002;
                player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotation.x));
            }
        });

        // Стрельба
        let lastShot = 0;
        const fireRate = 100; // мс между выстрелами

        function shoot() {
            const now = Date.now();
            if (now - lastShot < fireRate || player.isReloading || player.ammo <= 0) return;
            
            lastShot = now;
            player.ammo--;
            updateHUD();

            // Отдача
            player.rotation.x += 0.02;

            // Raycast для попадания
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            
            const botMeshes = bots.map(b => b.mesh);
            const intersects = raycaster.intersectObjects(botMeshes);

            if (intersects.length > 0) {
                const hitBot = bots.find(b => b.mesh === intersects[0].object);
                if (hitBot) {
                    hitBot.health -= 25;
                    if (hitBot.health <= 0) {
                        scene.remove(hitBot.mesh);
                        bots.splice(bots.indexOf(hitBot), 1);
                    }
                }
            }

            // Автоперезарядка
            if (player.ammo <= 0 && player.reserveAmmo > 0) {
                reload();
            }
        }

        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && isPointerLocked) shoot();
        });

        // Перезарядка
        function reload() {
            if (player.isReloading || player.ammo === player.maxAmmo || player.reserveAmmo <= 0) return;
            
            player.isReloading = true;
            document.getElementById('ammo').textContent = ' ПЕРЕЗАРЯДКА...';
            
            setTimeout(() => {
                const needed = player.maxAmmo - player.ammo;
                const toLoad = Math.min(needed, player.reserveAmmo);
                player.ammo += toLoad;
                player.reserveAmmo -= toLoad;
                player.isReloading = false;
                updateHUD();
            }, 2500);
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyR') reload();
        });

        // Обновление HUD
        function updateHUD() {
            document.getElementById('health').textContent = `❤️ ${player.health}`;
            document.getElementById('ammo').textContent = ` ${player.ammo} / ${player.reserveAmmo}`;
        }

        // Движение игрока
        function updatePlayer(delta) {
            const speed = 5;
            const direction = new THREE.Vector3();

            if (keys['KeyW']) direction.z -= 1;
            if (keys['KeyS']) direction.z += 1;
            if (keys['KeyA']) direction.x -= 1;
            if (keys['KeyD']) direction.x += 1;

            direction.normalize();
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

            player.position.x += direction.x * speed * delta;
            player.position.z += direction.z * speed * delta;

            // Прыжок
            if (keys['Space'] && player.position.y <= 1.7) {
                player.velocity.y = 5;
            }

            player.velocity.y -= 9.8 * delta;
            player.position.y += player.velocity.y * delta;

            if (player.position.y < 1.7) {
                player.position.y = 1.7;
                player.velocity.y = 0;
            }

            // Ограничение арены
            player.position.x = Math.max(-19, Math.min(19, player.position.x));
            player.position.z = Math.max(-19, Math.min(19, player.position.z));

            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotation.y;
            camera.rotation.x = player.rotation.x;
        }

        // ИИ ботов
        function updateBots(delta) {
            bots.forEach(bot => {
                const distance = bot.mesh.position.distanceTo(player.position);
                
                // Движение к игроку
                if (distance > 5) {
                    const direction = new THREE.Vector3()
                        .subVectors(player.position, bot.mesh.position)
                        .normalize();
                    
                    bot.mesh.position.x += direction.x * 2 * delta;
                    bot.mesh.position.z += direction.z * 2 * delta;
                }

                // Стрельба по игроку
                const now = Date.now();
                if (distance < 15 && now - bot.lastShot > 1000) {
                    bot.lastShot = now;
                    player.health -= 10;
                    updateHUD();
                    
                    if (player.health <= 0) {
                        alert('Ты проиграл! Перезагрузи страницу.');
                        location.reload();
                    }
                }

                // Поворот к игроку
                bot.mesh.lookAt(player.position.x, bot.mesh.position.y, player.position.z);
            });
        }

        // Игровой цикл
        let lastTime = Date.now();

        function animate() {
            requestAnimationFrame(animate);
            
            const now = Date.now();
            const delta = (now - lastTime) / 1000;
            lastTime = now;

            updatePlayer(delta);
            updateBots(delta);

            renderer.render(scene, camera);
        }

        // Старт игры
        document.getElementById('startButton').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            document.body.requestPointerLock();
            animate();
        });

        // Адаптация размера
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
