<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS Mini App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { overflow: hidden; background: #000; font-family: Arial, sans-serif; touch-action: none; }
        #gameCanvas { width: 100vw; height: 100vh; display: block; }
        
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.8);
        }
        
        #crosshair::before {
            width: 2px;
            height: 20px;
            left: 9px;
            top: 0;
        }
        
        #crosshair::after {
            width: 20px;
            height: 2px;
            left: 0;
            top: 9px;
        }
        
        #hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }
        
        #health { color: #0f0; margin-bottom: 10px; font-size: 24px; }
        #ammo { color: #ff0; font-size: 24px; }
        
        #mobileControls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
        
        .joystick {
            position: absolute;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.4);
            pointer-events: auto;
        }
        
        #leftJoystick { left: 20px; bottom: 100px; }
        
        .joystickKnob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.5);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #fireButton {
            position: absolute;
            right: 30px;
            bottom: 120px;
            width: 100px;
            height: 100px;
            background: rgba(255,50,50,0.4);
            border-radius: 50%;
            border: 4px solid rgba(255,50,50,0.8);
            color: white;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        
        #reloadButton {
            position: absolute;
            right: 150px;
            bottom: 120px;
            width: 80px;
            height: 80px;
            background: rgba(255,165,0,0.4);
            border-radius: 50%;
            border: 4px solid rgba(255,165,0,0.8);
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        
        #jumpButton {
            position: absolute;
            right: 30px;
            bottom: 240px;
            width: 80px;
            height: 80px;
            background: rgba(100,100,255,0.4);
            border-radius: 50%;
            border: 4px solid rgba(100,100,255,0.8);
            color: white;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
        }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
        }
        
        #startScreen h1 {
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
        
        #startScreen p {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        #startButton {
            margin-top: 30px;
            padding: 20px 60px;
            font-size: 24px;
            background: linear-gradient(135deg, #0f0 0%, #0a0 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0,255,0,0.5);
        }
        
        #startButton:active { transform: scale(0.95); }
        
        #damageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.5) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 99;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="damageOverlay"></div>
    
    <div id="hud">
        <div id="health">❤️ 100</div>
        <div id="ammo">🔫 30 / 90</div>
    </div>
    
    <div id="mobileControls">
        <div id="leftJoystick" class="joystick">
            <div class="joystickKnob"></div>
        </div>
        <div id="fireButton">ОГОНЬ</div>
        <div id="reloadButton">R</div>
        <div id="jumpButton">↑</div>
    </div>
    
    <div id="startScreen">
        <h1>🎯 CS MINI</h1>
        <p>Мобильное управление:</p>
        <p>Левый джойстик - движение</p>
        <p>Правая часть экрана - обзор</p>
        <p>Красная кнопка - стрельба</p>
        <p>Оранжевая - перезарядка</p>
        <p>Синяя - прыжок</p>
        <button id="startButton">ИГРАТЬ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Процедурные текстуры
        function createTexture(color1, color2, size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            for (let i = 0; i < size; i += 8) {
                for (let j = 0; j < size; j += 8) {
                    ctx.fillStyle = Math.random() > 0.5 ? color1 : color2;
                    ctx.fillRect(i, j, 8, 8);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const floorTexture = createTexture('#666', '#777', 128);
        floorTexture.repeat.set(10, 10);
        
        const wallTexture = createTexture('#555', '#666', 64);
        wallTexture.repeat.set(2, 2);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        scene.add(directionalLight);

        // Пол с текстурой
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshLambertMaterial({ map: floorTexture });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Стены
        const wallMaterial = new THREE.MeshLambertMaterial({ map: wallTexture });
        const walls = [];
        
        function createWall(x, z, width, depth) {
            const wallGeometry = new THREE.BoxGeometry(width, 4, depth);
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(x, 2, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        createWall(0, -20, 40, 2);
        createWall(0, 20, 40, 2);
        createWall(-20, 0, 2, 40);
        createWall(20, 0, 2, 40);
        createWall(-10, -10, 4, 4);
        createWall(10, 10, 4, 4);
        createWall(5, -5, 3, 3);

        // Игрок
        const player = {
            position: new THREE.Vector3(0, 1.7, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            health: 100,
            ammo: 30,
            maxAmmo: 30,
            reserveAmmo: 90,
            isReloading: false,
            rotation: { x: 0, y: 0 }
        };

        camera.position.copy(player.position);

        // Боты
        const bots = [];
        const botGeometry = new THREE.BoxGeometry(1, 2, 1);
        const botMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });

        function createBot(x, z) {
            const bot = new THREE.Mesh(botGeometry, botMaterial);
            bot.position.set(x, 1, z);
            bot.castShadow = true;
            scene.add(bot);
            
            bots.push({
                mesh: bot,
                health: 100,
                lastShot: 0,
                moveDirection: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize()
            });
        }

        createBot(-15, -15);
        createBot(15, 15);
        createBot(-15, 15);
        createBot(15, -15);

        // Эффекты пуль
        const bullets = [];
        const bulletGeometry = new THREE.SphereGeometry(0.05, 8, 8);
        const bulletMaterial = new THREE.MeshBasicMaterial({ color: 0xffff00 });

        function createBulletTrail(from, to) {
            const material = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 2 });
            const points = [from, to];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            
            setTimeout(() => scene.remove(line), 100);
        }

        function createImpactEffect(position) {
            const particleCount = 8;
            const particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.05, 4, 4),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                particle.position.copy(position);
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    Math.random() * 5,
                    (Math.random() - 0.5) * 5
                );
                scene.add(particle);
                particles.push(particle);
            }
            
            setTimeout(() => {
                particles.forEach(p => scene.remove(p));
            }, 500);
        }

        // Мобильное управление
        let leftJoystickActive = false;
        let leftJoystickStart = { x: 0, y: 0 };
        let leftJoystickCurrent = { x: 0, y: 0 };
        let moveVector = { x: 0, y: 0 };

        const leftJoystick = document.getElementById('leftJoystick');
        const leftKnob = leftJoystick.querySelector('.joystickKnob');

        leftJoystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = leftJoystick.getBoundingClientRect();
            leftJoystickStart = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            leftJoystickActive = true;
        });

        leftJoystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!leftJoystickActive) return;
            
            const touch = e.touches[0];
            const dx = touch.clientX - leftJoystickStart.x;
            const dy = touch.clientY - leftJoystickStart.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 35;
            
            if (distance > maxDistance) {
                leftJoystickCurrent = {
                    x: (dx / distance) * maxDistance,
                    y: (dy / distance) * maxDistance
                };
            } else {
                leftJoystickCurrent = { x: dx, y: dy };
            }
            
            leftKnob.style.transform = `translate(calc(-50% + ${leftJoystickCurrent.x}px), calc(-50% + ${leftJoystickCurrent.y}px))`;
            
            moveVector = {
                x: leftJoystickCurrent.x / maxDistance,
                y: leftJoystickCurrent.y / maxDistance
            };
        });

        leftJoystick.addEventListener('touchend', (e) => {
            e.preventDefault();
            leftJoystickActive = false;
            leftJoystickCurrent = { x: 0, y: 0 };
            leftKnob.style.transform = 'translate(-50%, -50%)';
            moveVector = { x: 0, y: 0 };
        });

        // Обзор камеры (правая часть экрана)
        let touchStartX = 0;
        let touchStartY = 0;
        let isLooking = false;

        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('#mobileControls')) return;
            
            const touch = e.touches[0];
            if (touch.clientX > window.innerWidth / 2) {
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
                isLooking = true;
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (!isLooking) return;
            
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            
            player.rotation.y -= dx * 0.005;
            player.rotation.x -= dy * 0.005;
            player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotation.x));
            
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
        });

        document.addEventListener('touchend', () => {
            isLooking = false;
        });

        // Кнопки
        let isFiring = false;

        document.getElementById('fireButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            isFiring = true;
        });

        document.getElementById('fireButton').addEventListener('touchend', (e) => {
            e.preventDefault();
            isFiring = false;
        });

        document.getElementById('reloadButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            reload();
        });

        document.getElementById('jumpButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (player.position.y <= 1.7) {
                player.velocity.y = 5;
            }
        });

        // Стрельба
        let lastShot = 0;
        const fireRate = 100;

        function shoot() {
            const now = Date.now();
            if (now - lastShot < fireRate || player.isReloading || player.ammo <= 0) return;
            
            lastShot = now;
            player.ammo--;
            updateHUD();

            // Отдача
            player.rotation.x += 0.03;

            // Raycast
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);
            
            const botMeshes = bots.map(b => b.mesh);
            const intersects = raycaster.intersectObjects([...botMeshes, ...walls]);

            if (intersects.length > 0) {
                const hit = intersects[0];
                createBulletTrail(camera.position.clone(), hit.point.clone());
                
                if (hit.object.geometry.type === 'BoxGeometry' && hit.object.material.color.getHex() === 0xff0000) {
                    const hitBot = bots.find(b => b.mesh === hit.object);
                    if (hitBot) {
                        hitBot.health -= 25;
                        createImpactEffect(hit.point);
                        
                        if (hitBot.health <= 0) {
                            scene.remove(hitBot.mesh);
                            bots.splice(bots.indexOf(hitBot), 1);
                        }
                    }
                } else {
                    createImpactEffect(hit.point);
                }
            }

            if (player.ammo <= 0 && player.reserveAmmo > 0) {
                reload();
            }
        }

        // Перезарядка
        function reload() {
            if (player.isReloading || player.ammo === player.maxAmmo || player.reserveAmmo <= 0) return;
            
            player.isReloading = true;
            document.getElementById('ammo').textContent = '🔄 ПЕРЕЗАРЯДКА...';
            
            setTimeout(() => {
                const needed = player.maxAmmo - player.ammo;
                const toLoad = Math.min(needed, player.reserveAmmo);
                player.ammo += toLoad;
                player.reserveAmmo -= toLoad;
                player.isReloading = false;
                updateHUD();
            }, 2500);
        }

        // Обновление HUD
        function updateHUD() {
            document.getElementById('health').textContent = `❤️ ${player.health}`;
            document.getElementById('ammo').textContent = `🔫 ${player.ammo} / ${player.reserveAmmo}`;
        }

        // Движение игрока
        function updatePlayer(delta) {
            const speed = 5;
            const direction = new THREE.Vector3();

            direction.x = moveVector.x;
            direction.z = moveVector.y;
            direction.normalize();
            direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);

            player.position.x += direction.x * speed * delta;
            player.position.z += direction.z * speed * delta;

            // Прыжок и гравитация
            player.velocity.y -= 9.8 * delta;
            player.position.y += player.velocity.y * delta;

            if (player.position.y < 1.7) {
                player.position.y = 1.7;
                player.velocity.y = 0;
            }

            // Ограничение арены
            player.position.x = Math.max(-19, Math.min(19, player.position.x));
            player.position.z = Math.max(-19, Math.min(19, player.position.z));

            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotation.y;
            camera.rotation.x = player.rotation.x;
        }

        // ИИ ботов
        function updateBots(delta) {
            bots.forEach(bot => {
                const distance = bot.mesh.position.distanceTo(player.position);
                
                // Движение
                bot.mesh.position.x += bot.moveDirection.x * 2 * delta;
                bot.mesh.position.z += bot.moveDirection.z * 2 * delta;
                
                // Смена направления
                if (Math.random() < 0.02) {
                    bot.moveDirection = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                }
                
                // Ограничение арены
                bot.mesh.position.x = Math.max(-18, Math.min(18, bot.mesh.position.x));
                bot.mesh.position.z = Math.max(-18, Math.min(18, bot.mesh.position.z));

                // Стрельба
                const now = Date.now();
                if (distance < 20 && now - bot.lastShot > 1500) {
                    bot.lastShot = now;
                    player.health -= 10;
                    updateHUD();
                    
                    // Эффект урона
                    const overlay = document.getElementById('damageOverlay');
                    overlay.style.opacity = '1';
                    setTimeout(() => overlay.style.opacity = '0', 300);
                    
                    if (player.health <= 0) {
                        alert('Ты проиграл! Перезагрузи страницу.');
                        location.reload();
                    }
                }

                bot.mesh.lookAt(player.position.x, bot.mesh.position.y, player.position.z);
            });
        }

        // Игровой цикл
        let lastTime = Date.now();

        function animate() {
            requestAnimationFrame(animate);
            
            const now = Date.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePlayer(delta);
            updateBots(delta);

            if (isFiring) shoot();

            renderer.render(scene, camera);
        }

        // Старт
        document.getElementById('startButton').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            animate();
        });

        // Адаптация
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
