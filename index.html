<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🎮 Game Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;color:#fff;overflow-x:hidden}
.app{max-width:500px;margin:0 auto;padding:15px;min-height:100vh}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:12px 18px;background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:15px;box-shadow:0 8px 32px rgba(0,0,0,0.15)}
.logo{font-size:20px;font-weight:bold}
.time-counter{font-size:14px;font-weight:600;color:#ffd93d;font-family:monospace}
.hero{text-align:center;margin-bottom:25px}
.hero h1{font-size:28px;margin-bottom:8px;text-shadow:2px 2px 4px rgba(0,0,0,0.3)}
.hero p{font-size:16px;opacity:0.9}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.game-card{padding:22px 10px;border-radius:15px;text-align:center;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(0,0,0,0.2);min-height:90px;display:flex;align-items:center;justify-content:center}
.game-card:active{transform:scale(0.95)}
.game-name{font-size:14px;font-weight:600;text-shadow:1px 1px 2px rgba(0,0,0,0.3)}
.footer{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);border-radius:15px;padding:15px;text-align:center}
.stats{display:flex;justify-content:space-around;font-size:13px}
.back-btn{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-size:14px}
.game-container{background:rgba(255,255,255,0.95);border-radius:20px;padding:15px;min-height:500px;color:#333}
canvas{display:block;margin:0 auto;border-radius:10px;background:#fff;box-shadow:0 4px 15px rgba(0,0,0,0.1);max-width:100%;touch-action:none}
.game-title{text-align:center;font-size:22px;font-weight:bold;margin-bottom:15px;color:#333}
.game-score{text-align:center;font-size:18px;margin-bottom:12px;color:#667eea;font-weight:600}
.btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;padding:10px 24px;border-radius:10px;font-size:15px;cursor:pointer;margin:8px 4px;box-shadow:0 4px 15px rgba(0,0,0,0.2)}
.btn:active{transform:scale(0.95)}
.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:0 auto}
.memory-card{aspect-ratio:1;background:#667eea;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:28px;cursor:pointer;transition:all 0.3s}
.memory-card.flipped{background:#fff;border:2px solid #667eea}
.memory-card.matched{background:#4ecdc4;opacity:0.7}
.clicker-btn{width:180px;height:180px;border-radius:50%;background:linear-gradient(135deg,#ffd93d,#ff9a3c);border:none;font-size:55px;cursor:pointer;margin:30px auto;display:block;box-shadow:0 8px 25px rgba(0,0,0,0.3);transition:all 0.1s}
.clicker-btn:active{transform:scale(0.9)}
.reaction-box{width:100%;height:280px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:all 0.3s;padding:20px;text-align:center}
.grid-2048{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:320px;margin:0 auto;background:#bbada0;padding:8px;border-radius:10px}
.tile-2048{aspect-ratio:1;background:#cdc1b4;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;color:#776e65}
.rps-buttons{display:flex;justify-content:center;gap:15px;margin:20px 0}
.rps-btn{font-size:50px;background:none;border:none;cursor:pointer;transition:all 0.2s}
.rps-btn:active{transform:scale(1.2)}
.math-input{width:180px;padding:12px;font-size:22px;text-align:center;border:2px solid #667eea;border-radius:10px;margin:15px auto;display:block}
.simon-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:280px;margin:15px auto}
.simon-btn{aspect-ratio:1;border-radius:15px;border:none;cursor:pointer;opacity:0.6;transition:all 0.2s}
.simon-btn.active{opacity:1;transform:scale(1.05)}
.catch-area{position:relative;width:100%;height:350px;background:#f0f0f0;border-radius:15px;overflow:hidden}
.catch-circle{width:50px;height:50px;border-radius:50%;background:#ff512f;position:absolute;cursor:pointer;transition:all 0.2s}
.maze-grid{display:grid;gap:2px;max-width:320px;margin:0 auto;background:#333;padding:8px;border-radius:10px}
.maze-cell{aspect-ratio:1;background:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px}
.maze-cell.wall{background:#333}
.maze-cell.player{background:#667eea}
.maze-cell.end{background:#4ecdc4}
.bubble-area{position:relative;width:100%;height:400px;background:linear-gradient(180deg,#a8edea,#fed6e3);border-radius:15px;overflow:hidden}
.bubble{position:absolute;border-radius:50%;background:rgba(196,113,245,0.7);cursor:pointer}
.dpad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:5px;justify-content:center;margin:15px auto}
.dpad button{background:#667eea;color:#fff;border:none;border-radius:10px;font-size:24px;cursor:pointer}
.dpad button:active{background:#764ba2}
.dpad .empty{visibility:hidden}
.guess-input{width:180px;padding:12px;font-size:22px;text-align:center;border:2px solid #667eea;border-radius:10px;margin:10px auto;display:block}
.ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto}
.ttt-cell{aspect-ratio:1;background:#667eea;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <div class="logo">🎮 Game Hub</div>
    <div class="time-counter" id="timeCounter">⏱ 00:00:00</div>
  </header>

  <div id="mainMenu">
    <div class="hero">
      <h1>Добро пожаловать!</h1>
      <p>15 игр, чтобы убить время</p>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
    <footer class="footer">
      <div class="stats">
        <div>🏆 Игр сыграно: <span id="gamesPlayed">0</span></div>
        <div>⭐ Лучший счёт: <span id="bestScore">0</span></div>
      </div>
    </footer>
  </div>

  <div id="gameScreen" style="display:none;">
    <header class="header">
      <button class="back-btn" onclick="showMenu()">← Назад</button>
      <div class="time-counter" id="gameTimeCounter">⏱ 00:00:00</div>
    </header>
    <div class="game-container" id="gameContainer"></div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0f0c29'); }

const games = [
  { id: 'snake', name: '🐍 Змейка', color: '#00d26a' },
  { id: 'tictactoe', name: '⭕ Крестики-нолики', color: '#ff6b6b' },
  { id: 'memory', name: '🧠 Memory', color: '#4ecdc4' },
  { id: 'clicker', name: '👆 Кликер', color: '#ffd93d' },
  { id: 'reaction', name: '⚡ Реакция', color: '#ff9a3c' },
  { id: '2048', name: '🔢 2048', color: '#ed4264' },
  { id: 'flappy', name: '🐦 Flappy', color: '#56ab2f' },
  { id: 'guess', name: '🎯 Угадай число', color: '#8e2de2' },
  { id: 'rps', name: '✊ КНБ', color: '#f953c6' },
  { id: 'pong', name: '🏓 Понг', color: '#00c9ff' },
  { id: 'catch', name: '🎯 Поймай кружок', color: '#ff512f' },
  { id: 'math', name: '🧮 Математика', color: '#f093fb' },
  { id: 'simon', name: '🎵 Simon', color: '#43cea2' },
  { id: 'maze', name: '🌀 Лабиринт', color: '#36d1dc' },
  { id: 'bubble', name: '🫧 Пузырьки', color: '#c471f5' }
];

const grid = document.getElementById('gamesGrid');
games.forEach(game => {
  const card = document.createElement('div');
  card.className = 'game-card';
  card.style.background = `linear-gradient(135deg, ${game.color}, ${game.color}99)`;
  card.innerHTML = `<div class="game-name">${game.name}</div>`;
  card.onclick = () => startGame(game.id);
  grid.appendChild(card);
});

// Счётчик времени
let totalSeconds = parseInt(localStorage.getItem('totalTime') || '0');
let sessionStart = Date.now();

function formatTime(s) {
  const h = Math.floor(s / 3600).toString().padStart(2, '0');
  const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
  const sec = Math.floor(s % 60).toString().padStart(2, '0');
  return `${h}:${m}:${sec}`;
}

function updateTime() {
  const current = totalSeconds + Math.floor((Date.now() - sessionStart) / 1000);
  const timeStr = '⏱ ' + formatTime(current);
  document.getElementById('timeCounter').textContent = timeStr;
  const gc = document.getElementById('gameTimeCounter');
  if (gc) gc.textContent = timeStr;
}
setInterval(updateTime, 1000);
updateTime();

function saveTime() {
  const final = totalSeconds + Math.floor((Date.now() - sessionStart) / 1000);
  localStorage.setItem('totalTime', final);
}
window.addEventListener('beforeunload', saveTime);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveTime(); });

document.getElementById('gamesPlayed').textContent = localStorage.getItem('gamesPlayed') || 0;
document.getElementById('bestScore').textContent = localStorage.getItem('bestScore') || 0;

function updateBestScore(score) {
  const best = parseInt(localStorage.getItem('bestScore') || '0');
  if (score > best) {
    localStorage.setItem('bestScore', score);
    document.getElementById('bestScore').textContent = score;
  }
}

function startGame(gameId) {
  localStorage.setItem('gamesPlayed', (+localStorage.getItem('gamesPlayed') + 1));
  document.getElementById('gamesPlayed').textContent = localStorage.getItem('gamesPlayed');
  document.getElementById('mainMenu').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  loadGame(gameId);
}

function showMenu() {
  document.getElementById('mainMenu').style.display = 'block';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('gameContainer').innerHTML = '';
  if (window.currentGameCleanup) { window.currentGameCleanup(); window.currentGameCleanup = null; }
}

function loadGame(id) {
  const container = document.getElementById('gameContainer');
  container.innerHTML = '';
  if (window.currentGameCleanup) { window.currentGameCleanup(); window.currentGameCleanup = null; }
  
  switch(id) {
    case 'snake': initSnake(container); break;
    case 'tictactoe': initTicTacToe(container); break;
    case 'memory': initMemory(container); break;
    case 'clicker': initClicker(container); break;
    case 'reaction': initReaction(container); break;
    case '2048': init2048(container); break;
    case 'flappy': initFlappy(container); break;
    case 'guess': initGuess(container); break;
    case 'rps': initRPS(container); break;
    case 'pong': initPong(container); break;
    case 'catch': initCatch(container); break;
    case 'math': initMath(container); break;
    case 'simon': initSimon(container); break;
    case 'maze': initMaze(container); break;
    case 'bubble': initBubble(container); break;
  }
}

// 1. ЗМЕЙКА
function initSnake(c) {
  c.innerHTML = `<div class="game-title">🐍 Змейка</div>
    <div class="game-score">Счёт: <span id="snakeScore">0</span></div>
    <canvas id="snakeCanvas" width="300" height="300"></canvas>
    <div style="text-align:center;margin-top:15px;"><button class="btn" onclick="startSnake()">Начать</button></div>`;
}
function startSnake() {
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const size = 15, cols = 20;
  let snake = [{x:10,y:10}], food = {x:5,y:5}, dx=1, dy=0, score=0, gameLoop;
  
  function draw() {
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,300,300);
    ctx.fillStyle='#ff512f'; ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
    snake.forEach((s,i)=>{ ctx.fillStyle=i===0?'#00d26a':'#4ecdc4'; ctx.fillRect(s.x*size,s.y*size,size-2,size-2); });
  }
  function update() {
    const head = {x:snake[0].x+dx, y:snake[0].y+dy};
    if (head.x<0||head.x>=cols||head.y<0||head.y>=cols||snake.some(s=>s.x===head.x&&s.y===head.y)) {
      clearInterval(gameLoop); updateBestScore(score); alert('Конец! Счёт: '+score); return;
    }
    snake.unshift(head);
    if (head.x===food.x&&head.y===food.y) {
      score++; document.getElementById('snakeScore').textContent=score;
      food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*cols)};
    } else snake.pop();
    draw();
  }
  const keyHandler = (e) => {
    if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;}
    if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;}
    if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;}
    if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}
  };
  document.addEventListener('keydown', keyHandler);
  let tsx,tsy;
  canvas.ontouchstart=(e)=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;};
  canvas.ontouchend=(e)=>{
    const dx2=e.changedTouches[0].clientX-tsx, dy2=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx2)>Math.abs(dy2)){if(dx2>0&&dx===0){dx=1;dy=0;}else if(dx2<0&&dx===0){dx=-1;dy=0;}}
    else{if(dy2>0&&dy===0){dx=0;dy=1;}else if(dy2<0&&dy===0){dx=0;dy=-1;}}
  };
  draw();
  gameLoop = setInterval(update,150);
  window.currentGameCleanup = () => { clearInterval(gameLoop); document.removeEventListener('keydown', keyHandler); };
}

// 2. КРЕСТИКИ-НОЛИКИ
function initTicTacToe(c) {
  c.innerHTML = `<div class="game-title">⭕ Крестики-нолики</div>
    <div id="tttStatus" style="text-align:center;font-size:20px;margin:20px 0;">Ваш ход (X)</div>
    <div class="ttt-board" id="tttBoard"></div>
    <div style="text-align:center;margin-top:20px;"><button class="btn" onclick="resetTTT()">Заново</button></div>`;
  resetTTT();
}
let tttBoard=[],tttGameOver=false;
function resetTTT() {
  tttBoard=Array(9).fill(''); tttGameOver=false;
  const board=document.getElementById('tttBoard'); board.innerHTML='';
  for(let i=0;i<9;i++){
    const cell=document.createElement('div'); cell.className='ttt-cell';
    cell.onclick=()=>tttMove(i); board.appendChild(cell);
  }
  document.getElementById('tttStatus').textContent='Ваш ход (X)';
}
function tttMove(i) {
  if(tttBoard[i]||tttGameOver) return;
  tttBoard[i]='X'; updateTTTBoard();
  if(checkTTTWin('X')){document.getElementById('tttStatus').textContent='Вы победили! 🎉';tttGameOver=true;updateBestScore(1);return;}
  if(!tttBoard.includes('')){document.getElementById('tttStatus').textContent='Ничья!';tttGameOver=true;return;}
  setTimeout(()=>{
    const empty=tttBoard.map((v,i)=>v===''?i:null).filter(v=>v!==null);
    tttBoard[empty[Math.floor(Math.random()*empty.length)]]='O'; updateTTTBoard();
    if(checkTTTWin('O')){document.getElementById('tttStatus').textContent='Компьютер победил!';tttGameOver=true;}
    else if(!tttBoard.includes('')){document.getElementById('tttStatus').textContent='Ничья!';tttGameOver=true;}
  },300);
}
function updateTTTBoard(){
  const cells=document.getElementById('tttBoard').children;
  for(let i=0;i<9;i++){cells[i].textContent=tttBoard[i];cells[i].style.color=tttBoard[i]==='X'?'#fff':'#ffd93d';}
}
function checkTTTWin(p){
  const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  return w.some(([a,b,c])=>tttBoard[a]===p&&tttBoard[b]===p&&tttBoard[c]===p);
}

// 3. MEMORY
function initMemory(c) {
  const emojis=['🎮','🎯','🎲','🎪','🎨','🎭','🎵','🎸'];
  const cards=[...emojis,...emojis].sort(()=>Math.random()-0.5);
  c.innerHTML = `<div class="game-title">🧠 Memory</div>
    <div class="game-score">Ходов: <span id="memoryMoves">0</span></div>
    <div class="memory-grid" id="memoryGrid"></div>`;
  const grid=document.getElementById('memoryGrid');
  let flipped=[],moves=0;
  cards.forEach((emoji,i)=>{
    const card=document.createElement('div'); card.className='memory-card';
    card.dataset.emoji=emoji;
    card.onclick=()=>{
      if(flipped.length===2||card.classList.contains('flipped')||card.classList.contains('matched')) return;
      card.classList.add('flipped'); card.textContent=emoji; flipped.push(card);
      if(flipped.length===2){
        moves++; document.getElementById('memoryMoves').textContent=moves;
        if(flipped[0].dataset.emoji===flipped[1].dataset.emoji){
          flipped.forEach(c=>c.classList.add('matched')); flipped=[];
          if(document.querySelectorAll('.matched').length===cards.length){
            setTimeout(()=>{alert('Победа! Ходов: '+moves);updateBestScore(100-moves);},300);
          }
        } else {
          setTimeout(()=>{flipped.forEach(c=>{c.classList.remove('flipped');c.textContent='';});flipped=[];},1000);
        }
      }
    };
    grid.appendChild(card);
  });
}

// 4. КЛИКЕР
function initClicker(c) {
  let clicks=parseInt(localStorage.getItem('clickerScore')||'0');
  c.innerHTML = `<div class="game-title">👆 Кликер</div>
    <div class="game-score">Кликов: <span id="clickerCount">${clicks}</span></div>
    <button class="clicker-btn" id="clickerBtn">👆</button>
    <div style="text-align:center;"><button class="btn" onclick="localStorage.setItem('clickerScore','0');document.getElementById('clickerCount').textContent='0'">Сбросить</button></div>`;
  document.getElementById('clickerBtn').onclick=()=>{
    clicks++; localStorage.setItem('clickerScore',clicks);
    document.getElementById('clickerCount').textContent=clicks;
    updateBestScore(clicks);
  };
}

// 5. РЕАКЦИЯ
function initReaction(c) {
  c.innerHTML = `<div class="game-title">⚡ Реакция</div>
    <div class="game-score">Лучшее: <span id="reactionBest">${localStorage.getItem('reactionBest')||'-'}</span> мс</div>
    <div class="reaction-box" id="reactionBox" style="background:#ff6b6b;">Нажмите, когда станет зелёным</div>`;
  const box=document.getElementById('reactionBox');
  let startTime,timeout,waiting=false;
  box.onclick=()=>{
    if(!waiting){
      box.style.background='#ff6b6b'; box.textContent='Ждите...'; waiting=true;
      timeout=setTimeout(()=>{box.style.background='#4ecdc4';box.textContent='ЖМИТЕ!';startTime=Date.now();},1000+Math.random()*3000);
    } else {
      if(box.style.backgroundColor==='rgb(78, 205, 196)'){
        const r=Date.now()-startTime;
        const best=localStorage.getItem('reactionBest');
        if(!best||r<+best){localStorage.setItem('reactionBest',r);document.getElementById('reactionBest').textContent=r;}
        box.style.background='#667eea'; box.textContent=`Ваше время: ${r} мс. Нажмите для новой игры`;
        waiting=false;
      } else {
        clearTimeout(timeout); box.style.background='#ff6b6b'; box.textContent='Слишком рано! Нажмите для новой игры'; waiting=false;
      }
    }
  };
  window.currentGameCleanup=()=>clearTimeout(timeout);
}

// 6. 2048
function init2048(c) {
  c.innerHTML = `<div class="game-title">🔢 2048</div>
    <div class="game-score">Счёт: <span id="score2048">0</span></div>
    <div class="grid-2048" id="grid2048"></div>
    <div style="text-align:center;margin-top:15px;"><button class="btn" onclick="reset2048()">Заново</button></div>`;
  reset2048();
}
let board2048=[],score2048=0;
function reset2048(){
  board2048=Array(4).fill(null).map(()=>Array(4).fill(0)); score2048=0;
  addTile2048(); addTile2048(); update2048();
}
function addTile2048(){
  const empty=[];
  for(let i=0;i<4;i++)for(let j=0;j<4;j++)if(board2048[i][j]===0)empty.push([i,j]);
  if(empty.length>0){const[i,j]=empty[Math.floor(Math.random()*empty.length)];board2048[i][j]=Math.random()<0.9?2:4;}
}
function update2048(){
  const grid=document.getElementById('grid2048'); grid.innerHTML='';
  document.getElementById('score2048').textContent=score2048;
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){
    const tile=document.createElement('div'); tile.className='tile-2048';
    const v=board2048[i][j];
    if(v>0){tile.textContent=v;tile.style.background=getTileColor2048(v);tile.style.color=v>4?'#fff':'#776e65';}
    grid.appendChild(tile);
  }
}
function getTileColor2048(v){
  const c={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
  return c[v]||'#3c3a32';
}
function move2048(dir){
  const b=board2048.map(r=>[...r]); let moved=false;
  function slide(row){
    row=row.filter(v=>v!==0);
    for(let i=0;i<row.length-1;i++)if(row[i]===row[i+1]){row[i]*=2;score2048+=row[i];row.splice(i+1,1);}
    while(row.length<4)row.push(0);
    return row;
  }
  if(dir==='left')for(let i=0;i<4;i++){const n=slide(board2048[i]);if(n.join()!==b[i].join())moved=true;board2048[i]=n;}
  if(dir==='right')for(let i=0;i<4;i++){const n=slide(board2048[i].reverse()).reverse();if(n.join()!==b[i].join())moved=true;board2048[i]=n;}
  if(dir==='up')for(let j=0;j<4;j++){const col=[board2048[0][j],board2048[1][j],board2048[2][j],board2048[3][j]];const n=slide(col);if(n.join()!==col.join())moved=true;for(let i=0;i<4;i++)board2048[i][j]=n[i];}
  if(dir==='down')for(let j=0;j<4;j++){const col=[board2048[3][j],board2048[2][j],board2048[1][j],board2048[0][j]];const n=slide(col);if(n.join()!==col.join())moved=true;for(let i=0;i<4;i++)board2048[3-i][j]=n[i];}
  if(moved){addTile2048();update2048();updateBestScore(score2048);}
}
document.addEventListener('keydown',(e)=>{
  if(!document.getElementById('grid2048'))return;
  if(e.key==='ArrowLeft')move2048('left');
  if(e.key==='ArrowRight')move2048('right');
  if(e.key==='ArrowUp')move2048('up');
  if(e.key==='ArrowDown')move2048('down');
});

// 7. FLAPPY
function initFlappy(c) {
  c.innerHTML = `<div class="game-title">🐦 Flappy</div>
    <div class="game-score">Счёт: <span id="flappyScore">0</span></div>
    <canvas id="flappyCanvas" width="300" height="400"></canvas>
    <div style="text-align:center;margin-top:15px;"><button class="btn" onclick="startFlappy()">Начать</button></div>`;
}
function startFlappy(){
  const canvas=document.getElementById('flappyCanvas'),ctx=canvas.getContext('2d');
  let bird={x:50,y:200,vy:0},pipes=[],score=0,gameLoop,gameOver=false;
  function addPipe(){const gap=120,y=Math.random()*(canvas.height-gap-100)+50;pipes.push({x:canvas.width,y,gap});}
  function draw(){
    ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#5a3';pipes.forEach(p=>{ctx.fillRect(p.x,0,50,p.y);ctx.fillRect(p.x,p.y+p.gap,50,canvas.height);});
    ctx.fillStyle='#ffd93d';ctx.beginPath();ctx.arc(bird.x,bird.y,15,0,Math.PI*2);ctx.fill();
  }
  function update(){
    if(gameOver)return;
    bird.vy+=0.5; bird.y+=bird.vy;
    pipes.forEach(p=>p.x-=2);
    if(pipes.length===0||pipes[pipes.length-1].x<canvas.width-150)addPipe();
    pipes=pipes.filter(p=>p.x>-50);
    pipes.forEach(p=>{
      if(bird.x+15>p.x&&bird.x-15<p.x+50){
        if(bird.y-15<p.y||bird.y+15>p.y+p.gap)endGame();
      }
      if(Math.abs(p.x-bird.x)<2&&!p.scored){score++;p.scored=true;document.getElementById('flappyScore').textContent=score;}
    });
    if(bird.y>canvas.height||bird.y<0)endGame();
    draw();
  }
  function endGame(){gameOver=true;clearInterval(gameLoop);updateBestScore(score);alert('Конец! Счёт: '+score);}
  const jump=()=>{if(!gameOver)bird.vy=-8;};
  canvas.onclick=jump;
  const keyH=(e)=>{if(e.code==='Space')jump();};
  document.addEventListener('keydown',keyH);
  addPipe();
  gameLoop=setInterval(update,20);
  window.currentGameCleanup=()=>{clearInterval(gameLoop);document.removeEventListener('keydown',keyH);};
}

// 8. УГАДАЙ ЧИСЛО
function initGuess(c) {
  const target=Math.floor(Math.random()*100)+1; let attempts=0;
  c.innerHTML = `<div class="game-title">🎯 Угадай число (1-100)</div>
    <input type="number" class="guess-input" id="guessInput" placeholder="Ваше число">
    <div style="text-align:center;"><button class="btn" onclick="checkGuess()">Проверить</button></div>
    <div id="guessResult" style="text-align:center;font-size:18px;margin-top:20px;min-height:30px;"></div>
    <div style="text-align:center;margin-top:10px;">Попыток: <span id="guessAttempts">0</span></div>`;
  window.checkGuess=()=>{
    const v=parseInt(document.getElementById('guessInput').value);
    if(isNaN(v))return;
    attempts++; document.getElementById('guessAttempts').textContent=attempts;
    const res=document.getElementById('guessResult');
    if(v===target){res.textContent='🎉 Угадал! За '+attempts+' попыток';res.style.color='#4ecdc4';updateBestScore(100-attempts);}
    else if(v<target){res.textContent='↑ Больше';res.style.color='#ff9a3c';}
    else{res.textContent='↓ Меньше';res.style.color='#ff6b6b';}
  };
}

function initRPS(c) {
  c.innerHTML = `<div class="game-title">✊ Камень-Ножницы-Бумага</div>
    <div class="game-score">Счёт: <span id="rpsScore">0</span> | <span id="rpsLoss">0</span></div>
    <div id="rpsResult" style="text-align:center;font-size:18px;margin:20px 0;min-height:60px;">Выбери!</div>
    <div class="rps-buttons">
      <button class="rps-btn" onclick="playRPS('rock')">✊</button>
      <button class="rps-btn" onclick="playRPS('paper')">✋</button>
      <button class="rps-btn" onclick="playRPS('scissors')">✌️</button>
    </div>`;
  let w=0,l=0;
  window.playRPS=(p)=>{
    const opts=['rock','paper','scissors'],emo={rock:'✊',paper:'✋',scissors:'✌️'};
    const ai=opts[Math.floor(Math.random()*3)];
    let res;
    if(p===ai)res='Ничья!';
    else if((p==='rock'&&ai==='scissors')||(p==='paper'&&ai==='rock')||(p==='scissors'&&ai==='paper')){res='Ты победил! 🎉';w++;}
    else{res='Ты проиграл 😢';l++;}
    document.getElementById('rpsResult').innerHTML=`Ты: ${emo[p]} vs Комп: ${emo[ai]}<br>${res}`;
    document.getElementById('rpsScore').textContent=w;
    document.getElementById('rpsLoss').textContent=l;
    updateBestScore(w);
  };
}

// 10. PONG
function initPong(c) {
  c.innerHTML = `<div class="game-title">🏓 Понг</div>
    <div class="game-score">Ты: <span id="pongP">0</span> | Комп: <span id="pongC">0</span></div>
    <canvas id="pongCanvas" width="300" height="400"></canvas>`;
  const canvas=document.getElementById('pongCanvas'),ctx=canvas.getContext('2d');
  let playerY=170,aiY=170,ballX=150,ballY=200,bvx=3,bvy=2,pScore=0,cScore=0;
  const pH=60,pW=10;
  function draw(){
    ctx.fillStyle='#000';ctx.fillRect(0,0,300,400);
    ctx.fillStyle='#fff';ctx.fillRect(10,playerY,pW,pH);ctx.fillRect(280,aiY,pW,pH);
    ctx.beginPath();ctx.arc(ballX,ballY,6,0,Math.PI*2);ctx.fill();
  }
  function update(){
    ballX+=bvx;ballY+=bvy;
    if(ballY<6||ballY>394)bvy=-bvy;
    if(ballX<20&&ballY>playerY&&ballY<playerY+pH)bvx=-bvx;
    if(ballX>280&&ballY>aiY&&ballY<aiY+pH)bvx=-bvx;
    if(ballX<0){cScore++;document.getElementById('pongC').textContent=cScore;ballX=150;ballY=200;bvx=3;}
    if(ballX>300){pScore++;document.getElementById('pongP').textContent=pScore;ballX=150;ballY=200;bvx=-3;updateBestScore(pScore);}
    if(ballY>aiY+30)aiY+=2.5;else aiY-=2.5;
    draw();
  }
  canvas.ontouchmove=(e)=>{e.preventDefault();const r=canvas.getBoundingClientRect();playerY=(e.touches[0].clientY-r.top)-pH/2;};
  canvas.onmousemove=(e)=>{const r=canvas.getBoundingClientRect();playerY=(e.clientY-r.top)-pH/2;};
  const loop=setInterval(update,20);
  window.currentGameCleanup=()=>clearInterval(loop);
}

// 12. МАТЕМАТИКА
function initMath(c) {
  c.innerHTML = `<div class="game-title">🧮 Быстрая математика</div>
    <div class="game-score">Счёт: <span id="mathScore">0</span> | Время: <span id="mathTime">30</span>с</div>
    <div id="mathQuestion" style="text-align:center;font-size:32px;margin:20px 0;"></div>
    <input type="number" class="math-input" id="mathInput">
    <div style="text-align:center;"><button class="btn" onclick="checkMath()">Ответить</button></div>`;
  let score=0,time=30,answer;
  function newQ(){
    const a=Math.floor(Math.random()*20)+1,b=Math.floor(Math.random()*20)+1;
    const ops=['+','-','*'];const op=ops[Math.floor(Math.random()*3)];
    answer=op==='+'?a+b:op==='-'?a-b:a*b;
    document.getElementById('mathQuestion').textContent=`${a} ${op} ${b} = ?`;
    document.getElementById('mathInput').value='';
    document.getElementById('mathInput').focus();
  }
  window.checkMath=()=>{
    if(parseInt(document.getElementById('mathInput').value)===answer){score++;document.getElementById('mathScore').textContent=score;}
    newQ();
  };
  document.getElementById('mathInput').onkeydown=(e)=>{if(e.key==='Enter')checkMath();};
  newQ();
  const timer=setInterval(()=>{
    time--;document.getElementById('mathTime').textContent=time;
    if(time<=0){clearInterval(timer);updateBestScore(score);alert('Время вышло! Счёт: '+score);}
  },1000);
  window.currentGameCleanup=()=>clearInterval(timer);
}

// 13. SIMON
function initSimon(c) {
  c.innerHTML = `<div class="game-title">🎵 Simon</div>
    <div class="game-score">Уровень: <span id="simonLevel">0</span></div>
    <div class="simon-buttons" id="simonButtons">
      <button class="simon-btn" style="background:#ff6b6b;" data-i="0"></button>
      <button class="simon-btn" style="background:#4ecdc4;" data-i="1"></button>
      <button class="simon-btn" style="background:#ffd93d;" data-i="2"></button>
      <button class="simon-btn" style="background:#667eea;" data-i="3"></button>
    </div>
    <div style="text-align:center;"><button class="btn" onclick="startSimon()">Начать</button></div>
    <div id="simonStatus" style="text-align:center;margin-top:15px;"></div>`;
  let sequence=[],playerSeq=[],level=0,isPlaying=false;
  function flash(i){
    const btn=document.querySelectorAll('.simon-btn')[i];
    btn.classList.add('active');
    setTimeout(()=>btn.classList.remove('active'),400);
  }
  function playSeq(){
    isPlaying=true;document.getElementById('simonStatus').textContent='Смотри...';
    let i=0;
    const int=setInterval(()=>{
      flash(sequence[i]);i++;
      if(i>=sequence.length){clearInterval(int);isPlaying=false;document.getElementById('simonStatus').textContent='Твой ход!';}
    },600);
  }
  window.startSimon=()=>{
    sequence=[];level=0;nextLevel();
  };
  function nextLevel(){
    level++;document.getElementById('simonLevel').textContent=level;
    sequence.push(Math.floor(Math.random()*4));
    playerSeq=[];
    setTimeout(playSeq,500);
  }
  document.querySelectorAll('.simon-btn').forEach(btn=>{
    btn.onclick=()=>{
      if(isPlaying)return;
      const i=parseInt(btn.dataset.i);
      flash(i); playerSeq.push(i);
      if(playerSeq[playerSeq.length-1]!==sequence[playerSeq.length-1]){
        document.getElementById('simonStatus').textContent='Ошибка! Уровень: '+level;
        updateBestScore(level); return;
      }
      if(playerSeq.length===sequence.length)nextLevel();
    };
  });
}

// 14. ЛАБИРИНТ
function initMaze(c) {
  const size=9;
  const maze=generateMaze(size);
  c.innerHTML = `<div class="game-title">🌀 Лабиринт</div>
    <div class="maze-grid" id="mazeGrid" style="grid-template-columns:repeat(${size},1fr);"></div>
    <div class="dpad">
      <div class="empty"></div><button onclick="moveMaze(0,-1)">↑</button><div class="empty"></div>
      <button onclick="moveMaze(-1,0)">←</button><div class="empty"></div><button onclick="moveMaze(1,0)">→</button>
      <div class="empty"></div><button onclick="moveMaze(0,1)">↓</button><div class="empty"></div>
    </div>`;
  window.mazeData={maze,player:{x:0,y:0},end:{x:size-1,y:size-1},size};
  renderMaze();
}
function generateMaze(size){
  const m=Array(size).fill(null).map(()=>Array(size).fill(1));
  function carve(x,y){
    m[y][x]=0;
    const dirs=[[0,-2],[0,2],[-2,0],[2,0]].sort(()=>Math.random()-0.5);
    for(const[dx,dy]of dirs){
      const nx=x+dx,ny=y+dy;
      if(nx>0&&nx<size&&ny>0&&ny<size&&m[ny][nx]===1){
        m[y+dy/2][x+dx/2]=0; carve(nx,ny);
      }
    }
  }
  carve(0,0); m[size-1][size-1]=0;
  return m;
}
function renderMaze(){
  const{maze,player,end,size}=window.mazeData;
  const grid=document.getElementById('mazeGrid'); grid.innerHTML='';
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const cell=document.createElement('div'); cell.className='maze-cell';
    if(maze[y][x]===1)cell.classList.add('wall');
    if(x===player.x&&y===player.y){cell.classList.add('player');cell.textContent='🔵';}
    if(x===end.x&&y===end.y){cell.classList.add('end');cell.textContent='🏁';}
    grid.appendChild(cell);
  }
}
window.moveMaze=(dx,dy)=>{
  const{maze,player,end}=window.mazeData;
  const nx=player.x+dx,ny=player.y+dy;
  if(nx>=0&&nx<maze[0].length&&ny>=0&&ny<maze.length&&maze[ny][nx]===0){
    player.x=nx;player.y=ny; renderMaze();
    if(nx===end.x&&ny===end.y){alert('🎉 Победа!');updateBestScore(10);}
  }
};
