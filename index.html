<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🎮 GAME HUB PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;font-family:'Segoe UI',Arial,sans-serif}
body{background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#fff;overflow-x:hidden;min-height:100vh}
.screen{display:none;min-height:100vh;padding-bottom:80px}
.screen.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* Навигация */
.nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,12,41,.95);backdrop-filter:blur(10px);display:flex;justify-content:space-around;padding:10px 0;border-top:2px solid #667eea;z-index:100}
.nav-btn{background:none;border:none;color:#aaa;font-size:24px;padding:8px 20px;cursor:pointer;transition:all .3s;position:relative}
.nav-btn.active{color:#667eea;transform:scale(1.2)}
.nav-btn::after{content:attr(data-label);position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;opacity:0;transition:opacity .3s}
.nav-btn:hover::after,.nav-btn.active::after{opacity:1}

/* Заголовок */
.header{padding:20px;text-align:center;background:linear-gradient(135deg,#667eea,#764ba2);margin-bottom:20px;box-shadow:0 4px 20px rgba(102,126,234,.3)}
.header h1{font-size:28px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 10px rgba(0,0,0,.5)}

/* Профиль */
.profile-card{background:linear-gradient(135deg,#667eea,#764ba2);border-radius:20px;padding:20px;margin:15px;box-shadow:0 8px 30px rgba(102,126,234,.4);animation:slideIn .5s}
@keyframes slideIn{from{transform:translateX(-100%);opacity:0}to{transform:translateX(0);opacity:1}}
.profile-header{display:flex;align-items:center;gap:15px;margin-bottom:20px}
.avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#f093fb,#f5576c);display:flex;align-items:center;justify-content:center;font-size:30px;box-shadow:0 4px 15px rgba(240,147,251,.5)}
.profile-info h2{font-size:20px;margin-bottom:5px}
.profile-info p{font-size:12px;opacity:.8}
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-box{background:rgba(255,255,255,.1);border-radius:12px;padding:12px;text-align:center;backdrop-filter:blur(10px)}
.stat-box b{display:block;font-size:24px;color:#ffd700;margin-bottom:3px}
.stat-box small{font-size:11px;opacity:.8}

/* Ленты */
.section{margin:20px 15px}
.section-title{font-size:18px;font-weight:bold;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:20px;background:linear-gradient(180deg,#667eea,#764ba2);border-radius:2px}
.recent-games,.top-games{display:flex;gap:10px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.recent-games::-webkit-scrollbar,.top-games::-webkit-scrollbar{display:none}
.game-preview{min-width:120px;background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:12px;padding:12px;text-align:center;box-shadow:0 4px 15px rgba(0,0,0,.3);transition:transform .2s}
.game-preview:active{transform:scale(.95)}
.game-preview-icon{font-size:36px;margin-bottom:8px}
.game-preview-name{font-size:12px;font-weight:bold}
.game-preview-stat{font-size:10px;opacity:.8;margin-top:4px}

/* Сетка игр */
.games-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding:15px}
.game-card{background:linear-gradient(135deg,var(--c1),var(--c2));border-radius:16px;padding:15px;text-align:center;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px rgba(0,0,0,.3);position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,.2) 50%,transparent 70%);transform:translateX(-100%);transition:transform .6s}
.game-card:hover::before{transform:translateX(100%)}
.game-card:active{transform:scale(.95)}
.game-icon{font-size:42px;margin-bottom:8px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.game-name{font-size:13px;font-weight:bold;margin-bottom:4px}
.game-stat{font-size:10px;opacity:.8;background:rgba(0,0,0,.3);padding:3px 6px;border-radius:8px;display:inline-block}

/* Игровой экран */
.game-screen{background:linear-gradient(135deg,#0f0c29,#302b63)}
.game-header{background:rgba(0,0,0,.5);padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #667eea}
.back-btn{background:linear-gradient(135deg,#f093fb,#f5576c);border:none;color:#fff;padding:8px 16px;border-radius:20px;cursor:pointer;font-weight:bold;font-size:13px}
.game-title{font-size:18px;font-weight:bold}
.game-content{padding:15px;min-height:calc(100vh - 120px)}

/* Canvas игры */
canvas{display:block;margin:0 auto;background:#1a1a2e;border-radius:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:100%;touch-action:none}

/* UI элементы */
.btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:12px 24px;border-radius:25px;cursor:pointer;font-weight:bold;font-size:15px;margin:5px;transition:all .3s;box-shadow:0 4px 15px rgba(102,126,234,.4)}
.btn:active{transform:scale(.95)}
.btn-secondary{background:linear-gradient(135deg,#4a5568,#2d3748)}
.score-display{text-align:center;font-size:32px;font-weight:bold;margin:20px 0;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.5)}

/* Grid игры */
.grid-game{display:grid;gap:4px;margin:20px auto;max-width:400px}
.grid-cell{aspect-ratio:1;background:linear-gradient(135deg,#4a5568,#2d3748);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;cursor:pointer;transition:all .2s}
.grid-cell:active{transform:scale(.9)}

/* Модальное окно */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.open{display:flex;animation:fadeIn .3s}
.modal-box{background:linear-gradient(135deg,#1a1a2e,#2d2b55);border:2px solid #667eea;border-radius:20px;padding:30px;max-width:400px;width:100%;text-align:center;box-shadow:0 0 50px rgba(102,126,234,.5)}
.modal-title{font-size:28px;color:#ffd700;margin-bottom:15px}
.modal-text{margin-bottom:20px;line-height:1.6}

/* Анимации */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.bounce{animation:bounce 1s infinite}
.pulse{animation:pulse 2s infinite}
</style>
</head>
<body>

<!-- ГЛАВНАЯ -->
<div id="home" class="screen active">
  <div class="header">
    <h1>🎮 GAME HUB PRO</h1>
  </div>
  
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">👤</div>
      <div class="profile-info">
        <h2>Игрок</h2>
        <p id="profileTime">Время: 0 мин</p>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><b id="totalGames">0</b><small>Игр сыграно</small></div>
      <div class="stat-box"><b id="winRate">0%</b><small>Побед</small></div>
    </div>
  </div>
  
  <div class="section">
    <div class="section-title">🕐 Последние игры</div>
    <div class="recent-games" id="recentGames"></div>
  </div>
  
  <div class="section">
    <div class="section-title">🏆 Топ игр</div>
    <div class="top-games" id="topGames"></div>
  </div>
  
  <div class="section">
    <div class="section-title">🎮 Все игры (20)</div>
    <div class="games-grid" id="gamesGrid"></div>
  </div>
</div>

<!-- ПРОФИЛЬ -->
<div id="profile" class="screen">
  <div class="header">
    <h1>👤 ПРОФИЛЬ</h1>
  </div>
  <div class="profile-card">
    <div class="profile-header">
      <div class="avatar">👤</div>
      <div class="profile-info">
        <h2>Статистика</h2>
        <p id="profileTime2">Время: 0 мин</p>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><b id="totalGames2">0</b><small>Игр сыграно</small></div>
      <div class="stat-box"><b id="totalWins">0</b><small>Побед</small></div>
      <div class="stat-box"><b id="totalLosses">0</b><small>Поражений</small></div>
      <div class="stat-box"><b id="winRate2">0%</b><small>Процент побед</small></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">📊 Детальная статистика</div>
    <div id="detailedStats" style="padding:10px"></div>
  </div>
</div>

<!-- ИГРОВОЙ ЭКРАН -->
<div id="gameScreen" class="screen game-screen">
  <div class="game-header">
    <button class="back-btn" onclick="goHome()">← НАЗАД</button>
    <div class="game-title" id="currentGameTitle">Игра</div>
    <div style="font-size:12px">🏆 <span id="currentGameBest">0</span></div>
  </div>
  <div class="game-content" id="gameContent"></div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="resultModal">
  <div class="modal-box">
    <div class="modal-title" id="resultTitle">Результат</div>
    <div class="modal-text" id="resultText"></div>
    <button class="btn" onclick="closeModal()">OK</button>
  </div>
</div>

<!-- НАВИГАЦИЯ -->
<div class="nav">
  <button class="nav-btn active" data-label="Главная" onclick="showScreen('home')">🏠</button>
  <button class="nav-btn" data-label="Профиль" onclick="showScreen('profile')">👤</button>
</div>

<script>
// ============ ДАННЫЕ ============
let data = JSON.parse(localStorage.getItem('gamehub_data') || '{}');
if(!data.stats) data.stats = {};
if(!data.recent) data.recent = [];
if(!data.time) data.time = 0;
if(!data.plays) data.plays = {};

function saveData(){ localStorage.setItem('gamehub_data', JSON.stringify(data)); }

// ============ ИГРЫ ============
const games = [
  {id:'2048',name:'2048',icon:'🔢',c1:'#edc53f',c2:'#f2b179'},
  {id:'snake',name:'Змейка',icon:'🐍',c1:'#4ade80',c2:'#22c55e'},
  {id:'tetris',name:'Тетрис',icon:'🟦',c1:'#3b82f6',c2:'#60a5fa'},
  {id:'memory',name:'Memory',icon:'🎴',c1:'#a855f7',c2:'#c084fc'},
  {id:'mines',name:'Сапёр',icon:'💣',c1:'#ef4444',c2:'#f87171'},
  {id:'flappy',name:'Flappy',icon:'🐦',c1:'#06b6d4',c2:'#22d3ee'},
  {id:'pong',name:'Pong',icon:'🏓',c1:'#f59e0b',c2:'#fbbf24'},
  {id:'breakout',name:'Арканоид',icon:'🧱',c1:'#ec4899',c2:'#f472b6'},
  {id:'reaction',name:'Реакция',icon:'⚡',c1:'#fbbf24',c2:'#fcd34d'},
  {id:'color',name:'Цвета',icon:'🎨',c1:'#8b5cf6',c2:'#a78bfa'},
  {id:'guess',name:'Угадай',icon:'🔮',c1:'#14b8a6',c2:'#2dd4bf'},
  {id:'rps',name:'Камень-Нож-Бумага',icon:'✊',c1:'#f97316',c2:'#fb923c'},
  {id:'ttt',name:'Крестики-Нолики',icon:'✖️',c1:'#6366f1',c2:'#818cf8'},
  {id:'whack',name:'Ударь крота',icon:'🔨',c1:'#dc2626',c2:'#ef4444'},
  {id:'simon',name:'Саймон',icon:'🎵',c1:'#10b981',c2:'#34d399'},
  {id:'typing',name:'Печать',icon:'⌨️',c1:'#64748b',c2:'#94a3b8'},
  {id:'math',name:'Математика',icon:'🧮',c1:'#0ea5e9',c2:'#38bdf8'},
  {id:'puzzle',name:'Пятнашки',icon:'🧩',c1:'#d946ef',c2:'#e879f9'},
  {id:'clicker',name:'Кликер',icon:'🍪',c1:'#f59e0b',c2:'#fbbf24'},
  {id:'dodge',name:'Уклонист',icon:'🌟',c1:'#ec4899',c2:'#f472b6'}
];

// ============ UI ============
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  if(id==='home') document.querySelector('.nav-btn[data-label="Главная"]').classList.add('active');
  if(id==='profile') document.querySelector('.nav-btn[data-label="Профиль"]').classList.add('active');
  if(id==='home') renderHome();
  if(id==='profile') renderProfile();
}

function renderHome(){
  // Время
  const mins = Math.floor(data.time/60);
  document.getElementById('profileTime').textContent = `Время: ${mins} мин`;
  
  // Статистика
  let totalGames = 0, totalWins = 0;
  for(const id in data.stats){
    totalGames += data.stats[id].plays || 0;
    totalWins += data.stats[id].wins || 0;
  }
  document.getElementById('totalGames').textContent = totalGames;
  document.getElementById('winRate').textContent = totalGames ? Math.round(totalWins/totalGames*100)+'%' : '0%';
  
  // Последние игры
  const recent = document.getElementById('recentGames');
  recent.innerHTML = '';
  data.recent.slice(-5).reverse().forEach(id => {
    const g = games.find(x=>x.id===id);
    if(!g) return;
    const div = document.createElement('div');
    div.className = 'game-preview';
    div.style.setProperty('--c1',g.c1);
    div.style.setProperty('--c2',g.c2);
    div.innerHTML = `<div class="game-preview-icon">${g.icon}</div><div class="game-preview-name">${g.name}</div><div class="game-preview-stat">Рекорд: ${data.stats[id]?.best||0}</div>`;
    div.onclick = () => startGame(id);
    recent.appendChild(div);
  });
  
  // Топ игр
  const top = document.getElementById('topGames');
  top.innerHTML = '';
  const sorted = Object.entries(data.plays).sort((a,b)=>b[1]-a[1]).slice(0,2);
  sorted.forEach(([id,count]) => {
    const g = games.find(x=>x.id===id);
    if(!g) return;
    const div = document.createElement('div');
    div.className = 'game-preview';
    div.style.setProperty('--c1',g.c1);
    div.style.setProperty('--c2',g.c2);
    div.innerHTML = `<div class="game-preview-icon">${g.icon}</div><div class="game-preview-name">${g.name}</div><div class="game-preview-stat">${count} игр</div>`;
    div.onclick = () => startGame(id);
    top.appendChild(div);
  });
  
  // Все игры
  const grid = document.getElementById('gamesGrid');
  grid.innerHTML = '';
  games.forEach(g => {
    const card = document.createElement('div');
    card.className = 'game-card';
    card.style.setProperty('--c1',g.c1);
    card.style.setProperty('--c2',g.c2);
    const stat = data.stats[g.id];
    card.innerHTML = `<div class="game-icon">${g.icon}</div><div class="game-name">${g.name}</div><div class="game-stat">${stat?`🏆 ${stat.best||0}`:'Новое'}</div>`;
    card.onclick = () => startGame(g.id);
    grid.appendChild(card);
  });
}

function renderProfile(){
  const mins = Math.floor(data.time/60);
  document.getElementById('profileTime2').textContent = `Время: ${mins} мин`;
  
  let totalGames = 0, totalWins = 0, totalLosses = 0;
  for(const id in data.stats){
    totalGames += data.stats[id].plays || 0;
    totalWins += data.stats[id].wins || 0;
    totalLosses += data.stats[id].losses || 0;
  }
  document.getElementById('totalGames2').textContent = totalGames;
  document.getElementById('totalWins').textContent = totalWins;
  document.getElementById('totalLosses').textContent = totalLosses;
  document.getElementById('winRate2').textContent = totalGames ? Math.round(totalWins/totalGames*100)+'%' : '0%';
  
  const detailed = document.getElementById('detailedStats');
  detailed.innerHTML = '';
  games.forEach(g => {
    const s = data.stats[g.id];
    if(!s || !s.plays) return;
    const div = document.createElement('div');
    div.style.cssText = 'background:rgba(255,255,255,.1);padding:10px;border-radius:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center';
    div.innerHTML = `<div><b>${g.icon} ${g.name}</b><br><small>Игр: ${s.plays} | Побед: ${s.wins||0}</small></div><div style="text-align:right"><b style="color:#ffd700">${s.best||0}</b><br><small>Рекорд</small></div>`;
    detailed.appendChild(div);
  });
}

function startGame(id){
  document.getElementById('home').classList.remove('active');
  document.getElementById('profile').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  
  const g = games.find(x=>x.id===id);
  document.getElementById('currentGameTitle').textContent = g.name;
  document.getElementById('currentGameBest').textContent = data.stats[id]?.best || 0;
  
  // Добавляем в последние
  if(!data.recent.includes(id)) data.recent.push(id);
  else { data.recent = data.recent.filter(x=>x!==id); data.recent.push(id); }
  
  // Увеличиваем счётчик игр
  if(!data.plays[id]) data.plays[id] = 0;
  data.plays[id]++;
  
  if(!data.stats[id]) data.stats[id] = {plays:0,wins:0,losses:0,best:0};
  data.stats[id].plays++;
  
  saveData();
  
  // Запускаем игру
  const content = document.getElementById('gameContent');
  content.innerHTML = '';
  
  const startTime = Date.now();
  const interval = setInterval(() => {
    data.time++;
    if(Date.now() - startTime > 60000) saveData();
  }, 1000);
  
  window.currentGameInterval = interval;
  window.currentGameId = id;
  
  // Запуск конкретной игры
  if(id==='2048') game2048(content);
  else if(id==='snake') gameSnake(content);
  else if(id==='tetris') gameTetris(content);
  else if(id==='memory') gameMemory(content);
  else if(id==='mines') gameMines(content);
  else if(id==='flappy') gameFlappy(content);
  else if(id==='pong') gamePong(content);
  else if(id==='breakout') gameBreakout(content);
  else if(id==='reaction') gameReaction(content);
  else if(id==='color') gameColor(content);
  else if(id==='guess') gameGuess(content);
  else if(id==='rps') gameRPS(content);
  else if(id==='ttt') gameTTT(content);
  else if(id==='whack') gameWhack(content);
  else if(id==='simon') gameSimon(content);
  else if(id==='typing') gameTyping(content);
  else if(id==='math') gameMath(content);
  else if(id==='puzzle') gamePuzzle(content);
  else if(id==='clicker') gameClicker(content);
  else if(id==='dodge') gameDodge(content);
}

function goHome(){
  if(window.currentGameInterval) clearInterval(window.currentGameInterval);
  if(window.currentGameLoop) cancelAnimationFrame(window.currentGameLoop);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('home').classList.add('active');
  renderHome();
}

function updateBest(score){
  const id = window.currentGameId;
  if(!data.stats[id]) data.stats[id] = {plays:0,wins:0,losses:0,best:0};
  if(score > data.stats[id].best){
    data.stats[id].best = score;
    document.getElementById('currentGameBest').textContent = score;
  }
  saveData();
}

function addWin(){
  const id = window.currentGameId;
  if(!data.stats[id]) data.stats[id] = {plays:0,wins:0,losses:0,best:0};
  data.stats[id].wins++;
  saveData();
}

function addLoss(){
  const id = window.currentGameId;
  if(!data.stats[id]) data.stats[id] = {plays:0,wins:0,losses:0,best:0};
  data.stats[id].losses++;
  saveData();
}

function showResult(title, text){
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultText').innerHTML = text;
  document.getElementById('resultModal').classList.add('open');
}

function closeModal(){
  document.getElementById('resultModal').classList.remove('open');
}

// ============ ИГРЫ (упрощённые версии) ============

// 2048
function game2048(container){
  container.innerHTML = '<div class="score-display" id="score2048">0</div><div class="grid-game" id="grid2048" style="grid-template-columns:repeat(4,80px)"></div>';
  let grid = Array(4).fill().map(()=>Array(4).fill(0));
  let score = 0;
  
  function addRandom(){
    const empty = [];
    for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(!grid[y][x]) empty.push([y,x]);
    if(empty.length){
      const [y,x] = empty[Math.floor(Math.random()*empty.length)];
      grid[y][x] = Math.random()<.9?2:4;
    }
  }
  
  function render(){
    const el = document.getElementById('grid2048');
    el.innerHTML = '';
    for(let y=0;y<4;y++) for(let x=0;x<4;x++){
      const cell = document.createElement('div');
      cell.className = 'grid-cell';
      cell.style.width = cell.style.height = '80px';
      if(grid[y][x]){
        cell.textContent = grid[y][x];
        cell.style.background = `hsl(${grid[y][x]*20},70%,50%)`;
      }
      el.appendChild(cell);
    }
    document.getElementById('score2048').textContent = score;
  }
  
  function move(dir){
    let moved = false;
    const newGrid = Array(4).fill().map(()=>Array(4).fill(0));
    
    for(let i=0;i<4;i++){
      let line = [];
      for(let j=0;j<4;j++){
        if(dir==='left') line.push(grid[i][j]);
        else if(dir==='right') line.push(grid[i][3-j]);
        else if(dir==='up') line.push(grid[j][i]);
        else line.push(grid[3-j][i]);
      }
      line = line.filter(x=>x);
      for(let j=0;j<line.length-1;j++){
        if(line[j]===line[j+1]){
          line[j]*=2;
          score+=line[j];
          line.splice(j+1,1);
        }
      }
      while(line.length<4) line.push(0);
      
      for(let j=0;j<4;j++){
        if(dir==='left') newGrid[i][j]=line[j];
        else if(dir==='right') newGrid[i][3-j]=line[j];
        else if(dir==='up') newGrid[j][i]=line[j];
        else newGrid[3-j][i]=line[j];
      }
    }
    
    for(let y=0;y<4;y++) for(let x=0;x<4;x++) if(grid[y][x]!==newGrid[y][x]) moved=true;
    grid = newGrid;
    if(moved){
      addRandom();
      render();
      updateBest(score);
    }
  }
  
  addRandom();
  addRandom();
  render();
  
  let touchStartX, touchStartY;
  container.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });
  container.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>30) move('right');
      else if(dx<-30) move('left');
    } else {
      if(dy>30) move('down');
      else if(dy<-30) move('up');
    }
  });
}

// Змейка
function gameSnake(container){
  container.innerHTML = '<div class="score-display" id="scoreSnake">0</div><canvas id="snakeCanvas" width="300" height="300"></canvas>';
  const canvas = document.getElementById('snakeCanvas');
  const ctx = canvas.getContext('2d');
  const size = 15;
  let snake = [{x:10,y:10}];
  let dir = {x:1,y:0};
  let food = {x:5,y:5};
  let score = 0;
  let gameOver = false;
  
  function draw(){
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0,0,300,300);
    
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(food.x*size,food.y*size,size-2,size-2);
    
    snake.forEach((s,i) => {
      ctx.fillStyle = i===0?'#4ade80':'#22c55e';
      ctx.fillRect(s.x*size,s.y*size,size-2,size-2);
    });
  }
  
  function update(){
    if(gameOver) return;
    
    const head = {x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    
    if(head.x<0||head.x>=20||head.y<0||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){
      gameOver = true;
      addLoss();
      showResult('💀 GAME OVER',`Очки: ${score}<br>Рекорд: ${data.stats.snake?.best||0}`);
      return;
    }
    
    snake.unshift(head);
    
    if(head.x===food.x&&head.y===food.y){
      score++;
      updateBest(score);
      food = {x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};
    } else {
      snake.pop();
    }
    
    draw();
    document.getElementById('scoreSnake').textContent = score;
  }
  
  const interval = setInterval(update, 150);
  window.currentGameInterval = interval;
  
  let touchStartX, touchStartY;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  });
  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if(Math.abs(dx)>Math.abs(dy)){
      if(dx>0&&dir.x===0) dir={x:1,y:0};
      else if(dx<0&&dir.x===0) dir={x:-1,y:0};
    } else {
      if(dy>0&&dir.y===0) dir={x:0,y:1};
      else if(dy<0&&dir.y===0) dir={x:0,y:-1};
    }
  });
  
  draw();
}

function gameMemory(c){
  c.innerHTML='<div class="score-display" id="scoreMem">0</div><div class="grid-game" id="gridMem" style="grid-template-columns:repeat(4,70px)"></div>';
  const emojis=['🎮','🎯','🎨','🎭','🎪','🎸','🎺','🎻'];
  let cards=[...emojis,...emojis].sort(()=>Math.random()-.5);
  let flipped=[],matched=0,moves=0;
  
  function render(){
    const el=document.getElementById('gridMem');
    el.innerHTML='';
    cards.forEach((emoji,i)=>{
      const cell=document.createElement('div');
      cell.className='grid-cell';
      cell.style.width=cell.style.height='70px';
      if(flipped.includes(i)||matched>=cards.length){
        cell.textContent=emoji;
        cell.style.background='#4ade80';
      } else {
        cell.textContent='?';
        cell.style.background='#6366f1';
      }
      cell.onclick=()=>{
        if(flipped.length<2&&!flipped.includes(i)){
          flipped.push(i);
          render();
          if(flipped.length===2){
            moves++;
            setTimeout(()=>{
              if(cards[flipped[0]]===cards[flipped[1]]){
                matched+=2;
                if(matched===cards.length){
                  addWin();
                  showResult('🏆 ПОБЕДА!',`Ходов: ${moves}`);
                }
              }
              flipped=[];
              render();
            },1000);
          }
        }
      };
      el.appendChild(cell);
    });
    document.getElementById('scoreMem').textContent=`Ходов: ${moves}`;
  }
  render();
}

function gameFlappy(c){
  c.innerHTML='<div class="score-display" id="scoreFlappy">0</div><canvas id="flappyCanvas" width="300" height="400"></canvas>';
  const canvas=document.getElementById('flappyCanvas');
  const ctx=canvas.getContext('2d');
  let bird={x:50,y:200,vy:0};
  let pipes=[];
  let score=0;
  let frame=0;
  let running=true;
  
  function draw(){
    ctx.fillStyle='#87CEEB';
    ctx.fillRect(0,0,300,400);
    
    ctx.fillStyle='#fbbf24';
    ctx.beginPath();
    ctx.arc(bird.x,bird.y,15,0,Math.PI*2);
    ctx.fill();
    
    pipes.forEach(p=>{
      ctx.fillStyle='#4ade80';
      ctx.fillRect(p.x,0,40,p.top);
      ctx.fillRect(p.x,p.top+100,40,400);
    });
  }
  
  function update(){
    if(!running) return;
    bird.vy+=0.5;
    bird.y+=bird.vy;
    
    frame++;
    if(frame%90===0){
      pipes.push({x:300,top:50+Math.random()*200});
    }
    
    pipes.forEach(p=>{
      p.x-=2;
      if(!p.passed&&p.x+40<bird.x){
        p.passed=true;
        score++;
        updateBest(score);
      }
    });
    pipes=pipes.filter(p=>p.x>-50);
    
    if(bird.y>400||bird.y<0){
      running=false;
      addLoss();
      showResult('💀 GAME OVER',`Очки: ${score}`);
      return;
    }
    
    pipes.forEach(p=>{
      if(bird.x+15>p.x&&bird.x-15<p.x+40){
        if(bird.y-15<p.top||bird.y+15>p.top+100){
          running=false;
          addLoss();
          showResult('💀 GAME OVER',`Очки: ${score}`);
        }
      }
    });
    
    draw();
    document.getElementById('scoreFlappy').textContent=score;
    if(running) window.currentGameLoop=requestAnimationFrame(update);
  }
  
  canvas.onclick=()=>bird.vy=-8;
  update();
}
