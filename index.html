<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyAzSOfIQgBZCWgUIbmelgScYUkASQnEuUY",
    authDomain: "checkers-online-e69c7.firebaseapp.com",
    databaseURL: "https://checkers-online-e69c7-default-rtdb.firebaseio.com",
    projectId: "checkers-online-e69c7",
    storageBucket: "checkers-online-e69c7.firebasestorage.app",
    messagingSenderId: "1096047488420",
    appId: "1:1096047488420:web:ca70692d2259244dabe531"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const SIZE = 8;
let board = [];
let currentPlayer = 'white';
let selected = null;
let gameOver = false;
let myColor = 'white';
let isOnline = false;
let roomId = null;
let roomRef = null;
let gameMode = 'ai';
let aiDifficulty = 'medium';
let stats = { wins: 0, losses: 0 };

const saved = localStorage.getItem('checkersStats');
if (saved) stats = JSON.parse(saved);
updateStats();

function showScreen(screen) {
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('createRoomScreen').style.display = 'none';
    document.getElementById('joinScreen').style.display = 'none';
    document.getElementById('searchingScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'none';
    if (screen === 'menu') document.getElementById('menuScreen').style.display = 'flex';
    else if (screen === 'join') document.getElementById('joinScreen').style.display = 'flex';
}

function startAIGame() {
    gameMode = 'ai';
    isOnline = false;
    initBoard();
    currentPlayer = 'white';
    myColor = 'white';
    selected = null;
    gameOver = false;
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    render();
}

function createRoom() {
    roomId = generateRoomCode();
    roomRef = db.ref('rooms/' + roomId);
    initBoard();
    roomRef.set({
        status: 'waiting',
        creator: 'player1',
        board: boardToData(),
        currentPlayer: 'white',
        createdAt: Date.now()
    });
    document.getElementById('roomCodeDisplay').textContent = roomId;
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('createRoomScreen').style.display = 'flex';
    
    roomRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        if (data.status === 'playing' && !isOnline) {
            isOnline = true;
            myColor = 'white'; // Создатель всегда белый
            gameMode = 'online';
            if (data.board) {
                board = dataToBoard(data.board);
                currentPlayer = data.currentPlayer || 'white';
            }
            gameOver = false;
            document.getElementById('createRoomScreen').style.display = 'none';
            document.getElementById('gameScreen').style.display = 'block';
            render();
        }
        if (data.status === 'finished') handleGameEnd(data.winner);
    });
}

function copyRoomCode() {
    navigator.clipboard.writeText(roomId).then(() => alert('Код скопирован! Отправь его другу'));
}

function cancelRoom() {
    if (roomRef) roomRef.remove();
    showScreen('menu');
}

function joinRoom() {
    const code = document.getElementById('joinCodeInput').value.trim().toUpperCase();
    if (code.length !== 6) { alert('Введи 6-значный код'); return; }
    
    roomRef = db.ref('rooms/' + code);
    roomRef.once('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) { alert('Комната не найдена'); return; }
        if (data.status !== 'waiting') { alert('Комната уже занята'); return; }
        
        roomId = code;
        isOnline = true;
        myColor = 'black'; // Присоединяющийся всегда чёрный
        gameMode = 'online';
        
        // Ждём пока создатель обновит статус
        roomRef.on('value', (snap) => {
            const d = snap.val();
            if (!d) return;
            
            if (d.status === 'playing') {
                if (d.board) {
                    board = dataToBoard(d.board);
                    currentPlayer = d.currentPlayer || 'white';
                }
                gameOver = false;
                document.getElementById('joinScreen').style.display = 'none';
                document.getElementById('gameScreen').style.display = 'block';
                render();
                
                // Обновляем статус комнаты
                roomRef.update({ player2: 'player2' });
            }
            
            if (d.status === 'finished') handleGameEnd(d.winner);
            
            // Обновляем доску при каждом изменении
            if (d.board && d.currentPlayer !== currentPlayer && !gameOver) {
                board = dataToBoard(d.board);
                currentPlayer = d.currentPlayer;
                render();
            }
        });
    });
}

function quickMatch() {
    document.getElementById('menuScreen').style.display = 'none';
    document.getElementById('searchingScreen').style.display = 'flex';
    
    const searchRef = db.ref('quickMatch');
    const myId = 'player_' + Date.now();
    
    searchRef.child(myId).set({ 
        timestamp: Date.now(), 
        status: 'searching',
        color: 'white' // По умолчанию белый
    });
    
    searchRef.once('value', (snapshot) => {
        const players = snapshot.val();
        if (!players) return;
        
        const waitingPlayers = Object.keys(players).filter(id => 
            id !== myId && players[id].status === 'searching'
        );
        
        if (waitingPlayers.length > 0) {
            const opponentId = waitingPlayers[0];
            // Первый найденный игрок - белый, второй - чёрный
            searchRef.child(myId).update({ color: 'black' });
            startQuickGame(myId, opponentId, searchRef, 'black');
        } else {
            searchRef.child(myId).on('value', (snap) => {
                const data = snap.val();
                if (data && data.status === 'matched') {
                    startQuickGame(myId, data.opponent, searchRef, data.color);
                }
            });
            
            setTimeout(() => {
                searchRef.child(myId).remove();
                if (document.getElementById('searchingScreen').style.display !== 'none') {
                    alert('Не удалось найти соперника. Попробуй позже.');
                    showScreen('menu');
                }
            }, 30000);
        }
    });
}

function startQuickGame(myId, opponentId, searchRef, myAssignedColor) {
    searchRef.child(myId).update({ status: 'matched', opponent: opponentId });
    searchRef.child(opponentId).update({ status: 'matched', opponent: myId });
    
    roomId = 'quick_' + Date.now();
    roomRef = db.ref('rooms/' + roomId);
    initBoard();
    
    isOnline = true;
    myColor = myAssignedColor; // Используем назначенный цвет
    gameMode = 'online';
    gameOver = false;
    currentPlayer = 'white';
    
    roomRef.set({ 
        status: 'playing', 
        board: boardToData(), 
        currentPlayer: 'white', 
        player1: myId,
        player2: opponentId,
        player1Color: 'white',
        player2Color: 'black'
    });
    
    document.getElementById('searchingScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'block';
    render();
    
    roomRef.on('value', (snapshot) => {
        const d = snapshot.val();
        if (!d) return;
        
        if (d.board && d.currentPlayer !== currentPlayer && !gameOver) {
            board = dataToBoard(d.board);
            currentPlayer = d.currentPlayer;
            render();
        }
        
        if (d.status === 'finished') handleGameEnd(d.winner);
    });
}

function cancelSearch() {
    db.ref('quickMatch').remove();
    showScreen('menu');
}

function boardToData() {
    return board.map(row => row.map(cell => cell ? { color: cell.color, king: cell.king } : null));
}

function dataToBoard(data) {
    if (!data) return [];
    return data.map(row => row.map(cell => cell ? { color: cell.color, king: cell.king } : null));
}

function generateRoomCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let code = '';
    for (let i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
    return code;
}

function initBoard() {
    board = [];
    for (let r = 0; r < SIZE; r++) {
        board[r] = [];
        for (let c = 0; c < SIZE; c++) {
            if ((r + c) % 2 === 1) {
                if (r < 3) board[r][c] = { color: 'black', king: false };
                else if (r > 4) board[r][c] = { color: 'white', king: false };
                else board[r][c] = null;
            } else board[r][c] = null;
        }
    }
}

function render() {
    const boardEl = document.getElementById('board');
    boardEl.innerHTML = '';
    const validMoves = selected ? getValidMoves(selected.r, selected.c) : [];
    const allCaptures = getAllCaptures(currentPlayer);
    
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const cell = document.createElement('div');
            cell.className = `cell ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
            if (selected && selected.r === r && selected.c === c) cell.classList.add('selected');
            if (validMoves.some(m => m.r === r && m.c === c)) cell.classList.add('valid');
            
            const piece = board[r] && board[r][c];
            if (piece) {
                const pieceEl = document.createElement('div');
                pieceEl.className = `piece ${piece.color} ${piece.king ? 'king' : ''}`;
                if (allCaptures.some(m => m.fromR === r && m.fromC === c)) pieceEl.classList.add('must-capture');
                cell.appendChild(pieceEl);
            }
            
            cell.onclick = () => handleCellClick(r, c);
            boardEl.appendChild(cell);
        }
    }
    updateInfo();
}

function updateInfo() {
    const panel = document.getElementById('infoPanel');
    if (gameOver) { 
        panel.textContent = 'Игра окончена'; 
        panel.className = 'info-panel'; 
    } else if (isOnline) {
        if (currentPlayer === myColor) { 
            panel.textContent = 'Твой ход!'; 
            panel.className = 'info-panel white-turn'; 
        } else { 
            panel.textContent = 'Ход соперника...'; 
            panel.className = 'info-panel waiting'; 
        }
    } else {
        panel.textContent = currentPlayer === 'white' ? 'Твой ход (белые)' : 'Ход ИИ (чёрные)';
        panel.className = `info-panel ${currentPlayer}-turn`;
    }
}

function handleCellClick(r, c) {
    if (gameOver) return;
    if (isOnline && currentPlayer !== myColor) return;
    if (!isOnline && currentPlayer !== 'white') return;
    
    const piece = board[r] && board[r][c];
    const allCaptures = getAllCaptures(currentPlayer);
    
    if (selected) {
        const moves = getValidMoves(selected.r, selected.c);
        const move = moves.find(m => m.r === r && m.c === c);
        if (move) { executeMove(selected.r, selected.c, move); return; }
        
        if (piece && piece.color === currentPlayer) {
            if (allCaptures.length > 0 && !allCaptures.some(m => m.fromR === r && m.fromC === c)) return;
            selected = { r, c }; 
            render();
        } else { 
            selected = null; 
            render(); 
        }
    } else if (piece && piece.color === currentPlayer) {
        if (allCaptures.length > 0 && !allCaptures.some(m => m.fromR === r && m.fromC === c)) return;
        selected = { r, c }; 
        render();
    }
}

function executeMove(fromR, fromC, move) {
    const piece = board[fromR][fromC];
    board[move.r][move.c] = piece;
    board[fromR][fromC] = null;
    move.captures.forEach(cap => { board[cap.r][cap.c] = null; });
    
    if ((piece.color === 'white' && move.r === 0) || (piece.color === 'black' && move.r === SIZE - 1)) {
        piece.king = true;
    }
    
    if (move.captures.length > 0 && !gameOver) {
        const furtherCaptures = getCapturesFrom(move.r, move.c);
        if (furtherCaptures.length > 0) { 
            selected = { r: move.r, c: move.c }; 
            render(); 
            return; 
        }
    }
    
    selected = null;
    
    if (!gameOver) {
        currentPlayer = currentPlayer === 'white' ? 'black' : 'white';
        if (isOnline) {
            roomRef.update({ 
                board: boardToData(), 
                currentPlayer: currentPlayer 
            });
        }
        render();
        checkGameOver();
        
        if (!gameOver && !isOnline && currentPlayer === 'black') {
            setTimeout(aiTurn, 600);
        }
    }
}

function getValidMoves(r, c) {
    const piece = board[r] && board[r][c];
    if (!piece) return [];
    
    const captures = getCapturesFrom(r, c);
    if (captures.length > 0) return captures;
    
    const moves = [];
    const directions = piece.king ? [[-1,-1],[-1,1],[1,-1],[1,1]] : 
                      piece.color === 'white' ? [[-1,-1],[-1,1]] : [[1,-1],[1,1]];
    
    directions.forEach(([dr, dc]) => {
        if (piece.king) {
            for (let i = 1; i < SIZE; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
                if (board[nr] && board[nr][nc]) break;
                moves.push({ r: nr, c: nc, captures: [] });
            }
        } else {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && (!board[nr] || !board[nr][nc])) {
                moves.push({ r: nr, c: nc, captures: [] });
            }
        }
    });
    
    return moves;
}

function getCapturesFrom(r, c) {
    const piece = board[r] && board[r][c];
    if (!piece) return [];
    
    const captures = [];
    const directions = [[-1,-1],[-1,1],[1,-1],[1,1]];
    
    directions.forEach(([dr, dc]) => {
        if (piece.king) {
            let foundEnemy = false, enemyR, enemyC;
            for (let i = 1; i < SIZE; i++) {
                const nr = r + dr * i, nc = c + dc * i;
                if (nr < 0 || nr >= SIZE || nc < 0 || nc >= SIZE) break;
                if (board[nr] && board[nr][nc]) {
                    if (foundEnemy) break;
                    if (board[nr][nc].color !== piece.color) { 
                        foundEnemy = true; 
                        enemyR = nr; 
                        enemyC = nc; 
                    } else break;
                } else if (foundEnemy) {
                    captures.push({ r: nr, c: nc, captures: [{ r: enemyR, c: enemyC }] });
                }
            }
        } else {
            const midR = r + dr, midC = c + dc, landR = r + dr * 2, landC = c + dc * 2;
            if (landR >= 0 && landR < SIZE && landC >= 0 && landC < SIZE) {
                const midPiece = board[midR] && board[midR][midC];
                if (midPiece && midPiece.color !== piece.color && (!board[landR] || !board[landR][landC])) {
                    captures.push({ r: landR, c: landC, captures: [{ r: midR, c: midC }] });
                }
            }
        }
    });
    
    return captures;
}

function getAllCaptures(color) {
    const captures = [];
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (board[r] && board[r][c] && board[r][c].color === color) {
                const caps = getCapturesFrom(r, c);
                caps.forEach(cap => { 
                    captures.push({ fromR: r, fromC: c, toR: cap.r, toC: cap.c, captures: cap.captures }); 
                });
            }
        }
    }
    return captures;
}

function hasValidMoves(color) {
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            if (board[r] && board[r][c] && board[r][c].color === color) {
                if (getValidMoves(r, c).length > 0) return true;
            }
        }
    }
    return false;
}

function checkGameOver() {
    const whiteHasMoves = hasValidMoves('white');
    const blackHasMoves = hasValidMoves('black');
    
    if (!whiteHasMoves || !blackHasMoves) {
        gameOver = true;
        if (!whiteHasMoves && !blackHasMoves) { 
            showModal('Ничья!', 'У обоих игроков нет ходов.'); 
        } else if (!whiteHasMoves) {
            if (isOnline) { 
                if (myColor === 'black') { stats.wins++; showModal('Победа!', 'Соперник сдался!'); } 
                else { stats.losses++; showModal('Поражение', 'У тебя нет ходов.'); } 
            } else { 
                stats.losses++; 
                showModal('Поражение', 'У тебя нет ходов. ИИ победил!'); 
            }
        } else {
            if (isOnline) { 
                if (myColor === 'white') { stats.wins++; showModal('Победа!', 'Соперник сдался!'); } 
                else { stats.losses++; showModal('Поражение', 'У соперника нет ходов.'); } 
            } else { 
                stats.wins++; 
                showModal('Победа!', 'У ИИ нет ходов. Ты выиграл!'); 
            }
        }
        updateStats(); 
        saveStats();
        if (isOnline && roomRef) {
            const winner = !whiteHasMoves ? 'black' : 'white';
            roomRef.update({ status: 'finished', winner: winner });
        }
    }
}

function handleGameEnd(winner) {
    gameOver = true;
    if (winner === myColor) { 
        stats.wins++; 
        showModal('Победа!', 'Ты выиграл!'); 
    } else if (winner) { 
        stats.losses++; 
        showModal('Поражение', 'Соперник победил.'); 
    } else { 
        showModal('Ничья!', 'Игра закончилась вничью.'); 
    }
    updateStats(); 
    saveStats();
}

function surrender() {
    if (!confirm('Ты уверен, что хочешь сдаться?')) return;
    gameOver = true;
    stats.losses++;
    updateStats(); 
    saveStats();
    if (isOnline && roomRef) {
        const winner = currentPlayer === 'white' ? 'black' : 'white';
        roomRef.update({ status: 'finished', winner: winner });
    }
    showModal('Сдача', 'Ты сдался. Поражение.');
}

function leaveGame() {
    if (isOnline && roomRef) {
        const winner = currentPlayer === 'white' ? 'black' : 'white';
        roomRef.update({ status: 'finished', winner: winner });
        roomRef.off();
    }
    showScreen('menu');
}

function aiTurn() {
    if (gameOver) return;
    if (!hasValidMoves('black')) { checkGameOver(); return; }
    
    const allCaptures = getAllCaptures('black');
    let moves = [];
    
    if (allCaptures.length > 0) {
        moves = allCaptures.map(m => ({ 
            fromR: m.fromR, fromC: m.fromC, 
            toR: m.toR, toC: m.toC, 
            captures: m.captures 
        }));
    } else {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (board[r] && board[r][c] && board[r][c].color === 'black') {
                    const validMoves = getValidMoves(r, c);
                    validMoves.forEach(m => { 
                        moves.push({ 
                            fromR: r, fromC: c, 
                            toR: m.r, toC: m.c, 
                            captures: m.captures 
                        }); 
                    });
                }
            }
        }
    }
    
    if (moves.length === 0) { checkGameOver(); return; }
    
    let bestMove = aiDifficulty === 'easy' ? 
        moves[Math.floor(Math.random() * moves.length)] :
        aiDifficulty === 'medium' ? 
        moves.reduce((best, move) => { 
            const score = evaluateMove(move); 
            return score > best.score ? { move, score } : best; 
        }, { move: moves[0], score: -Infinity }).move : 
        findBestMove(3);
    
    if (bestMove) {
        const piece = board[bestMove.fromR][bestMove.fromC];
        board[bestMove.toR][bestMove.toC] = piece;
        board[bestMove.fromR][bestMove.fromC] = null;
        bestMove.captures.forEach(cap => { board[cap.r][cap.c] = null; });
        if (bestMove.toR === SIZE - 1) piece.king = true;
        
        if (!gameOver) { 
            currentPlayer = 'white'; 
            render(); 
            checkGameOver(); 
        }
    }
}

function evaluateMove(move) {
    let score = 0;
    if (move.captures.length > 0) score += 10 * move.captures.length;
    if (move.toR === SIZE - 1) score += 5;
    score += Math.random() * 3;
    return score;
}

function findBestMove(depth) {
    let bestMove = null, bestScore = -Infinity;
    const allCaptures = getAllCaptures('black');
    let moves = [];
    
    if (allCaptures.length > 0) {
        moves = allCaptures.map(m => ({ 
            fromR: m.fromR, fromC: m.fromC, 
            toR: m.toR, toC: m.toC, 
            captures: m.captures 
        }));
    } else {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (board[r] && board[r][c] && board[r][c].color === 'black') {
                    const validMoves = getValidMoves(r, c);
                    validMoves.forEach(m => { 
                        moves.push({ 
                            fromR: r, fromC: c, 
                            toR: m.r, toC: m.c, 
                            captures: m.captures 
                        }); 
                    });
                }
            }
        }
    }
    
    moves.forEach(move => {
        const boardCopy = JSON.parse(JSON.stringify(board));
        const piece = board[move.fromR][move.fromC];
        board[move.toR][move.toC] = piece;
        board[move.fromR][move.fromC] = null;
        move.captures.forEach(cap => { board[cap.r][cap.c] = null; });
        if (move.toR === SIZE - 1) piece.king = true;
        
        const score = minimax(depth - 1, false, -Infinity, Infinity);
        board = boardCopy;
        
        if (score > bestScore) { bestScore = score; bestMove = move; }
    });
    
    return bestMove;
}

function minimax(depth, isMaximizing, alpha, beta) {
    if (depth === 0) return evaluateBoard();
    
    const color = isMaximizing ? 'black' : 'white';
    const allCaptures = getAllCaptures(color);
    let moves = [];
    
    if (allCaptures.length > 0) {
        moves = allCaptures.map(m => ({ 
            fromR: m.fromR, fromC: m.fromC, 
            toR: m.toR, toC: m.toC, 
            captures: m.captures 
        }));
    } else {
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                if (board[r] && board[r][c] && board[r][c].color === color) {
                    const validMoves = getValidMoves(r, c);
                    validMoves.forEach(m => { 
                        moves.push({ 
                            fromR: r, fromC: c, 
                            toR: m.r, toC: m.c, 
                            captures: m.captures 
                        }); 
                    });
                }
            }
        }
    }
    
    if (moves.length === 0) return isMaximizing ? -100 : 100;
    
    if (isMaximizing) {
        let maxEval = -Infinity;
        for (const move of moves) {
            const boardCopy = JSON.parse(JSON.stringify(board));
            const piece = board[move.fromR][move.fromC];
            board[move.toR][move.toC] = piece;
            board[move.fromR][move.fromC] = null;
            move.captures.forEach(cap => { board[cap.r][cap.c] = null; });
            if (move.toR === SIZE - 1) piece.king = true;
            
            const eval_ = minimax(depth - 1, false, alpha, beta);
            board = boardCopy;
            maxEval = Math.max(maxEval, eval_);
            alpha = Math.max(alpha, eval_);
            if (beta <= alpha) break;
        }
        return maxEval;
    } else {
        let minEval = Infinity;
        for (const move of moves) {
            const boardCopy = JSON.parse(JSON.stringify(board));
            const piece = board[move.fromR][move.fromC];
            board[move.toR][move.toC] = piece;
            board[move.fromR][move.fromC] = null;
            move.captures.forEach(cap => { board[cap.r][cap.c] = null; });
            if (move.toR === 0) piece.king = true;
            
            const eval_ = minimax(depth - 1, true, alpha, beta);
            board = boardCopy;
            minEval = Math.min(minEval, eval_);
            beta = Math.min(beta, eval_);
            if (beta <= alpha) break;
        }
        return minEval;
    }
}

function evaluateBoard() {
    let score = 0;
    for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
            const piece = board[r] && board[r][c];
            if (piece) { 
                const value = piece.king ? 3 : 1; 
                score += piece.color === 'black' ? value : -value; 
            }
        }
    }
    return score;
}

function showModal(title, text) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalText').textContent = text;
    document.getElementById('modal').classList.add('active');
}

function closeModal() { 
    document.getElementById('modal').classList.remove('active'); 
    if (gameOver) showScreen('menu'); 
}

function updateStats() { 
    document.getElementById('wins').textContent = stats.wins; 
    document.getElementById('losses').textContent = stats.losses; 
}

function saveStats() { 
    localStorage.setItem('checkersStats', JSON.stringify(stats)); 
}

showScreen('menu');
</script>
