<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CITY 3D — прототип</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;overflow:hidden;font-family:Arial,sans-serif;touch-action:none;user-select:none}
canvas#view{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:10px;left:12px;color:#fff;font-size:14px;text-shadow:0 2px 4px #000;z-index:5;line-height:1.6}
#hud b{color:#ffd54a}
#hint{position:fixed;top:50%;left:50%;transform:translateX(-50%);color:#ffd54a;font-size:14px;text-shadow:0 2px 6px #000;z-index:5}
#map{position:fixed;top:10px;right:10px;width:110px;height:110px;border:2px solid #ffffff66;border-radius:6px;z-index:5;background:#222}
.stick{position:fixed;bottom:24px;left:24px;width:120px;height:120px;border-radius:50%;background:#ffffff22;border:2px solid #ffffff55;z-index:10}
.knob{position:absolute;left:37px;top:37px;width:46px;height:46px;border-radius:50%;background:#ffffffaa;pointer-events:none}
.btn{position:fixed;bottom:26px;width:70px;height:70px;border-radius:50%;background:#ffffff2b;border:2px solid #ffffff66;color:#fff;font-size:13px;font-weight:bold;z-index:10;display:flex;align-items:center;justify-content:center;text-align:center}
.btn:active{background:#ffffff77}
#gas{right:24px;bottom:90px;background:#2ecc7155}
#brake{right:110px;bottom:30px;background:#e74c3c55}
#seat{right:24px;bottom:12px;width:64px;height:64px;background:#f1c40f66}
#run{left:160px;bottom:30px;width:60px;height:60px}
#rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9999;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
@media (orientation:portrait){#rotate{display:flex}}
#load{position:fixed;inset:0;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9998;font-size:20px}
</style>
</head>
<body>
<div id="rotate">📱 Поверни телефон<br>горизонтально</div>
<div id="load">Строим город…</div>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="hint"></div>
<canvas id="map" width="140" height="140"></canvas>
<div class="stick" id="stick"><div class="knob" id="knob"></div></div>
<div class="btn" id="gas">ГАЗ</div>
<div class="btn" id="brake">ТОРМ</div>
<div class="btn" id="seat">В<br>МАШИНУ</div>
<div class="btn" id="run">БЕГ</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ---------- БАЗА ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ec9e8);
scene.fog=new THREE.Fog(0x9ec9e8,70,230);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('view'),antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const sun=new THREE.DirectionalLight(0xffffff,.7);sun.position.set(60,100,40);scene.add(sun);

const GRID=6,S=45,HALF=GRID*S/2,ROAD=12;
const buildings=[],cars=[],npcs=[];
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- ГОРОД ---------- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(HALF*2+60,HALF*2+60),new THREE.MeshLambertMaterial({color:0x3b3f43}));
ground.rotation.x=-Math.PI/2;scene.add(ground);

const roadMat=new THREE.MeshLambertMaterial({color:0x26292d});
const lineMat=new THREE.MeshLambertMaterial({color:0xd9c96a});
for(let k=0;k<=GRID;k++){
  const p=k*S-HALF;
  [[0,1],[1,0]].forEach(([rot])=>{
    const r=new THREE.Mesh(new THREE.PlaneGeometry(ROAD,GRID*S+ROAD),roadMat);
    r.rotation.x=-Math.PI/2;r.rotation.z=rot*Math.PI/2;r.position.set(rot?p:0,.02,rot?0:p);scene.add(r);
    const l=new THREE.Mesh(new THREE.PlaneGeometry(.25,GRID*S),lineMat);
    l.rotation.x=-Math.PI/2;l.rotation.z=rot*Math.PI/2;l.position.set(rot?p:0,.03,rot?0:p);scene.add(l);
  });
}

// текстура фасада
const c=document.createElement('canvas');c.width=64;c.height=128;
const ctx=c.getContext('2d');ctx.fillStyle='#7c8794';ctx.fillRect(0,0,64,128);
for(let y=8;y<128;y+=16)for(let x=8;x<64;x+=16){ctx.fillStyle=Math.random()>.3?'#ffd98a':'#36414d';ctx.fillRect(x,y,8,9);}
const facade=new THREE.CanvasTexture(c);

for(let i=0;i<GRID;i++)for(let j=0;j<GRID;j++){
  const cx=(i+.5)*S-HALF,cz=(j+.5)*S-HALF;
  const base=new THREE.Mesh(new THREE.PlaneGeometry(S-ROAD,S-ROAD),new THREE.MeshLambertMaterial({color:0x666d74}));
  base.rotation.x=-Math.PI/2;base.position.set(cx,.04,cz);scene.add(base);
  if(Math.random()<.15){ // сквер
    for(let t=0;t<3;t++)tree(cx+rand(-10,10),cz+rand(-10,10));
    continue;
  }
  const w=rand(13,21),d=rand(13,21),h=rand(8,42);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({map:facade}));
  b.position.set(cx+rand(-3,3),h/2,cz+rand(-3,3));scene.add(b);
  buildings.push({minX:b.position.x-w/2,maxX:b.position.x+w/2,minZ:b.position.z-d/2,maxZ:b.position.z+d/2});
  tree(cx+(S-ROAD)/2-2,cz+(S-ROAD)/2-2);
}
function tree(x,z){
  const t=new THREE.Mesh(new THREE.CylinderGeometry(.35,.45,3,6),new THREE.MeshLambertMaterial({color:0x6b4a2b}));
  t.position.set(x,1.5,z);scene.add(t);
  const l=new THREE.Mesh(new THREE.SphereGeometry(1.8,7,6),new THREE.MeshLambertMaterial({color:0x2f7a3a}));
  l.position.set(x,4,z);scene.add(l);
}

/* ---------- ПЕРСОНАЖИ ---------- */
function person(color){
  const g=new THREE.Group(),mat=new THREE.MeshLambertMaterial({color});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.7,.8,.4),mat);torso.position.y=1.15;g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshLambertMaterial({color:0xe0b088}));head.position.y=1.85;g.add(head);
  const legs=[],arms=[];
  [-1,1].forEach(s=>{
    const leg=new THREE.Mesh(new THREE.BoxGeometry(.25,.75,.25),new THREE.MeshLambertMaterial({color:0x2b3550}));
    leg.position.set(s*.2,.4,0);g.add(leg);legs.push(leg);
    const arm=new THREE.Mesh(new THREE.BoxGeometry(.2,.7,.2),mat);
    arm.position.set(s*.47,1.15,0);g.add(arm);arms.push(arm);
  });
  g.userData.limbs=[...legs,...arms];scene.add(g);return g;
}
const player=person(0x22c55e);player.position.set(0,0,25);scene.add(player);

for(let i=0;i<22;i++){
  const g=person([0xd94f4f,0x4f8bd9,0xd9b34f,0xb0b0b0][i%4]);
  const axis=Math.random()<.5?'x':'z',road=(Math.floor(rand(0,GRID+1))*S-HALF);
  const n={g,axis,road,lane:rand(-3,3),t:rand(-HALF,HALF),dir:Math.random()<.5?1:-1,speed:rand(.9,1.7)};
  npcs.push(n);
}

/* ---------- МАШИНЫ ---------- */
function makeCar(color){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,.8,3.9),new THREE.MeshLambertMaterial({color}));
  body.position.y=.75;g.add(body);
  const top=new THREE.Mesh(new THREE.BoxGeometry(1.65,.7,1.9),new THREE.MeshLambertMaterial({color:0x22303c}));
  top.position.set(0,1.45,-.2);g.add(top);
  [-1,1].forEach(x=>[-1.25,1.25].forEach(z=>{
    const w=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,.3,10),new THREE.MeshLambertMaterial({color:0x111111}));
    w.rotation.z=Math.PI/2;w.position.set(x*1,.4,z);g.add(w);
  }));
  scene.add(g);return g;
}
for(let i=0;i<10;i++){
  const g=makeCar([0xe74c3c,0x3498db,0xf1c40f,0xecf0f1,0x9b59b6][i%5]);
  const ai=i>3?{axis:i%2?'x':'z',road:(Math.floor(rand(1,GRID))*S-HALF),lane:Math.random()<.5?3:-3,t:rand(-HALF,HALF),dir:Math.random()<.5?1:-1,speed:rand(5,9)}:null;
  const c={g,heading:0,speed:0,ai,occupied:false};
  if(ai)placeAI(c,ai);else{c.g.position.set(3,0,15+i*12);}
  cars.push(c);
}
function aiHeading(a){return a.axis==='z'?(a.dir>0?Math.PI:0):(a.dir>0?-Math.PI/2:Math.PI/2);}
function placeAI(obj,a){
  if(a.axis==='z'){obj.g.position.set(a.road+a.lane,0,a.t);}
  else{obj.g.position.set(a.t,0,a.road+a.lane);}
  obj.g.rotation.y=obj.heading=aiHeading(a);
}

/* ---------- УПРАВЛЕНИЕ ---------- */
const input={x:0,y:0,gas:false,brake:false,run:false};
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
let stickId=null;
function stickMove(e){
  const r=stick.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;
  const len=Math.hypot(dx,dy)||1,f=Math.min(len,42)/len;
  input.x=dx*f/42;input.y=-dy*f/42;
  knob.style.transform=`translate(${dx*f}px,${dy*f}px)`;
}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(e.pointerId);stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
function stickEnd(){stickId=null;input.x=input.y=0;knob.style.transform='';}
stick.addEventListener('pointerup',stickEnd);stick.addEventListener('pointercancel',stickEnd);

function hold(id,key){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);input[key]=true;});
  ['pointerup','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>input[key]=false));
}
hold('gas','gas');hold('brake','brake');hold('run','run');

let yaw=0,pitch=.5;
let lookId=null,lastX=0,lastY=0;
const view=document.getElementById('view');
view.addEventListener('pointerdown',e=>{lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;view.setPointerCapture(e.pointerId);});
view.addEventListener('pointermove',e=>{
  if(e.pointerId!==lookId)return;
  yaw-=(e.clientX-lastX)*.006;pitch=clamp(pitch+(e.clientY-lastY)*.004,.2,1.05);
  lastX=e.clientX;lastY=e.clientY;
});
view.addEventListener('pointerup',()=>lookId=null);

const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')enterExit();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

/* ---------- ЛОГИКА ---------- */
let activeCar=null;
const seatBtn=document.getElementById('seat');
seatBtn.onclick=enterExit;
function nearestCar(){
  let best=null,d=3.6;
  cars.forEach(c=>{const dd=c.g.position.distanceTo(player.position);if(dd<d){d=dd;best=c;}});
  return best;
}
function enterExit(){
  if(activeCar){
    const c=activeCar,r=new THREE.Vector3(Math.cos(c.heading),0,-Math.sin(c.heading));
    const p=c.g.position.clone().addScaledVector(r,2.6);
    if(solid(p.x,p.z,.5))p.copy(c.g.position).addScaledVector(r,-2.6);
    player.position.set(p.x,0,p.z);player.visible=true;
    c.speed=0;c.occupied=false;activeCar=null;
    seatBtn.innerHTML='В<br>МАШИНУ';
  }else{
    const c=nearestCar();if(!c)return;
    c.ai=null;c.speed=0;c.occupied=true;activeCar=c;
    player.visible=false;seatBtn.innerHTML='ВЫЙТИ';
  }
}
function solid(x,z,r){
  for(const b of buildings)if(x>b.minX-r&&x<b.maxX+r&&z>b.minZ-r&&z<b.maxZ+r)return true;
  return false;
}
function move(obj,dx,dz,r){
  const p=obj.position||obj;
  let x=(p.x||0)+dx,z=(p.z||0)+dz;
  if(!solid(x,p.z,r))p.x=clamp(x,-HALF+3,HALF-3);
  if(!solid(p.x,z,r))p.z=clamp(z,-HALF+3,HALF-3);
}

let speedKmh=0,camYaw=yaw;
const hud=document.getElementById('hud'),hint=document.getElementById('hint');
const mc=document.getElementById('map').getContext('2d');
let t=0;

function tick(dt){
  t+=dt;
  let ix=input.x+(keys.d?1:0)-(keys.a?1:0),iy=input.y+(keys.w?1:0)-(keys.s?1:0);
  ix=clamp(ix,-1,1);iy=clamp(iy,-1,1);

  if(activeCar){
    const c=activeCar;
    if(input.gas||keys.w)c.speed=Math.min(c.speed+9*dt,26);
    else if(input.brake||keys.s)c.speed=Math.max(c.speed-14*dt,-9);
    else c.speed*=Math.pow(.35,dt);
    if(Math.abs(c.speed)<.05)c.speed=0;
    c.heading-=ix*1.9*dt*clamp(c.speed/8,-1,1);
    const nx=c.g.position.x-Math.sin(c.heading)*c.speed*dt;
    const nz=c.g.position.z-Math.cos(c.heading)*c.speed*dt;
    if(!solid(nx,nz,1.5)){c.g.position.x=clamp(nx,-HALF+3,HALF-3);c.g.position.z=clamp(nz,-HALF+3,HALF-3);}
    else c.speed*=-.25;
    c.g.rotation.y=c.heading;
    speedKmh=Math.abs(c.speed*3.6);
  }else{
    camYaw+=(yaw-camYaw)*.2;
    const fw=new THREE.Vector3(-Math.sin(camYaw),0,-Math.cos(camYaw));
    const rt=new THREE.Vector3(Math.cos(camYaw),0,-Math.sin(camYaw));
    const sp=(input.run||keys.shift)?7:3.6;
    const dx=(rt.x*ix+fw.x*iy)*sp*dt,dz=(rt.z*ix+fw.z*iy)*sp*dt;
    move(player,dx,dz,.45);
    if(Math.abs(ix)+Math.abs(iy)>.1){
      player.rotation.y=Math.atan2(dx,dz)+Math.PI;
      player.userData.limbs.forEach((l,i)=>l.rotation.x=Math.sin(t*10+i*Math.PI)*.6);
    }
    speedKmh=0;
  }

  // NPC
  npcs.forEach(n=>{
    n.t+=n.dir*n.speed*dt;
    if(n.t>HALF+8)n.t=-HALF-8;if(n.t<-HALF-8)n.t=HALF+8;
    if(n.axis==='z'){n.g.position.set(n.road+n.lane,0,n.t);n.g.rotation.y=n.dir>0?Math.PI:0;}
    else{n.g.position.set(n.t,0,n.road+n.lane);n.g.rotation.y=n.dir>0?-Math.PI/2:Math.PI/2;}
    n.g.userData.limbs.forEach((l,i)=>l.rotation.x=Math.sin(t*6+i*Math.PI)*.5);
  });
  // трафик
  cars.forEach(c=>{
    if(!c.ai||c.occupied)return;
    const a=c.ai;a.t+=a.dir*a.speed*dt;
    if(a.t>HALF+10)a.t=-HALF-10;if(a.t<-HALF-10)a.t=HALF+10;
    placeAI(c,a);
  });

  // камера
  const target=activeCar?activeCar.g.position:player.position;
  const dist=activeCar?13:7;
  const hh=dist*Math.sin(pitch),hr=dist*Math.cos(pitch);
  camera.position.lerp(new THREE.Vector3(target.x+Math.sin(camYaw)*hh*.0+Math.sin(yaw)*hr,target.y+hh,target.z+Math.cos(yaw)*hr),.15);
  camera.lookAt(target.x,target.y+1.4,target.z);

  const near=!activeCar&&nearestCar();
  hint.textContent=near?'Рядом машина — жми «В МАШИНУ」':'';
  hud.innerHTML=activeCar?'🚗 <b>За рулём</b><br>'+Math.round(speedKmh)+' км/ч':'🚶 <b>Пешком</b>';

  // миникарта
  const k=140/(HALF*2+20);
  mc.fillStyle='#222';mc.fillRect(0,0,140,140);
  mc.fillStyle='#555';
  for(let i=0;i<=GRID;i++){const p=(i*S-HALF+HALF+10)*k;mc.fillRect(p-2,0,4,140);mc.fillRect(0,p-2,140,4);}
  mc.fillStyle='#888';
  buildings.forEach(b=>mc.fillRect((b.minX+HALF+10)*k,(b.minZ+HALF+10)*k,(b.maxX-b.minX)*k,(b.maxZ-b.minZ)*k));
  mc.fillStyle='#ffd54a';
  cars.forEach(c=>mc.fillRect((c.g.position.x+HALF+10)*k-1.5,(c.g.position.z+HALF+10)*k-1.5,3,3));
  mc.fillStyle='#2ecc71';
  const pp=activeCar?activeCar.g.position:player.position;
  mc.beginPath();mc.arc((pp.x+HALF+10)*k,(pp.z+HALF+10)*k,3.5,0,7);mc.fill();
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-last)/1000,.05);last=now;
  tick(dt);renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
document.getElementById('load').style.display='none';
requestAnimationFrame(loop);
</script>
</body>
</html>
