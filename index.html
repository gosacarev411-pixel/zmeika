<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Казино</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:linear-gradient(135deg,#1a0033,#000);min-height:100vh;color:#fff;padding:20px}
.header{text-align:center;margin-bottom:30px}
.header h1{font-size:48px;color:#ffd700;text-shadow:0 0 20px #ffd700}
.balance{font-size:32px;color:#00ff88;margin:20px 0}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;max-width:1200px;margin:0 auto}
.game{background:rgba(255,255,255,0.1);border:2px solid #ffd700;border-radius:20px;padding:30px;text-align:center}
.game h2{color:#ffd700;margin-bottom:20px;font-size:28px}
.game input{width:100%;padding:15px;margin:10px 0;border-radius:10px;border:2px solid #ffd700;background:rgba(0,0,0,0.5);color:#fff;font-size:18px;text-align:center}
.game button{width:100%;padding:15px;margin:10px 0;background:linear-gradient(135deg,#ffd700,#ff8c00);border:none;border-radius:10px;color:#000;font-weight:bold;font-size:18px;cursor:pointer}
.game button:hover{transform:scale(1.05)}
.result{font-size:24px;margin:20px 0;min-height:60px}
.slots{display:flex;justify-content:center;gap:10px;margin:20px 0}
.slot{width:80px;height:80px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:48px}
.roulette{width:200px;height:200px;margin:20px auto;border-radius:50%;border:5px solid #ffd700;position:relative;transition:transform 3s}
.dice{font-size:100px;margin:20px 0}
.coin{font-size:100px;margin:20px 0;transition:transform 1s}
.donate{background:rgba(255,215,0,0.1);border:2px solid #ffd700;border-radius:20px;padding:30px;max-width:600px;margin:40px auto;text-align:center}
.donate h2{color:#ffd700;margin-bottom:20px}
.donate button{padding:15px 30px;margin:10px;background:linear-gradient(135deg,#00ff88,#00cc66);border:none;border-radius:10px;color:#000;font-weight:bold;font-size:16px;cursor:pointer}
</style>
</head>
<body>

<div class="header">
<h1>🎰 КАЗИНО</h1>
<div class="balance">💰 Баланс: <span id="balance">1000</span>₽</div>
</div>

<div class="games">

<div class="game">
<h2>🎰 Слоты</h2>
<div class="slots">
<div class="slot" id="slot1">🍒</div>
<div class="slot" id="slot2"></div>
<div class="slot" id="slot3">🍊</div>
</div>
<input type="number" id="slotsBet" placeholder="Ставка" value="100">
<button onclick="playSlots()">Крутить</button>
<div class="result" id="slotsResult"></div>
</div>

<div class="game">
<h2> Рулетка</h2>
<div class="roulette" id="roulette"></div>
<input type="number" id="rouletteBet" placeholder="Ставка" value="100">
<select id="rouletteColor" style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:2px solid #ffd700;background:rgba(0,0,0,0.5);color:#fff;font-size:18px">
<option value="red">🔴 Красное (x2)</option>
<option value="black">⚫ Чёрное (x2)</option>
<option value="green"> Зелёное (x14)</option>
</select>
<button onclick="playRoulette()">Крутить</button>
<div class="result" id="rouletteResult"></div>
</div>

<div class="game">
<h2> Кости</h2>
<div class="dice" id="dice">🎲</div>
<input type="number" id="diceBet" placeholder="Ставка" value="100">
<select id="diceNumber" style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:2px solid #ffd700;background:rgba(0,0,0,0.5);color:#fff;font-size:18px">
<option value="1">1 (x6)</option>
<option value="2">2 (x6)</option>
<option value="3">3 (x6)</option>
<option value="4">4 (x6)</option>
<option value="5">5 (x6)</option>
<option value="6">6 (x6)</option>
</select>
<button onclick="playDice()">Бросить</button>
<div class="result" id="diceResult"></div>
</div>

<div class="game">
<h2>🪙 Монетка</h2>
<div class="coin" id="coin">🪙</div>
<input type="number" id="coinBet" placeholder="Ставка" value="100">
<select id="coinSide" style="width:100%;padding:15px;margin:10px 0;border-radius:10px;border:2px solid #ffd700;background:rgba(0,0,0,0.5);color:#fff;font-size:18px">
<option value="heads">Орёл (x2)</option>
<option value="tails">Решка (x2)</option>
</select>
<button onclick="playCoin()">Подбросить</button>
<div class="result" id="coinResult"></div>
</div>

</div>

<div class="donate">
<h2>💳 Пополнить баланс</h2>
<p style="margin:20px 0;font-size:18px">Выбери способ оплаты:</p>
<button onclick="donateYooMoney()">💳 ЮMoney</button>
<button onclick="donateCrypto()"> Криптовалюта</button>
<button onclick="donateCard()">💳 Карта</button>
<p style="margin-top:20px;opacity:0.7;font-size:14px">Минимальная сумма: 100₽</p>
</div>

<script>
let balance=1000;

const saved=localStorage.getItem('casinoBalance');
if(saved)balance=parseInt(saved);

function updateBalance(){
document.getElementById('balance').textContent=balance;
localStorage.setItem('casinoBalance',balance);
}

function playSlots(){
const bet=parseInt(document.getElementById('slotsBet').value);
if(bet>balance){alert('Недостаточно средств!');return}
if(bet<10){alert('Минимальная ставка 10₽');return}

const symbols=['🍒','','🍊','🍇','','💎','7️⃣'];
const s1=symbols[Math.floor(Math.random()*symbols.length)];
const s2=symbols[Math.floor(Math.random()*symbols.length)];
const s3=symbols[Math.floor(Math.random()*symbols.length)];

document.getElementById('slot1').textContent=s1;
document.getElementById('slot2').textContent=s2;
document.getElementById('slot3').textContent=s3;

balance-=bet;

if(s1===s2&&s2===s3){
const win=bet*10;
balance+=win;
document.getElementById('slotsResult').innerHTML=`<span style="color:#00ff88">🎉 ДЖЕКПОТ! +${win}₽</span>`;
}else if(s1===s2||s2===s3||s1===s3){
const win=bet*2;
balance+=win;
document.getElementById('slotsResult').innerHTML=`<span style="color:#00ff88">✨ Выигрыш! +${win}₽</span>`;
}else{
document.getElementById('slotsResult').innerHTML=`<span style="color:#ff4444">😢 Проигрыш -${bet}₽</span>`;
}

updateBalance();
}

function playRoulette(){
const bet=parseInt(document.getElementById('rouletteBet').value);
const color=document.getElementById('rouletteColor').value;
if(bet>balance){alert('Недостаточно средств!');return}
if(bet<10){alert('Минимальная ставка 10₽');return}

balance-=bet;

const roulette=document.getElementById('roulette');
const rotation=Math.floor(Math.random()*360)+720;
roulette.style.transform=`rotate(${rotation}deg)`;

setTimeout(()=>{
const rand=Math.random();
let result;
if(rand<0.48)result='red';
else if(rand<0.96)result='black';
else result='green';

if(result===color){
let win;
if(color==='green')win=bet*14;
else win=bet*2;
balance+=win;
document.getElementById('rouletteResult').innerHTML=`<span style="color:#00ff88">🎉 Выпало ${result==='red'?'🔴':result==='black'?'⚫':''}! +${win}₽</span>`;
}else{
document.getElementById('rouletteResult').innerHTML=`<span style="color:#ff4444">😢 Выпало ${result==='red'?'🔴':result==='black'?'':'🟢'}. Проигрыш -${bet}₽</span>`;
}
updateBalance();
},3000);
}

function playDice(){
const bet=parseInt(document.getElementById('diceBet').value);
const number=parseInt(document.getElementById('diceNumber').value);
if(bet>balance){alert('Недостаточно средств!');return}
if(bet<10){alert('Минимальная ставка 10₽');return}

balance-=bet;

const diceEmojis=['⚀','⚁','⚂','⚃','⚄','⚅'];
const result=Math.floor(Math.random()*6)+1;

document.getElementById('dice').textContent=diceEmojis[result-1];

setTimeout(()=>{
if(result===number){
const win=bet*6;
balance+=win;
document.getElementById('diceResult').innerHTML=`<span style="color:#00ff88">🎉 Выпало ${result}! +${win}₽</span>`;
}else{
document.getElementById('diceResult').innerHTML=`<span style="color:#ff4444">😢 Выпало ${result}. Проигрыш -${bet}₽</span>`;
}
updateBalance();
},1000);
}

function playCoin(){
const bet=parseInt(document.getElementById('coinBet').value);
const side=document.getElementById('coinSide').value;
if(bet>balance){alert('Недостаточно средств!');return}
if(bet<10){alert('Минимальная ставка 10₽');return}

balance-=bet;

const coin=document.getElementById('coin');
coin.style.transform='rotateY(720deg)';

setTimeout(()=>{
const result=Math.random()<0.5?'heads':'tails';
coin.textContent=result==='heads'?'👑':'🌟';

if(result===side){
const win=bet*2;
balance+=win;
document.getElementById('coinResult').innerHTML=`<span style="color:#00ff88">🎉 ${result==='heads'?'Орёл':'Решка'}! +${win}₽</span>`;
}else{
document.getElementById('coinResult').innerHTML=`<span style="color:#ff4444">😢 ${result==='heads'?'Орёл':'Решка'}. Проигрыш -${bet}₽</span>`;
}
coin.style.transform='rotateY(0deg)';
updateBalance();
},1000);
}

function donateYooMoney(){
const amount=prompt('Введи сумму пополнения (мин. 100₽):');
if(!amount||parseInt(amount)<100){alert('Минимальная сумма 100₽');return}

// Замени на свой номер кошелька ЮMoney
const walletNumber='41001234567890';
const url=`https://yoomoney.ru/quickpay/confirm.xml?receiver=${walletNumber}&quickpay-form=donate&targets=Пополнение+баланса&sum=${amount}&label=casino`;

window.open(url,'_blank');

// Симуляция пополнения (в реальности нужно проверять через API)
setTimeout(()=>{
if(confirm('Ты оплатил? Нажми OK для подтверждения')){
balance+=parseInt(amount);
updateBalance();
alert(`✅ Баланс пополнен на ${amount}₽`);
}
},5000);
}

function donateCrypto(){
alert('₿ Адрес кошелька USDT (TRC-20):\n\nTXYZ1234567890AbCdEfGhIjKlMnOpQrSt\n\nМинимум: 5 USDT\nПосле оплаты напиши в поддержку');
}

function donateCard(){
alert('💳 Для оплаты картой:\n\n1. Переведи на карту: 2200 1234 5678 9012\n2. Напиши сумму и последние 4 цифры карты в поддержку\n3. Баланс пополнится в течение 5 минут');
}

updateBalance();
</script>

</body>
</html>
