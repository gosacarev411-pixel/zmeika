<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CS Mini App</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body { 
            overflow: hidden; 
            background: #000; 
            font-family: Arial, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        #gameCanvas { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
        }
        
        #crosshair {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 30px;
            height: 30px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 0, 0.9);
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.8);
        }
        
        #crosshair::before {
            width: 3px;
            height: 30px;
            left: 13.5px;
            top: 0;
        }
        
        #crosshair::after {
            width: 30px;
            height: 3px;
            left: 0;
            top: 13.5px;
        }
        
        #hud {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            z-index: 100;
            pointer-events: none;
        }
        
        #health { color: #0f0; margin-bottom: 10px; font-size: 24px; }
        #ammo { color: #ff0; font-size: 24px; }
        
        #mobileControls {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
        
        .joystick {
            position: absolute;
            width: 140px;
            height: 140px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.5);
            pointer-events: auto;
            touch-action: none;
        }
        
        #leftJoystick { left: 30px; bottom: 120px; }
        
        .joystickKnob {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        
        #fireButton {
            position: absolute;
            right: 40px;
            bottom: 140px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, rgba(255,50,50,0.6) 0%, rgba(255,0,0,0.4) 100%);
            border-radius: 50%;
            border: 5px solid rgba(255,50,50,0.9);
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
        }
        
        #reloadButton {
            position: absolute;
            right: 180px;
            bottom: 140px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(255,165,0,0.6) 0%, rgba(255,140,0,0.4) 100%);
            border-radius: 50%;
            border: 4px solid rgba(255,165,0,0.9);
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        
        #jumpButton {
            position: absolute;
            right: 40px;
            bottom: 280px;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(100,100,255,0.6) 0%, rgba(80,80,255,0.4) 100%);
            border-radius: 50%;
            border: 4px solid rgba(100,100,255,0.9);
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            touch-action: none;
        }
        
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            z-index: 1000;
        }
        
        #startScreen h1 {
            font-size: 42px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(0,255,0,0.5);
            text-align: center;
        }
        
        #startScreen p {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
            text-align: center;
            padding: 0 20px;
        }
        
        #startButton {
            margin-top: 30px;
            padding: 25px 70px;
            font-size: 26px;
            background: linear-gradient(135deg, #0f0 0%, #0a0 100%);
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 30px rgba(0,255,0,0.6);
        }
        
        #startButton:active { 
            transform: scale(0.95); 
            background: linear-gradient(135deg, #0a0 0%, #080 100%);
        }
        
        #damageOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(255,0,0,0.6) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 99;
        }
        
        #debug {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            z-index: 200;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <div id="crosshair"></div>
    <div id="damageOverlay"></div>
    <div id="debug">Загрузка...</div>
    
    <div id="hud">
        <div id="health">❤️ 100</div>
        <div id="ammo">🔫 30 / 90</div>
    </div>
    
    <div id="mobileControls">
        <div id="leftJoystick" class="joystick">
            <div class="joystickKnob"></div>
        </div>
        <div id="fireButton">ОГОНЬ</div>
        <div id="reloadButton">R</div>
        <div id="jumpButton">↑</div>
    </div>
    
    <div id="startScreen">
        <h1>🎯 CS MINI</h1>
        <p>Левый джойстик - движение</p>
        <p>Правая часть экрана - обзор</p>
        <p>Красная кнопка - стрельба</p>
        <p>Оранжевая - перезарядка</p>
        <p>Синяя - прыжок</p>
        <button id="startButton">ИГРАТЬ</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const debug = document.getElementById('debug');
        
        // Проверка загрузки Three.js
        if (typeof THREE === 'undefined') {
            debug.textContent = 'Ошибка: Three.js не загрузился!';
            alert('Ошибка загрузки. Проверь интернет.');
        } else {
            debug.textContent = 'Three.js загружен ✓';
        }

        // Инициализация
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 20, 80);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('gameCanvas'), 
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        debug.textContent = 'Сцена создана ✓';

        // Процедурные текстуры
        function createTexture(color1, color2, size = 64) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            for (let i = 0; i < size; i += 8) {
                for (let j = 0; j < size; j += 8) {
                    ctx.fillStyle = Math.random() > 0.5 ? color1 : color2;
                    ctx.fillRect(i, j, 8, 8);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        const floorTexture = createTexture('#666', '#777', 128);
        floorTexture.repeat.set(10, 10);
        
        const wallTexture = createTexture('#555', '#666', 64);
        wallTexture.repeat.set(2, 2);

        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -50;
        directionalLight.shadow.camera.right = 50;
        directionalLight.shadow.camera.top = 50;
        directionalLight.shadow.camera.bottom = -50;
        scene.add(directionalLight);

        // Пол
        const floorGeometry = new THREE.PlaneGeometry(100, 100);
        const floorMaterial = new THREE.MeshLambertMaterial({ map: floorTexture });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Стены
        const wallMaterial = new THREE.MeshLambertMaterial({ map: wallTexture });
        const walls = [];
        
        function createWall(x, z, width, depth) {
            const wallGeometry = new THREE.BoxGeometry(width, 4, depth);
            const wall = new THREE.Mesh(wallGeometry, wallMaterial);
            wall.position.set(x, 2, z);
            wall.castShadow = true;
            wall.receiveShadow = true;
            scene.add(wall);
            walls.push(wall);
        }

        createWall(0, -20, 40, 2);
        createWall(0, 20, 40, 2);
        createWall(-20, 0, 2, 40);
        createWall(20, 0, 2, 40);
        createWall(-10, -10, 4, 4);
        createWall(10, 10, 4, 4);
        createWall(5, -5, 3, 3);

        debug.textContent = 'Мир создан ✓';

        // Игрок
        const player = {
            position: new THREE.Vector3(0, 1.7, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            health: 100,
            ammo: 30,
            maxAmmo: 30,
            reserveAmmo: 90,
            isReloading: false,
            rotation: { x: 0, y: 0 }
        };

        camera.position.copy(player.position);

        // Боты
        const bots = [];
        const botGeometry = new THREE.BoxGeometry(1, 2, 1);
        const botMaterial = new THREE.MeshLambertMaterial({ color: 0xff0000 });

        function createBot(x, z) {
            const bot = new THREE.Mesh(botGeometry, botMaterial);
            bot.position.set(x, 1, z);
            bot.castShadow = true;
            scene.add(bot);
            
            bots.push({
                mesh: bot,
                health: 100,
                lastShot: 0,
                moveDirection: new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize()
            });
        }

        createBot(-15, -15);
        createBot(15, 15);
        createBot(-15, 15);
        createBot(15, -15);

        debug.textContent = 'Боты созданы ✓';

        // Эффекты
        function createBulletTrail(from, to) {
            const material = new THREE.LineBasicMaterial({ color: 0xffff00, linewidth: 3 });
            const points = [from, to];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(geometry, material);
            scene.add(line);
            
            setTimeout(() => scene.remove(line), 150);
        }

        function createImpactEffect(position) {
            const particleCount = 10;
            const particles = [];
            
            for (let i = 0; i < particleCount; i++) {
                const particle = new THREE.Mesh(
                    new THREE.SphereGeometry(0.08, 4, 4),
                    new THREE.MeshBasicMaterial({ color: 0xffaa00 })
                );
                particle.position.copy(position);
                particle.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 6,
                    Math.random() * 6,
                    (Math.random() - 0.5) * 6
                );
                particle.userData.life = 1.0;
                scene.add(particle);
                particles.push(particle);
            }
            
            setTimeout(() => {
                particles.forEach(p => scene.remove(p));
            }, 600);
        }

        // Мобильное управление - УПРОЩЁННОЕ
        let moveVector = { x: 0, y: 0 };
        let isFiring = false;

        // Левый джойстик
        const leftJoystick = document.getElementById('leftJoystick');
        const leftKnob = leftJoystick.querySelector('.joystickKnob');
        let joystickTouchId = null;
        let joystickCenter = { x: 0, y: 0 };

        leftJoystick.addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            const rect = leftJoystick.getBoundingClientRect();
            joystickCenter = {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
            updateJoystick(touch);
        }, { passive: false });

        leftJoystick.addEventListener('touchmove', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    updateJoystick(e.changedTouches[i]);
                    break;
                }
            }
        }, { passive: false });

        leftJoystick.addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joystickTouchId) {
                    joystickTouchId = null;
                    moveVector = { x: 0, y: 0 };
                    leftKnob.style.transform = 'translate(-50%, -50%)';
                    break;
                }
            }
        }, { passive: false });

        function updateJoystick(touch) {
            const dx = touch.clientX - joystickCenter.x;
            const dy = touch.clientY - joystickCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            const maxDistance = 50;
            
            let clampedX = dx;
            let clampedY = dy;
            
            if (distance > maxDistance) {
                clampedX = (dx / distance) * maxDistance;
                clampedY = (dy / distance) * maxDistance;
            }
            
            leftKnob.style.transform = `translate(calc(-50% + ${clampedX}px), calc(-50% + ${clampedY}px))`;
            
            moveVector = {
                x: clampedX / maxDistance,
                y: clampedY / maxDistance
            };
        }

        // Обзор камеры - правая часть экрана
        let lookTouchId = null;
        let lastLookX = 0;
        let lastLookY = 0;

        document.addEventListener('touchstart', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.clientX > window.innerWidth / 2 && !e.target.closest('#mobileControls')) {
                    lookTouchId = touch.identifier;
                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;
                }
            }
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === lookTouchId) {
                    const dx = touch.clientX - lastLookX;
                    const dy = touch.clientY - lastLookY;
                    
                    player.rotation.y -= dx * 0.008;
                    player.rotation.x -= dy * 0.008;
                    player.rotation.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, player.rotation.x));
                    
                    lastLookX = touch.clientX;
                    lastLookY = touch.clientY;
                }
            }
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === lookTouchId) {
                    lookTouchId = null;
                }
            }
        }, { passive: true });

        // Кнопки
        document.getElementById('fireButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            isFiring = true;
            if (navigator.vibrate) navigator.vibrate(30);
        }, { passive: false });

        document.getElementById('fireButton').addEventListener('touchend', (e) => {
            e.preventDefault();
            e.stopPropagation();
            isFiring = false;
        }, { passive: false });

        document.getElementById('reloadButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            reload();
            if (navigator.vibrate) navigator.vibrate(50);
        }, { passive: false });

        document.getElementById('jumpButton').addEventListener('touchstart', (e) => {
            e.preventDefault();
            e.stopPropagation();
            if (player.position.y <= 1.7) {
                player.velocity.y = 6;
                if (navigator.vibrate) navigator.vibrate(40);
            }
        }, { passive: false });

        // Стрельба
        let lastShot = 0;
        const fireRate = 120;

        function shoot() {
            const now = Date.now();
            if (now - lastShot < fireRate || player.isReloading || player.ammo <= 0) return;
            
            lastShot = now;
            player.ammo--;
            updateHUD();

            // Отдача
            player.rotation.x += 0.04;

            // Вибрация
            if (navigator.vibrate) navigator.vibrate(20);

            // Raycast
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);
            
            const botMeshes = bots.map(b => b.mesh);
            const intersects = raycaster.intersectObjects([...botMeshes, ...walls]);

            if (intersects.length > 0) {
                const hit = intersects[0];
                createBulletTrail(camera.position.clone(), hit.point.clone());
                
                const hitBot = bots.find(b => b.mesh === hit.object);
                if (hitBot) {
                    hitBot.health -= 25;
                    createImpactEffect(hit.point);
                    
                    if (hitBot.health <= 0) {
                        scene.remove(hitBot.mesh);
                        bots.splice(bots.indexOf(hitBot), 1);
                    }
                } else {
                    createImpactEffect(hit.point);
                }
            }

            if (player.ammo <= 0 && player.reserveAmmo > 0) {
                reload();
            }
        }

        // Перезарядка
        function reload() {
            if (player.isReloading || player.ammo === player.maxAmmo || player.reserveAmmo <= 0) return;
            
            player.isReloading = true;
            document.getElementById('ammo').textContent = '🔄 ПЕРЕЗАРЯДКА...';
            
            setTimeout(() => {
                const needed = player.maxAmmo - player.ammo;
                const toLoad = Math.min(needed, player.reserveAmmo);
                player.ammo += toLoad;
                player.reserveAmmo -= toLoad;
                player.isReloading = false;
                updateHUD();
            }, 2500);
        }

        // Обновление HUD
        function updateHUD() {
            document.getElementById('health').textContent = `❤️ ${player.health}`;
            document.getElementById('ammo').textContent = `🔫 ${player.ammo} / ${player.reserveAmmo}`;
        }

        // Движение игрока
        function updatePlayer(delta) {
            const speed = 6;
            const direction = new THREE.Vector3();

            direction.x = moveVector.x;
            direction.z = moveVector.y;
            
            if (direction.length() > 0) {
                direction.normalize();
                direction.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
                
                player.position.x += direction.x * speed * delta;
                player.position.z += direction.z * speed * delta;
            }

            // Гравитация
            player.velocity.y -= 10 * delta;
            player.position.y += player.velocity.y * delta;

            if (player.position.y < 1.7) {
                player.position.y = 1.7;
                player.velocity.y = 0;
            }

            // Ограничение арены
            player.position.x = Math.max(-19, Math.min(19, player.position.x));
            player.position.z = Math.max(-19, Math.min(19, player.position.z));

            camera.position.copy(player.position);
            camera.rotation.order = 'YXZ';
            camera.rotation.y = player.rotation.y;
            camera.rotation.x = player.rotation.x;
        }

        // ИИ ботов
        function updateBots(delta) {
            bots.forEach(bot => {
                const distance = bot.mesh.position.distanceTo(player.position);
                
                // Движение к игроку
                if (distance > 8) {
                    const direction = new THREE.Vector3()
                        .subVectors(player.position, bot.mesh.position)
                        .normalize();
                    
                    bot.mesh.position.x += direction.x * 2.5 * delta;
                    bot.mesh.position.z += direction.z * 2.5 * delta;
                } else if (distance < 5) {
                    // Отступление если близко
                    const direction = new THREE.Vector3()
                        .subVectors(bot.mesh.position, player.position)
                        .normalize();
                    
                    bot.mesh.position.x += direction.x * 2 * delta;
                    bot.mesh.position.z += direction.z * 2 * delta;
                }

                // Ограничение арены
                bot.mesh.position.x = Math.max(-18, Math.min(18, bot.mesh.position.x));
                bot.mesh.position.z = Math.max(-18, Math.min(18, bot.mesh.position.z));

                // Стрельба
                const now = Date.now();
                if (distance < 20 && now - bot.lastShot > 1200) {
                    bot.lastShot = now;
                    player.health -= 8;
                    updateHUD();
                    
                    // Эффект урона
                    const overlay = document.getElementById('damageOverlay');
                    overlay.style.opacity = '1';
                    setTimeout(() => overlay.style.opacity = '0', 250);
                    
                    if (navigator.vibrate) navigator.vibrate(100);
                    
                    if (player.health <= 0) {
                        alert('Ты проиграл! Перезагрузи страницу.');
                        location.reload();
                    }
                }

                bot.mesh.lookAt(player.position.x, bot.mesh.position.y, player.position.z);
            });
        }

        // Игровой цикл
        let lastTime = Date.now();

        function animate() {
            requestAnimationFrame(animate);
            
            const now = Date.now();
            const delta = Math.min((now - lastTime) / 1000, 0.1);
            lastTime = now;

            updatePlayer(delta);
            updateBots(delta);

            if (isFiring) shoot();

            renderer.render(scene, camera);
        }

        // Старт
        document.getElementById('startButton').addEventListener('click', () => {
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('mobileControls').style.display = 'block';
            debug.textContent = 'Игра запущена ✓';
            animate();
        });

        // Адаптация
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Запрет скролла
        document.addEventListener('touchmove', (e) => {
            if (e.target === document.body) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
