<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini GTA 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            overflow: hidden;
            touch-action: none;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
        }
        
        /* Управление */
        .control {
            position: fixed;
            width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            user-select: none;
            touch-action: none;
            z-index: 100;
        }
        
        .control:active {
            background: rgba(255, 255, 255, 0.5);
        }
        
        #gas {
            bottom: 30px;
            right: 30px;
        }
        
        #brake {
            bottom: 30px;
            right: 130px;
        }
        
        #left {
            bottom: 30px;
            left: 30px;
        }
        
        #right {
            bottom: 30px;
            left: 130px;
        }
        
        #camera-btn {
            top: 10px;
            right: 10px;
            width: 60px;
            height: 60px;
            font-size: 24px;
        }
        
        /* Загрузка */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="loading">Загрузка...</div>
    
    <div id="hud">
        <div>Скорость: <span id="speed">0</span> км/ч</div>
    </div>
    
    <div id="gas" class="control">▲</div>
    <div id="brake" class="control">▼</div>
    <div id="left" class="control">◄</div>
    <div id="right" class="control">►</div>
    <div id="camera-btn" class="control">📷</div>
    
    <canvas id="gameCanvas"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Инициализация Three.js
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB); // Небо
        scene.fog = new THREE.Fog(0x87CEEB, 50, 300);
        
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('gameCanvas'), antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        
        // Освещение
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(50, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -100;
        directionalLight.shadow.camera.right = 100;
        directionalLight.shadow.camera.top = 100;
        directionalLight.shadow.camera.bottom = -100;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        // Земля
        const groundGeometry = new THREE.PlaneGeometry(500, 500);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x3a7d44 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Дороги
        function createRoad(x, z, width, length, rotation = 0) {
            const roadGeometry = new THREE.PlaneGeometry(width, length);
            const roadMaterial = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const road = new THREE.Mesh(roadGeometry, roadMaterial);
            road.rotation.x = -Math.PI / 2;
            road.rotation.z = rotation;
            road.position.set(x, 0.01, z);
            road.receiveShadow = true;
            scene.add(road);
            
            // Разметка
            const lineGeometry = new THREE.PlaneGeometry(0.5, length);
            const lineMaterial = new THREE.MeshStandardMaterial({ color: 0xffff00 });
            const line = new THREE.Mesh(lineGeometry, lineMaterial);
            line.rotation.x = -Math.PI / 2;
            line.rotation.z = rotation;
            line.position.set(x, 0.02, z);
            scene.add(line);
        }
        
        // Создаем город
        createRoad(0, 0, 15, 200); // Главная дорога
        createRoad(0, 0, 200, 15, Math.PI / 2); // Перекресток
        
        // Здания
        function createBuilding(x, z, width, height, depth, color) {
            const geometry = new THREE.BoxGeometry(width, height, depth);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const building = new THREE.Mesh(geometry, material);
            building.position.set(x, height / 2, z);
            building.castShadow = true;
            building.receiveShadow = true;
            scene.add(building);
        }
        
        // Создаем здания вдоль дорог
        for (let i = -80; i <= 80; i += 20) {
            if (Math.abs(i) > 10) {
                createBuilding(20, i, 10, 15 + Math.random() * 10, 10, 0x8B7355);
                createBuilding(-20, i, 10, 15 + Math.random() * 10, 10, 0x696969);
                createBuilding(i, 20, 10, 15 + Math.random() * 10, 10, 0x8B7355);
                createBuilding(i, -20, 10, 15 + Math.random() * 10, 10, 0x696969);
            }
        }
        
        // Деревья
        function createTree(x, z) {
            const trunkGeometry = new THREE.CylinderGeometry(0.5, 0.5, 3);
            const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
            const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
            trunk.position.set(x, 1.5, z);
            trunk.castShadow = true;
            scene.add(trunk);
            
            const leavesGeometry = new THREE.SphereGeometry(2);
            const leavesMaterial = new THREE.MeshStandardMaterial({ color: 0x228B22 });
            const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
            leaves.position.set(x, 4, z);
            leaves.castShadow = true;
            scene.add(leaves);
        }
        
        // Добавляем деревья
        for (let i = 0; i < 30; i++) {
            const x = (Math.random() - 0.5) * 200;
            const z = (Math.random() - 0.5) * 200;
            if (Math.abs(x) > 15 && Math.abs(z) > 15) {
                createTree(x, z);
            }
        }
        
        // Машина игрока
        const car = new THREE.Group();
        
        // Кузов
        const bodyGeometry = new THREE.BoxGeometry(2, 1, 4);
        const bodyMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 });
        const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
        body.position.y = 0.5;
        body.castShadow = true;
        car.add(body);
        
        // Крыша
        const roofGeometry = new THREE.BoxGeometry(1.8, 0.8, 2);
        const roofMaterial = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
        const roof = new THREE.Mesh(roofGeometry, roofMaterial);
        roof.position.y = 1.4;
        roof.position.z = -0.3;
        roof.castShadow = true;
        car.add(roof);
        
        // Колеса
        const wheelGeometry = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
        
        const wheelPositions = [
            { x: -1, y: 0.4, z: 1.2 },
            { x: 1, y: 0.4, z: 1.2 },
            { x: -1, y: 0.4, z: -1.2 },
            { x: 1, y: 0.4, z: -1.2 }
        ];
        
        wheelPositions.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeometry, wheelMaterial);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(pos.x, pos.y, pos.z);
            wheel.castShadow = true;
            car.add(wheel);
        });
        
        car.position.set(0, 0, 0);
        scene.add(car);
        
        // Физика машины
        const carPhysics = {
            speed: 0,
            maxSpeed: 0.5,
            acceleration: 0.01,
            deceleration: 0.005,
            turnSpeed: 0.03,
            rotation: 0
        };
        
        // Управление
        const controls = {
            gas: false,
            brake: false,
            left: false,
            right: false
        };
        
        // Обработчики кнопок
        function setupControl(id, controlName) {
            const element = document.getElementById(id);
            
            element.addEventListener('touchstart', (e) => {
                e.preventDefault();
                controls[controlName] = true;
            });
            
            element.addEventListener('touchend', (e) => {
                e.preventDefault();
                controls[controlName] = false;
            });
            
            element.addEventListener('mousedown', () => {
                controls[controlName] = true;
            });
            
            element.addEventListener('mouseup', () => {
                controls[controlName] = false;
            });
        }
        
        setupControl('gas', 'gas');
        setupControl('brake', 'brake');
        setupControl('left', 'left');
        setupControl('right', 'right');
        
        // Камера
        let cameraMode = 0;
        const cameraModes = [
            { distance: 10, height: 5 },
            { distance: 15, height: 8 },
            { distance: 5, height: 3 }
        ];
        
        document.getElementById('camera-btn').addEventListener('click', () => {
            cameraMode = (cameraMode + 1) % cameraModes.length;
        });
        
        // Игровой цикл
        function animate() {
            requestAnimationFrame(animate);
            
            // Физика машины
            if (controls.gas) {
                carPhysics.speed = Math.min(carPhysics.speed + carPhysics.acceleration, carPhysics.maxSpeed);
            } else if (controls.brake) {
                carPhysics.speed = Math.max(carPhysics.speed - carPhysics.acceleration, -carPhysics.maxSpeed / 2);
            } else {
                if (carPhysics.speed > 0) {
                    carPhysics.speed = Math.max(carPhysics.speed - carPhysics.deceleration, 0);
                } else if (carPhysics.speed < 0) {
                    carPhysics.speed = Math.min(carPhysics.speed + carPhysics.deceleration, 0);
                }
            }
            
            // Поворот
            if (Math.abs(carPhysics.speed) > 0.01) {
                if (controls.left) {
                    carPhysics.rotation += carPhysics.turnSpeed * (carPhysics.speed > 0 ? 1 : -1);
                }
                if (controls.right) {
                    carPhysics.rotation -= carPhysics.turnSpeed * (carPhysics.speed > 0 ? 1 : -1);
                }
            }
            
            // Движение
            car.position.x += Math.sin(carPhysics.rotation) * carPhysics.speed;
            car.position.z += Math.cos(carPhysics.rotation) * carPhysics.speed;
            car.rotation.y = carPhysics.rotation;
            
            // Границы карты
            car.position.x = Math.max(-240, Math.min(240, car.position.x));
            car.position.z = Math.max(-240, Math.min(240, car.position.z));
            
            // Камера
            const camMode = cameraModes[cameraMode];
            const cameraOffset = new THREE.Vector3(
                -Math.sin(carPhysics.rotation) * camMode.distance,
                camMode.height,
                -Math.cos(carPhysics.rotation) * camMode.distance
            );
            
            camera.position.lerp(car.position.clone().add(cameraOffset), 0.1);
            camera.lookAt(car.position);
            
            // Обновление HUD
            document.getElementById('speed').textContent = Math.abs(Math.round(carPhysics.speed * 200));
            
            renderer.render(scene, camera);
        }
        
        // Обработка изменения размера окна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // Запуск
        document.getElementById('loading').style.display = 'none';
        animate();
    </script>
</body>
</html>
