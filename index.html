<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEON ARCADE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; font-family: 'Segoe UI', Arial, sans-serif; }
  body { 
    background: #0a0a1a; color: #fff; min-height: 100vh; overflow-x: hidden; 
    position: relative;
  }
  body::before {
    content: ''; position: fixed; inset: 0; 
    background: linear-gradient(45deg, #ff006e, #8338ec, #3a86ff, #06ffa5, #ffbe0b, #ff006e);
    background-size: 400% 400%; animation: bgShift 15s ease infinite; opacity: 0.15; z-index: -1;
  }
  @keyframes bgShift { 0%, 100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

  .screen { display: none; min-height: 100vh; padding: 20px; animation: fadeIn 0.4s ease; }
  .screen.active { display: flex; flex-direction: column; align-items: center; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .header { text-align: center; margin-bottom: 30px; margin-top: 20px; }
  .header h1 { 
    font-size: 32px; font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff, #06ffa5);
    background-size: 200% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: gradShift 3s linear infinite;
  }
  @keyframes gradShift { to { background-position: 200% center; } }

  .card { 
    background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); 
    border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; 
    padding: 25px; width: 100%; max-width: 400px; text-align: center;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); margin-bottom: 20px;
  }

  .fortune-btn {
    background: linear-gradient(135deg, #ff006e, #ffbe0b); border: none; color: #fff;
    padding: 15px 30px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 16px;
    box-shadow: 0 4px 20px rgba(255, 0, 110, 0.4); transition: transform 0.2s; width: 100%;
  }
  .fortune-btn:active { transform: scale(0.95); }
  .fortune-text { margin-top: 15px; font-size: 18px; color: #ffd700; min-height: 50px; font-style: italic; }

  .game-btn {
    background: linear-gradient(135deg, var(--c1), var(--c2)); border: none; color: #fff;
    padding: 15px; border-radius: 15px; cursor: pointer; font-weight: bold; font-size: 16px;
    width: 100%; margin-bottom: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); transition: transform 0.2s;
  }
  .game-btn:active { transform: scale(0.97); }

  .back-btn {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
    padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; margin-bottom: 20px;
    align-self: flex-start;
  }

  .score-display { font-size: 36px; font-weight: bold; margin: 15px 0; color: #06ffa5; text-shadow: 0 0 15px rgba(6,255,165,0.5); }
  
  .input-field {
    width: 100%; padding: 15px; border-radius: 15px; border: 2px solid #8338ec; 
    background: rgba(0,0,0,0.3); color: #fff; font-size: 20px; text-align: center; margin: 15px 0;
  }
  
  .action-btn {
    background: linear-gradient(135deg, #3a86ff, #8338ec); border: none; color: #fff;
    padding: 15px 30px; border-radius: 25px; cursor: pointer; font-weight: bold; font-size: 18px; width: 100%;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
  }
  .modal.open { display: flex; animation: fadeIn 0.3s; }
  .modal-box {
    background: linear-gradient(135deg, #1a1a2e, #2d2b55); border: 2px solid #06ffa5;
    border-radius: 24px; padding: 30px; max-width: 350px; width: 100%; text-align: center;
  }
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<div id="home" class="screen active">
  <div class="header">
    <h1>NEON ARCADE</h1>
    <p style="color: #888; margin-top: 5px; letter-spacing: 2px;">МИНИМАЛИЗМ И СТИЛЬ</p>
  </div>

  <div class="card">
    <div style="font-size: 14px; color: #888; margin-bottom: 15px;">✨ ПРЕДСКАЗАНИЕ ДНЯ</div>
    <button class="fortune-btn" onclick="getFortune()">🔮 Узнать судьбу</button>
    <div class="fortune-text" id="fortuneText"></div>
  </div>

  <div class="card" style="text-align: left;">
    <h3 style="margin-bottom: 15px; color: #06ffa5;">🎮 Игры</h3>
    <button class="game-btn" style="--c1: #f59e0b; --c2: #fbbf24;" onclick="startGame('clicker')">🍪 Неоновый Кликер</button>
    <button class="game-btn" style="--c1: #3a86ff; --c2: #8338ec;" onclick="startGame('guess')">🔮 Угадай число (1-100)</button>
  </div>
</div>

<!-- ЭКРАН ИГРЫ -->
<div id="gameScreen" class="screen">
  <button class="back-btn" onclick="goHome()">← Назад в меню</button>
  <div class="header">
    <h1 id="gameTitle" style="font-size: 24px;">Игра</h1>
    <p style="color: #06ffa5; margin-top: 5px;">Рекорд: <span id="gameBest">0</span></p>
  </div>
  <div class="card" id="gameContent" style="width: 100%; max-width: 400px;"></div>
</div>

<!-- МОДАЛКА -->
<div class="modal" id="resultModal">
  <div class="modal-box">
    <h2 id="resultTitle" style="color: #ffd700; margin-bottom: 15px;">Результат</h2>
    <p id="resultText" style="color: #ccc; margin-bottom: 20px; line-height: 1.5;"></p>
    <button class="action-btn" onclick="closeModal()">OK</button>
  </div>
</div>

<script>
// === ДАННЫЕ ===
let data = JSON.parse(localStorage.getItem('neon_data') || '{}');
if (!data.stats) data.stats = {};
function saveData() { localStorage.setItem('neon_data', JSON.stringify(data)); }

function updateBest(gameId, score) {
  if (!data.stats[gameId]) data.stats[gameId] = { best: 0 };
  if (score > data.stats[gameId].best) {
    data.stats[gameId].best = score;
    document.getElementById('gameBest').textContent = score;
    saveData();
  }
}

// === ПРЕДСКАЗАНИЯ ===
const fortunes = [
  "Сегодня ты побьёшь свой рекорд! 🏆",
  "Удача на твоей стороне, действуй смело! 🍀",
  "Звёзды говорят: попробуй Угадай число! 🔮",
  "Твоя интуиция сегодня на максимуме! ✨",
  "Кликер ждёт тебя, кликай и богатей! 🍪",
  "Сегодня отличный день для побед! 👑",
  "Не бойся рисковать, фортуна с тобой! 🎲",
  "Ты станешь легендой этого дня! 🌟"
];

function getFortune() {
  const text = document.getElementById('fortuneText');
  text.style.opacity = 0;
  setTimeout(() => {
    text.textContent = fortunes[Math.floor(Math.random() * fortunes.length)];
    text.style.opacity = 1;
    text.style.transition = 'opacity 0.5s';
  }, 200);
}

// === УПРАВЛЕНИЕ ЭКРАНАМИ ===
function startGame(id) {
  document.getElementById('home').classList.remove('active');
  document.getElementById('gameScreen').classList.add('active');
  
  const titles = { clicker: '🍪 Неоновый Кликер', guess: '🔮 Угадай число' };
  document.getElementById('gameTitle').textContent = titles[id];
  document.getElementById('gameBest').textContent = data.stats[id]?.best || 0;
  
  const content = document.getElementById('gameContent');
  content.innerHTML = '';
  window.currentGameId = id;

  if (id === 'clicker') initClicker(content);
  else if (id === 'guess') initGuess(content);
}

function goHome() {
  if (window.gameInterval) clearInterval(window.gameInterval);
  document.getElementById('gameScreen').classList.remove('active');
  document.getElementById('home').classList.add('active');
}

function showResult(title, text) {
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultText').innerHTML = text;
  document.getElementById('resultModal').classList.add('open');
}

function closeModal() {
  document.getElementById('resultModal').classList.remove('open');
  if (window.currentGameId === 'guess') initGuess(document.getElementById('gameContent'));
}

// === ИГРА 1: КЛИКЕР ===
function initClicker(container) {
  let cookies = 0;
  let cps = 0; // кликов в секунду
  
  container.innerHTML = `
    <div class="score-display" id="cScore">0</div>
    <button id="cookieBtn" style="font-size: 100px; background: none; border: none; cursor: pointer; transition: transform 0.1s; margin: 20px 0;">🍪</button>
    <div style="color: #888; margin-bottom: 20px;">В секунду: <span id="cCps" style="color: #06ffa5;">0</span></div>
    <button class="action-btn" id="buyBtn" style="margin-top: 10px;">Купить авто-кликер (Цена: 50)</button>
  `;

  const btn = document.getElementById('cookieBtn');
  const buyBtn = document.getElementById('buyBtn');
  let autoClickerCost = 50;

  btn.addEventListener('click', () => {
    cookies++;
    updateBest('clicker', Math.floor(cookies));
    render();
    btn.style.transform = 'scale(0.9)';
    setTimeout(() => btn.style.transform = 'scale(1)', 100);
  });

  buyBtn.addEventListener('click', () => {
    if (cookies >= autoClickerCost) {
      cookies -= autoClickerCost;
      cps++;
      autoClickerCost = Math.floor(autoClickerCost * 1.5);
      render();
    }
  });

  function render() {
    document.getElementById('cScore').textContent = Math.floor(cookies);
    document.getElementById('cCps').textContent = cps;
    buyBtn.textContent = `Купить авто-кликер (Цена: ${autoClickerCost})`;
    buyBtn.style.opacity = cookies >= autoClickerCost ? '1' : '0.5';
  }

  window.gameInterval = setInterval(() => {
    cookies += cps;
    updateBest('clicker', Math.floor(cookies));
    render();
  }, 1000);

  render();
}

// === ИГРА 2: УГАДАЙ ЧИСЛО ===
function initGuess(container) {
  const target = Math.floor(Math.random() * 100) + 1;
  let attempts = 0;

  container.innerHTML = `
    <p style="color: #ccc; margin-bottom: 10px;">Я загадал число от 1 до 100.</p>
    <input type="number" id="gInput" class="input-field" placeholder="Твоё число">
    <button class="action-btn" id="gBtn">УГАДАТЬ</button>
    <div id="gHint" style="margin-top: 20px; font-size: 18px; min-height: 30px; color: #ffbe0b;"></div>
    <div style="margin-top: 10px; color: #888;">Попыток: <span id="gAttempts">0</span></div>
  `;

  const input = document.getElementById('gInput');
  const btn = document.getElementById('gBtn');
  const hint = document.getElementById('gHint');
  const attDisplay = document.getElementById('gAttempts');

  btn.addEventListener('click', () => {
    const val = parseInt(input.value);
    if (isNaN(val)) return;
    
    attempts++;
    attDisplay.textContent = attempts;

    if (val === target) {
      const score = Math.max(0, 100 - attempts * 5);
      updateBest('guess', score);
      showResult('🏆 ПОБЕДА!', `Ты угадал число ${target}!<br>Попыток: ${attempts}<br>Очки: ${score}`);
    } else if (val < target) {
      hint.textContent = '📈 Моё число БОЛЬШЕ!';
      hint.style.color = '#3a86ff';
    } else {
      hint.textContent = '📉 Моё число МЕНЬШЕ!';
      hint.style.color = '#ff006e';
    }
    input.value = '';
    input.focus();
  });
}
</script>
</body>
</html>
