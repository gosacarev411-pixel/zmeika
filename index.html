<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Neon Conquest</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;position:fixed}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a1a;color:#fff;touch-action:none}
.app{width:100%;height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top-bar{background:rgba(10,10,26,0.95);backdrop-filter:blur(10px);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,0.1);z-index:10}
.top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.kingdom-info{display:flex;align-items:center;gap:8px}
.kingdom-icon{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#4ecdc4,#44a3aa);display:flex;align-items:center;justify-content:center;font-size:18px}
.kingdom-name{font-size:14px;font-weight:700}
.time-counter{font-size:12px;color:#4ecdc4;font-family:monospace}
.resources{display:flex;gap:12px;font-size:13px;font-weight:600}
.resource{display:flex;align-items:center;gap:4px}
.map-container{flex:1;position:relative;overflow:hidden;background:#0a0a1a}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none}
.mini-map{position:absolute;top:10px;right:10px;width:100px;height:100px;background:rgba(0,0,0,0.7);border:2px solid rgba(255,255,255,0.2);border-radius:8px;cursor:pointer}
#miniMapCanvas{width:100%;height:100%;border-radius:6px}
.bottom-bar{background:rgba(10,10,26,0.95);backdrop-filter:blur(10px);padding:12px;border-top:1px solid rgba(255,255,255,0.1);display:flex;gap:8px;z-index:10}
.action-btn{flex:1;padding:12px 8px;border:none;border-radius:12px;background:rgba(255,255,255,0.1);color:#fff;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.2s;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.action-btn:active{transform:scale(0.95);background:rgba(255,255,255,0.2)}
.action-btn.active{background:linear-gradient(135deg,#4ecdc4,#44a3aa);box-shadow:0 4px 15px rgba(78,205,196,0.4)}
.action-icon{font-size:20px}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:flex-end;z-index:100}
.modal.show{display:flex}
.modal-content{width:100%;max-height:80vh;background:#1a1a2e;border-radius:20px 20px 0 0;padding:20px;overflow-y:auto;animation:slideUp 0.3s}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-title{font-size:20px;font-weight:800}
.close-btn{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.1);border:none;color:#fff;font-size:20px;cursor:pointer}
.leaderboard-item{display:flex;align-items:center;gap:12px;padding:12px;background:rgba(255,255,255,0.05);border-radius:12px;margin-bottom:8px}
.leaderboard-item.you{background:linear-gradient(135deg,rgba(78,205,196,0.2),rgba(68,163,170,0.2));border:1px solid #4ecdc4}
.rank{font-size:18px;font-weight:800;width:30px}
.kingdom-flag{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px}
.kingdom-details{flex:1}
.kingdom-details-name{font-size:14px;font-weight:700;margin-bottom:2px}
.kingdom-details-territory{font-size:12px;opacity:0.7}
.negotiation-options{display:flex;flex-direction:column;gap:10px}
.negotiation-btn{padding:16px;border:none;border-radius:12px;background:rgba(255,255,255,0.1);color:#fff;font-size:15px;font-weight:600;cursor:pointer;text-align:left;transition:all 0.2s}
.negotiation-btn:active{transform:scale(0.98);background:rgba(255,255,255,0.2)}
.negotiation-btn.war{background:linear-gradient(135deg,#ff6b6b,#ee5a6f)}
.negotiation-btn.peace{background:linear-gradient(135deg,#4ecdc4,#44a3aa)}
.negotiation-btn.alliance{background:linear-gradient(135deg,#ffd93d,#ff9a3c)}
.negotiation-btn.trade{background:linear-gradient(135deg,#a8edea,#fed6e3);color:#000}
.notification{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:rgba(10,10,26,0.95);backdrop-filter:blur(10px);padding:12px 20px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);font-size:14px;font-weight:600;z-index:200;animation:fadeIn 0.3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="top-row">
      <div class="kingdom-info">
        <div class="kingdom-icon">👑</div>
        <div class="kingdom-name" id="kingdomName">Твоё Королевство</div>
      </div>
      <div class="time-counter" id="timeCounter">⏱ 00:00:00</div>
    </div>
    <div class="resources">
      <div class="resource">💎 <span id="crystals">100</span></div>
      <div class="resource">⚡ <span id="energy">50</span></div>
      <div class="resource">👥 <span id="army">10</span></div>
    </div>
  </div>
  
  <div class="map-container">
    <canvas id="gameCanvas"></canvas>
    <div class="mini-map">
      <canvas id="miniMapCanvas"></canvas>
    </div>
  </div>
  
  <div class="bottom-bar">
    <button class="action-btn" onclick="openLeaderboard()">
      <div class="action-icon">🏆</div>
      <div>Топ</div>
    </button>
    <button class="action-btn" onclick="openBuild()">
      <div class="action-icon">🏗</div>
      <div>Строить</div>
    </button>
    <button class="action-btn" onclick="openArmy()">
      <div class="action-icon">⚔️</div>
      <div>Армия</div>
    </button>
    <button class="action-btn" onclick="openMenu()">
      <div class="action-icon">☰</div>
      <div>Меню</div>
    </button>
  </div>
</div>

<div class="modal" id="leaderboardModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title">🏆 Топ Королевств</div>
      <button class="close-btn" onclick="closeModal('leaderboardModal')">×</button>
    </div>
    <div id="leaderboardList"></div>
  </div>
</div>

<div class="modal" id="negotiationModal">
  <div class="modal-content">
    <div class="modal-header">
      <div class="modal-title" id="negotiationTitle">Переговоры</div>
      <button class="close-btn" onclick="closeModal('negotiationModal')">×</button>
    </div>
    <div class="negotiation-options">
      <button class="negotiation-btn war" onclick="negotiate('war')">⚔️ Объявить войну</button>
      <button class="negotiation-btn peace" onclick="negotiate('peace')">🕊 Заключить мир</button>
      <button class="negotiation-btn alliance" onclick="negotiate('alliance')">🤝 Предложить союз</button>
      <button class="negotiation-btn trade" onclick="negotiate('trade')">💰 Торговля ресурсами</button>
    </div>
  </div>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#0a0a1a'); }

const MAP_SIZE = 500;
const CELL_SIZE = 40;
const KINGDOMS_COUNT = 10;

const kingdomColors = [
  '#4ecdc4', '#ff6b6b', '#ffd93d', '#a8edea', '#fed6e3',
  '#c471f5', '#f093fb', '#43cea2', '#36d1dc', '#ff512f', '#ff9a3c'
];

const kingdomNames = [
  'Твоё Королевство', 'Красная Империя', 'Зелёная Орда', 'Синий Легион',
  'Фиолетовый Орден', 'Жёлтый Альянс', 'Оранжевая Орда', 'Белый Дом',
  'Чёрный Легион', 'Коричневое Королевство', 'Розовая Империя'
];

let gameState = {
  map: [],
  kingdoms: [],
  player: { id: 0, crystals: 100, energy: 50, army: 10 },
  camera: { x: MAP_SIZE / 2, y: MAP_SIZE / 2, zoom: 1 },
  time: 0,
  relations: {}
};

let canvas, ctx, miniMapCanvas, miniMapCtx;
let isDragging = false, lastTouch = null;
let selectedCell = null;
let negotiationTarget = null;

function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  miniMapCanvas = document.getElementById('miniMapCanvas');
  miniMapCtx = miniMapCanvas.getContext('2d');
  
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  loadGame() || generateWorld();
  
  setupControls();
  updateUI();
  render();
  
  setInterval(gameLoop, 1000);
  setInterval(saveGame, 20000);
  setInterval(updateTime, 1000);
}

function resizeCanvas() {
  const container = canvas.parentElement;
  canvas.width = container.clientWidth * window.devicePixelRatio;
  canvas.height = container.clientHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  
  miniMapCanvas.width = 100;
  miniMapCanvas.height = 100;
}

function generateWorld() {
  gameState.map = Array(MAP_SIZE).fill(null).map(() => Array(MAP_SIZE).fill(null));
  
  gameState.kingdoms = [];
  for (let i = 0; i <= KINGDOMS_COUNT; i++) {
    gameState.kingdoms.push({
      id: i,
      name: kingdomNames[i],
      color: kingdomColors[i],
      territory: 0,
      aggression: Math.random(),
      economy: Math.random(),
      diplomacy: Math.random()
    });
  }
  
  for (let i = 0; i <= KINGDOMS_COUNT; i++) {
    const x = Math.floor(Math.random() * (MAP_SIZE - 10)) + 5;
    const y = Math.floor(Math.random() * (MAP_SIZE - 10)) + 5;
    const size = i === 0 ? 3 : Math.floor(Math.random() * 3) + 2;
    
    for (let dx = -size; dx <= size; dx++) {
      for (let dy = -size; dy <= size; dy++) {
        const nx = x + dx, ny = y + dy;
        if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
          if (Math.abs(dx) + Math.abs(dy) <= size + 1) {
            gameState.map[ny][nx] = { owner: i, building: null, army: i === 0 ? 10 : Math.floor(Math.random() * 20) + 5 };
            gameState.kingdoms[i].territory++;
          }
        }
      }
    }
  }
  
  for (let i = 1; i <= KINGDOMS_COUNT; i++) {
    for (let j = 0; j <= KINGDOMS_COUNT; j++) {
      if (i !== j) {
        const key = `${i}-${j}`;
        gameState.relations[key] = Math.random() > 0.5 ? 'neutral' : 'hostile';
      }
    }
  }
  
  gameState.camera.x = MAP_SIZE / 2;
  gameState.camera.y = MAP_SIZE / 2;
}

function setupControls() {
  canvas.addEventListener('touchstart', handleTouchStart);
  canvas.addEventListener('touchmove', handleTouchMove);
  canvas.addEventListener('touchend', handleTouchEnd);
  canvas.addEventListener('click', handleClick);
}

function handleTouchStart(e) {
  if (e.touches.length === 1) {
    isDragging = true;
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
}

function handleTouchMove(e) {
  if (isDragging && e.touches.length === 1) {
    const dx = e.touches[0].clientX - lastTouch.x;
    const dy = e.touches[0].clientY - lastTouch.y;
    gameState.camera.x -= dx / (CELL_SIZE * gameState.camera.zoom);
    gameState.camera.y -= dy / (CELL_SIZE * gameState.camera.zoom);
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    render();
  }
}

function handleTouchEnd() {
  isDragging = false;
}

function handleClick(e) {
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  
  const cellX = Math.floor(x / (CELL_SIZE * gameState.camera.zoom) + gameState.camera.x - canvas.clientWidth / (2 * CELL_SIZE * gameState.camera.zoom));
  const cellY = Math.floor(y / (CELL_SIZE * gameState.camera.zoom) + gameState.camera.y - canvas.clientHeight / (2 * CELL_SIZE * gameState.camera.zoom));
  
  if (cellX >= 0 && cellX < MAP_SIZE && cellY >= 0 && cellY < MAP_SIZE) {
    const cell = gameState.map[cellY][cellX];
    if (cell) {
      if (cell.owner === 0) {
        showNotification('Это твоя территория');
      } else {
        negotiationTarget = cell.owner;
        document.getElementById('negotiationTitle').textContent = `Переговоры с ${gameState.kingdoms[cell.owner].name}`;
        document.getElementById('negotiationModal').classList.add('show');
      }
    }
  }
}

function render() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  const viewWidth = canvas.clientWidth / (CELL_SIZE * gameState.camera.zoom);
  const viewHeight = canvas.clientHeight / (CELL_SIZE * gameState.camera.zoom);
  const startX = Math.max(0, Math.floor(gameState.camera.x - viewWidth / 2));
  const startY = Math.max(0, Math.floor(gameState.camera.y - viewHeight / 2));
  const endX = Math.min(MAP_SIZE, Math.ceil(gameState.camera.x + viewWidth / 2));
  const endY = Math.min(MAP_SIZE, Math.ceil(gameState.camera.y + viewHeight / 2));
  
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      const cell = gameState.map[y][x];
      if (cell) {
        const screenX = (x - gameState.camera.x + viewWidth / 2) * CELL_SIZE * gameState.camera.zoom;
        const screenY = (y - gameState.camera.y + viewHeight / 2) * CELL_SIZE * gameState.camera.zoom;
        
        ctx.fillStyle = gameState.kingdoms[cell.owner].color;
        ctx.fillRect(screenX, screenY, CELL_SIZE * gameState.camera.zoom - 1, CELL_SIZE * gameState.camera.zoom - 1);
        
        if (gameState.camera.zoom > 0.5) {
          ctx.fillStyle = '#fff';
          ctx.font = `${10 * gameState.camera.zoom}px Arial`;
          ctx.textAlign = 'center';
          ctx.fillText(cell.army, screenX + CELL_SIZE * gameState.camera.zoom / 2, screenY + CELL_SIZE * gameState.camera.zoom / 2 + 3);
        }
      }
    }
  }
  
  renderMiniMap();
}

function renderMiniMap() {
  miniMapCtx.fillStyle = '#0a0a1a';
  miniMapCtx.fillRect(0, 0, 100, 100);
  
  const scale = 100 / MAP_SIZE;
  for (let y = 0; y < MAP_SIZE; y += 5) {
    for (let x = 0; x < MAP_SIZE; x += 5) {
      const cell = gameState.map[y][x];
      if (cell) {
        miniMapCtx.fillStyle = gameState.kingdoms[cell.owner].color;
        miniMapCtx.fillRect(x * scale, y * scale, 5 * scale, 5 * scale);
      }
    }
  }
  
  const viewWidth = canvas.clientWidth / (CELL_SIZE * gameState.camera.zoom);
  const viewHeight = canvas.clientHeight / (CELL_SIZE * gameState.camera.zoom);
  miniMapCtx.strokeStyle = '#fff';
  miniMapCtx.lineWidth = 2;
  miniMapCtx.strokeRect(
    (gameState.camera.x - viewWidth / 2) * scale,
    (gameState.camera.y - viewHeight / 2) * scale,
    viewWidth * scale,
    viewHeight * scale
  );
}

function gameLoop() {
  for (let i = 1; i <= KINGDOMS_COUNT; i++) {
    aiTurn(i);
  }
  
  gameState.kingdoms.forEach((k, i) => {
    if (i > 0) {
      gameState.player.crystals += Math.floor(k.territory * 0.1 * k.economy);
      gameState.player.energy += Math.floor(k.territory * 0.05 * k.economy);
    }
  });
  
  updateUI();
  render();
}

function aiTurn(kingdomId) {
  const kingdom = gameState.kingdoms[kingdomId];
  
  if (Math.random() < kingdom.aggression * 0.1) {
    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const cell = gameState.map[y][x];
        if (cell && cell.owner === kingdomId) {
          const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
          const dir = dirs[Math.floor(Math.random() * 4)];
          const nx = x + dir[0], ny = y + dir[1];
          
          if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
            const target = gameState.map[ny][nx];
            if (target && target.owner !== kingdomId) {
              if (cell.army > target.army * 1.2) {
                const key = `${kingdomId}-${target.owner}`;
                if (gameState.relations[key] !== 'alliance') {
                  cell.army -= Math.floor(target.army * 0.5);
                  target.owner = kingdomId;
                  target.army = Math.floor(cell.army * 0.5);
                  kingdom.territory++;
                  gameState.kingdoms[target.owner].territory--;
                }
              }
            }
          }
        }
      }
    }
  }
}

function negotiate(action) {
  if (!negotiationTarget) return;
  
  const key = `0-${negotiationTarget}`;
  const target = gameState.kingdoms[negotiationTarget];
  
  let success = false;
  let message = '';
  
  switch(action) {
    case 'war':
      gameState.relations[key] = 'hostile';
      message = `Ты объявил войну ${target.name}`;
      success = true;
      break;
    case 'peace':
      if (target.diplomacy > 0.3) {
        gameState.relations[key] = 'neutral';
        message = `${target.name} согласился на мир`;
        success = true;
      } else {
        message = `${target.name} отказался от мира`;
      }
      break;
    case 'alliance':
      if (target.diplomacy > 0.6) {
        gameState.relations[key] = 'alliance';
        message = `${target.name} вступил в союз с тобой`;
        success = true;
      } else {
        message = `${target.name} отказался от союза`;
      }
      break;
    case 'trade':
      if (gameState.player.crystals >= 50) {
        gameState.player.crystals -= 50;
        gameState.player.army += 10;
        message = 'Ты обменял 50 кристаллов на 10 юнитов';
        success = true;
      } else {
        message = 'Недостаточно кристаллов';
      }
      break;
  }
  
  showNotification(message);
  closeModal('negotiationModal');
  negotiationTarget = null;
  updateUI();
}

function openLeaderboard() {
  const list = document.getElementById('leaderboardList');
  const sorted = [...gameState.kingdoms].sort((a, b) => b.territory - a.territory);
  
  list.innerHTML = sorted.map((k, i) => `
    <div class="leaderboard-item ${k.id === 0 ? 'you' : ''}">
      <div class="rank">${i + 1}</div>
      <div class="kingdom-flag" style="background:${k.color}">${k.id === 0 ? '👑' : '🏰'}</div>
      <div class="kingdom-details">
        <div class="kingdom-details-name">${k.name}</div>
        <div class="kingdom-details-territory">${k.territory} клеток</div>
      </div>
    </div>
  `).join('');
  
  document.getElementById('leaderboardModal').classList.add('show');
}

function openBuild() { showNotification('Строительство (в разработке)'); }
function openArmy() { showNotification('Армия (в разработке)'); }
function openMenu() { showNotification('Меню (в разработке)'); }

function closeModal(id) {
  document.getElementById(id).classList.remove('show');
}

function showNotification(text) {
  const notif = document.createElement('div');
  notif.className = 'notification';
  notif.textContent = text;
  document.body.appendChild(notif);
  setTimeout(() => notif.remove(), 3000);
}

function updateUI() {
  document.getElementById('crystals').textContent = gameState.player.crystals;
  document.getElementById('energy').textContent = gameState.player.energy;
  document.getElementById('army').textContent = gameState.player.army;
  document.getElementById('kingdomName').textContent = gameState.kingdoms[0].name;
}

function updateTime() {
  gameState.time++;
  const h = Math.floor(gameState.time / 3600).toString().padStart(2, '0');
  const m = Math.floor((gameState.time % 3600) / 60).toString().padStart(2, '0');
  const s = (gameState.time % 60).toString().padStart(2, '0');
  document.getElementById('timeCounter').textContent = `⏱ ${h}:${m}:${s}`;
  localStorage.setItem('gameTime', gameState.time);
}

function saveGame() {
  localStorage.setItem('neonConquestSave', JSON.stringify(gameState));
}

function loadGame() {
  const save = localStorage.getItem('neonConquestSave');
  if (save) {
    gameState = JSON.parse(save);
    return true;
  }
  return false;
}

window.addEventListener('beforeunload', saveGame);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });

init();
</script>
</body>
</html>
