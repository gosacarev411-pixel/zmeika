<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Depths of Eternity</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0a0a12;color:#e8e8e8;font-family:'Courier New',monospace;overflow:hidden;touch-action:none}
#game{display:block;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
#hud{position:fixed;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;z-index:10;pointer-events:none;font-size:12px;text-shadow:1px 1px 2px #000}
.bar{background:#222;border:1px solid #444;border-radius:3px;height:14px;overflow:hidden;margin:2px 0;width:120px}
.bar>div{height:100%;transition:width .3s}
.hp>div{background:linear-gradient(90deg,#c23,#e55)}
.mp>div{background:linear-gradient(90deg,#23c,#55e)}
.xp>div{background:linear-gradient(90deg,#c83,#ea5)}
.stat{background:#000a;padding:6px 10px;border-radius:4px;border:1px solid #333}
.stat b{color:#ffd54a}
#log{position:fixed;bottom:8px;left:8px;right:8px;max-height:90px;overflow-y:auto;background:#000c;padding:6px 10px;border-radius:4px;border:1px solid #333;font-size:11px;z-index:10;pointer-events:none}
#log div{opacity:.9;margin:1px 0}
#log .dmg{color:#f77}
#log .heal{color:#7f7}
#log .loot{color:#fd5}
#log .info{color:#8cf}
#controls{position:fixed;bottom:110px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:10}
.btn{width:54px;height:54px;background:#222;border:2px solid #555;border-radius:8px;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn:active{background:#444}
#dpad{position:fixed;bottom:110px;left:8px;width:150px;height:150px;z-index:10}
.arrow{position:absolute;width:48px;height:48px;background:#222;border:2px solid #555;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;cursor:pointer}
.arrow:active{background:#444}
#up{top:0;left:51px}
#down{bottom:0;left:51px}
#left{top:51px;left:0}
#right{top:51px;right:0}
#inv{position:fixed;inset:0;background:#000e;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
#inv.open{display:flex}
#inv-panel{background:#1a1a22;border:2px solid #555;border-radius:8px;padding:20px;max-width:500px;width:100%;max-height:80vh;overflow-y:auto}
.inv-item{background:#222;border:1px solid #444;padding:8px;margin:4px 0;border-radius:4px;display:flex;justify-content:space-between;align-items:center}
.inv-item button{background:#444;border:none;color:#fff;padding:4px 10px;border-radius:3px;cursor:pointer}
.close{background:#c23;border:none;color:#fff;padding:6px 12px;border-radius:4px;cursor:pointer;margin-top:10px}
#rotate{position:fixed;inset:0;background:#0a0a12;color:#fff;display:flex;align-items:center;justify-content:center;z-index:9999;font-size:18px;text-align:center;padding:30px}
@media (orientation:portrait){#rotate{display:flex}}
@media (orientation:landscape){#rotate{display:none}}
#title{position:fixed;inset:0;background:linear-gradient(180deg,#0a0a12,#1a0a1a);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center}
#title h1{font-size:32px;color:#ffd54a;text-shadow:0 0 20px #f80;margin-bottom:10px;letter-spacing:4px}
#title p{color:#aaa;margin-bottom:30px;font-size:13px}
#title button{background:#c23;border:none;color:#fff;padding:14px 40px;font-size:18px;border-radius:6px;cursor:pointer;margin:5px;font-family:inherit;letter-spacing:2px}
#title button:active{background:#e44}
#death{position:fixed;inset:0;background:#200e;display:none;align-items:center;justify-content:center;z-index:50;flex-direction:column;color:#fff;text-align:center}
#death h2{color:#f55;font-size:36px;margin-bottom:20px}
#death button{background:#c23;border:none;color:#fff;padding:12px 30px;font-size:16px;border-radius:4px;cursor:pointer;margin-top:20px;font-family:inherit}
</style>
</head>
<body>
<div id="rotate">📱 Поверни телефон горизонтально</div>

<div id="title">
  <h1>⚔ DEPTHS ⚔</h1>
  <h1 style="font-size:20px;margin-top:-10px">OF ETERNITY</h1>
  <p>Спустись в бесконечное подземелье. Найди сокровища. Или умри.</p>
  <button onclick="startGame()">НАЧАТЬ ЗАБЕГ</button>
  <button onclick="continueGame()" id="contBtn" style="background:#555">ПРОДОЛЖИТЬ</button>
  <p style="margin-top:30px;font-size:11px;color:#666">Золото: <span id="goldDisp">0</span> 🪙</p>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">
    <div>❤️ <span id="hpTxt">20/20</span></div>
    <div class="bar hp"><div id="hpBar" style="width:100%"></div></div>
    <div>💙 <span id="mpTxt">10/10</span></div>
    <div class="bar mp"><div id="mpBar" style="width:100%"></div></div>
    <div>⭐ Ур.<span id="lvlTxt">1</span> <span id="xpTxt">0/20</span></div>
    <div class="bar xp"><div id="xpBar" style="width:0%"></div></div>
  </div>
  <div class="stat" style="text-align:right">
    <div>🏛️ Этаж <b id="floorTxt">1</b></div>
    <div>⚔️ ATK <span id="atkTxt">5</span></div>
    <div>🛡️ DEF <span id="defTxt">0</span></div>
    <div>🪙 <span id="coinTxt">0</span></div>
  </div>
</div>

<div id="log"></div>

<div id="dpad">
  <div class="arrow" id="up">▲</div>
  <div class="arrow" id="down">▼</div>
  <div class="arrow" id="left">◀</div>
  <div class="arrow" id="right">▶</div>
</div>

<div id="controls">
  <div class="btn" onclick="openInv()" title="Инвентарь">🎒</div>
  <div class="btn" onclick="usePotion()" title="Зелье">🧪</div>
  <div class="btn" onclick="wait()" title="Ждать">⏳</div>
  <div class="btn" onclick="descend()" title="Спуститься" id="descBtn" style="display:none">⬇️</div>
</div>

<div id="inv">
  <div id="inv-panel">
    <h2 style="color:#ffd54a;margin-bottom:15px">🎒 ИНВЕНТАРЬ</h2>
    <div id="inv-list"></div>
    <button class="close" onclick="closeInv()">ЗАКРЫТЬ</button>
  </div>
</div>

<div id="death">
  <h2>💀 ТЫ ПОГИБ 💀</h2>
  <p id="deathStats"></p>
  <button onclick="restart()">НАЧАТЬ СНАЧАЛА</button>
</div>

<script>
// ============ НАСТРОЙКИ ============
const TILE=24,MAP_W=40,MAP_H=25;
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
let W,H;

function resize(){
  W=innerWidth;H=innerHeight;
  canvas.width=W;canvas.height=H;
}
resize();addEventListener('resize',resize);

// ============ СОСТОЯНИЕ ============
let G={
  floor:1,
  map:[],
  seen:[],
  player:{x:0,y:0,hp:20,maxHp:20,mp:10,maxMp:10,atk:5,def:0,lvl:1,xp:0,xpNext:20,coins:0},
  enemies:[],
  items:[],
  inventory:[],
  stairs:{x:0,y:0},
  turn:0,
  meta:{gold:0,bestFloor:0,kills:0},
  dead:false
};

// Загрузка мета-прогресса
try{
  const m=JSON.parse(localStorage.getItem('doe_meta'));
  if(m)G.meta=m;
}catch(e){}

// ============ ГЕНЕРАЦИЯ ПОДЗЕМЕЛЬЯ ============
function genFloor(){
  const map=[];
  for(let y=0;y<MAP_H;y++){
    map[y]=[];
    for(let x=0;x<MAP_W;x++)map[y][x]='#';
  }
  
  const rooms=[];
  const numRooms=7+Math.floor(Math.random()*4);
  
  for(let i=0;i<200&&rooms.length<numRooms;i++){
    const w=4+Math.floor(Math.random()*6);
    const h=4+Math.floor(Math.random()*4);
    const x=1+Math.floor(Math.random()*(MAP_W-w-2));
    const y=1+Math.floor(Math.random()*(MAP_H-h-2));
    
    let ok=true;
    for(const r of rooms){
      if(x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y){ok=false;break;}
    }
    if(!ok)continue;
    
    rooms.push({x,y,w,h,cx:Math.floor(x+w/2),cy:Math.floor(y+h/2)});
    for(let yy=y;yy<y+h;yy++)
      for(let xx=x;xx<x+w;xx++)map[yy][xx]='.';
  }
  
  // Коридоры
  for(let i=1;i<rooms.length;i++){
    const a=rooms[i-1],b=rooms[i];
    if(Math.random()<.5){
      carveH(map,a.cx,b.cx,a.cy);
      carveV(map,a.cy,b.cy,b.cx);
    }else{
      carveV(map,a.cy,b.cy,a.cx);
      carveH(map,a.cx,b.cx,b.cy);
    }
  }
  
  G.map=map;
  G.seen=[];
  for(let y=0;y<MAP_H;y++){
    G.seen[y]=[];
    for(let x=0;x<MAP_W;x++)G.seen[y][x]=false;
  }
  
  // Игрок в первой комнате
  G.player.x=rooms[0].cx;
  G.player.y=rooms[0].cy;
  
  // Лестница в последней
  G.stairs.x=rooms[rooms.length-1].cx;
  G.stairs.y=rooms[rooms.length-1].cy;
  
  // Враги
  G.enemies=[];
  for(let i=1;i<rooms.length;i++){
    const r=rooms[i];
    const count=1+Math.floor(Math.random()*3);
    for(let k=0;k<count;k++){
      const ex=r.x+1+Math.floor(Math.random()*(r.w-2));
      const ey=r.y+1+Math.floor(Math.random()*(r.h-2));
      if(ex===G.stairs.x&&ey===G.stairs.y)continue;
      G.enemies.push(makeEnemy(ex,ey));
    }
  }
  
  // Предметы
  G.items=[];
  for(let i=0;i<rooms.length;i++){
    if(Math.random()<.6){
      const r=rooms[i];
      const ix=r.x+1+Math.floor(Math.random()*(r.w-2));
      const iy=r.y+1+Math.floor(Math.random()*(r.h-2));
      G.items.push(makeItem(ix,iy));
    }
  }
  
  seeAround(G.player.x,G.player.y);
  log('Ты входишь на этаж '+G.floor,'info');
}

function carveH(m,x1,x2,y){
  for(let x=Math.min(x1,x2);x<=Math.max(x1,x2);x++)if(y>=0&&y<MAP_H&&x>=0&&x<MAP_W)m[y][x]='.';
}
function carveV(m,y1,y2,x){
  for(let y=Math.min(y1,y2);y<=Math.max(y1,y2);y++)if(y>=0&&y<MAP_H&&x>=0&&x<MAP_W)m[y][x]='.';
}

// ============ СУЩНОСТИ ============
const ENEMY_TYPES=[
  {name:'Крыса',ch:'r',color:'#c93',hp:4,atk:2,xp:3,coins:[1,3]},
  {name:'Скелет',ch:'s',color:'#ddd',hp:8,atk:4,xp:6,coins:[2,5]},
  {name:'Гоблин',ch:'g',color:'#5a5',hp:10,atk:5,xp:8,coins:[3,7]},
  {name:'Орк',ch:'o',color:'#853',hp:15,atk:7,xp:12,coins:[5,12]},
  {name:'Тролль',ch:'T',color:'#383',hp:25,atk:10,xp:20,coins:[10,20]},
  {name:'Демон',ch:'D',color:'#c33',hp:35,atk:14,xp:30,coins:[15,30]},
];

function makeEnemy(x,y){
  const tier=Math.min(ENEMY_TYPES.length-1,Math.floor((G.floor-1)/3));
  const minTier=Math.max(0,tier-1);
  const t=ENEMY_TYPES[minTier+Math.floor(Math.random()*(tier-minTier+1))];
  const scale=1+G.floor*0.08;
  return{
    x,y,
    name:t.name,ch:t.ch,color:t.color,
    hp:Math.floor(t.hp*scale),maxHp:Math.floor(t.hp*scale),
    atk:Math.floor(t.atk*scale),
    xp:t.xp,
    coins:t.coins
  };
}

const ITEM_TYPES=[
  {name:'Зелье лечения',ch:'!',color:'#f55',type:'potion',heal:15},
  {name:'Большое зелье',ch:'!',color:'#f33',type:'potion',heal:35},
  {name:'Зелье маны',ch:'!',color:'#55f',type:'mana',restore:10},
  {name:'Меч',ch:')',color:'#ccc',type:'weapon',atk:2},
  {name:'Длинный меч',ch:')',color:'#ddf',type:'weapon',atk:4},
  {name:'Топор',ch:')',color:'#c93',type:'weapon',atk:6},
  {name:'Кольчуга',ch:'[',color:'#aaa',type:'armor',def:2},
  {name:'Латы',ch:'[',color:'#ccf',type:'armor',def:4},
  {name:'Золото',ch:'$',color:'#fd5',type:'gold',amount:0},
];

function makeItem(x,y){
  const r=Math.random();
  let t;
  if(r<.35)t=ITEM_TYPES[0];
  else if(r<.5)t=ITEM_TYPES[1];
  else if(r<.6)t=ITEM_TYPES[2];
  else if(r<.75)t=ITEM_TYPES[3+Math.floor(Math.random()*3)];
  else if(r<.88)t=ITEM_TYPES[6+Math.floor(Math.random()*2)];
  else{t={...ITEM_TYPES[8]};t.amount=5+Math.floor(Math.random()*20+G.floor*3);}
  
  return{
    x,y,
    name:t.name,ch:t.ch,color:t.color,
    type:t.type,
    heal:t.heal||0,
    restore:t.restore||0,
    atk:t.atk||0,
    def:t.def||0,
    amount:t.amount||0
  };
}

// ============ ЛОГИКА ============
function seeAround(px,py){
  const R=6;
  for(let dy=-R;dy<=R;dy++)
    for(let dx=-R;dx<=R;dx++){
      if(dx*dx+dy*dy>R*R)continue;
      const x=px+dx,y=py+dy;
      if(x<0||x>=MAP_W||y<0||y>=MAP_H)continue;
      if(hasLOS(px,py,x,y))G.seen[y][x]=true;
    }
}

function hasLOS(x1,y1,x2,y2){
  const dx=Math.abs(x2-x1),dy=Math.abs(y2-y1);
  const sx=x1<x2?1:-1,sy=y1<y2?1:-1;
  let err=dx-dy,x=x1,y=y1;
  while(true){
    if(x===x2&&y===y2)return true;
    if(G.map[y][x]==='#')return false;
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
  }
}

function canWalk(x,y){
  if(x<0||x>=MAP_W||y<0||y>=MAP_H)return false;
  if(G.map[y][x]==='#')return false;
  if(G.enemies.some(e=>e.x===x&&e.y===y))return false;
  return true;
}

function movePlayer(dx,dy){
  if(G.dead)return;
  const nx=G.player.x+dx,ny=G.player.y+dy;
  
  // Атака врага?
  const e=G.enemies.find(e=>e.x===nx&&e.y===ny);
  if(e){attack(e);endTurn();return;}
  
  if(!canWalk(nx,ny))return;
  
  G.player.x=nx;G.player.y=ny;
  
  // Подбор предмета
  const it=G.items.find(i=>i.x===nx&&i.y===ny);
  if(it)pickup(it);
  
  // Лестница
  if(nx===G.stairs.x&&ny===G.stairs.y){
    document.getElementById('descBtn').style.display='flex';
  }else{
    document.getElementById('descBtn').style.display='none';
  }
  
  seeAround(nx,ny);
  endTurn();
}

function attack(e){
  const dmg=Math.max(1,G.player.atk+Math.floor(Math.random()*3)-1);
  e.hp-=dmg;
  log(`Ты бьёшь ${e.name} на ${dmg} урона`,'dmg');
  if(e.hp<=0){
    log(`${e.name} повержен! +${e.xp} XP`,'loot');
    G.player.xp+=e.xp;
    const coins=e.coins[0]+Math.floor(Math.random()*(e.coins[1]-e.coins[0]+1));
    G.player.coins+=coins;
    G.meta.kills++;
    if(coins>0)log(`+${coins} 🪙`,'loot');
    G.enemies=G.enemies.filter(x=>x!==e);
    checkLevelUp();
  }
}

function checkLevelUp(){
  while(G.player.xp>=G.player.xpNext){
    G.player.xp-=G.player.xpNext;
    G.player.lvl++;
    G.player.xpNext=Math.floor(G.player.xpNext*1.5);
    G.player.maxHp+=5;
    G.player.hp=G.player.maxHp;
    G.player.maxMp+=3;
    G.player.mp=G.player.maxMp;
    G.player.atk+=1;
    log(`⭐ УРОВЕНЬ ${G.player.lvl}! HP+5, ATK+1`,'heal');
  }
}

function pickup(it){
  if(it.type==='gold'){
    G.player.coins+=it.amount;
    log(`+${it.amount} 🪙`,'loot');
  }else{
    G.inventory.push(it);
    log(`Подобрал: ${it.name}`,'loot');
  }
  G.items=G.items.filter(i=>i!==it);
}

function usePotion(){
  const pot=G.inventory.find(i=>i.type==='potion');
  if(!pot){log('Нет зелий!','info');return;}
  const heal=Math.min(pot.heal,G.player.maxHp-G.player.hp);
  G.player.hp+=heal;
  G.inventory=G.inventory.filter(i=>i!==pot);
  log(`Выпил ${pot.name}: +${heal} HP`,'heal');
  endTurn();
}

function wait(){
  log('Ты ждёшь...','info');
  endTurn();
}

function descend(){
  G.floor++;
  if(G.floor>G.meta.bestFloor)G.meta.bestFloor=G.floor;
  genFloor();
  document.getElementById('descBtn').style.display='none';
  saveGame();
}

function endTurn(){
  G.turn++;
  enemiesTurn();
  updateHUD();
  if(G.player.hp<=0)die();
}

function enemiesTurn(){
  for(const e of G.enemies){
    const dx=G.player.x-e.x,dy=G.player.y-e.y;
    const dist=Math.abs(dx)+Math.abs(dy);
    
    if(dist===1){
      const dmg=Math.max(1,e.atk-G.player.def+Math.floor(Math.random()*2));
      G.player.hp-=dmg;
      log(`${e.name} бьёт тебя на ${dmg}`,'dmg');
    }else if(dist<10&&Math.random()<.7){
      // Движение к игроку
      let mx=0,my=0;
      if(Math.abs(dx)>Math.abs(dy))mx=Math.sign(dx);
      else my=Math.sign(dy);
      
      const nx=e.x+mx,ny=e.y+my;
      if(canWalk(nx,ny)&&!(nx===G.player.x&&ny===G.player.y)){
        if(!G.enemies.some(o=>o!==e&&o.x===nx&&o.y===ny)){
          e.x=nx;e.y=ny;
        }
      }
    }
  }
}

function die(){
  G.dead=true;
  G.meta.gold+=G.player.coins;
  localStorage.setItem('doe_meta',JSON.stringify(G.meta));
  localStorage.removeItem('doe_save');
  document.getElementById('deathStats').innerHTML=
    `Этаж: ${G.floor}<br>Убито врагов: ${G.meta.kills}<br>Золото собрано: ${G.player.coins} 🪙`;
  document.getElementById('death').style.display='flex';
}

function restart(){
  document.getElementById('death').style.display='none';
  document.getElementById('title').style.display='flex';
  document.getElementById('goldDisp').textContent=G.meta.gold;
}

// ============ ИНВЕНТАРЬ ============
function openInv(){
  const list=document.getElementById('inv-list');
  list.innerHTML='';
  if(G.inventory.length===0){
    list.innerHTML='<p style="color:#888">Пусто</p>';
  }
  G.inventory.forEach((it,idx)=>{
    const div=document.createElement('div');
    div.className='inv-item';
    let desc='';
    if(it.type==='potion')desc=`+${it.heal} HP`;
    else if(it.type==='mana')desc=`+${it.restore} MP`;
    else if(it.type==='weapon')desc=`+${it.atk} ATK`;
    else if(it.type==='armor')desc=`+${it.def} DEF`;
    div.innerHTML=`<span style="color:${it.color}">${it.ch}</span> <span>${it.name} (${desc})</span>`;
    const btn=document.createElement('button');
    btn.textContent='ИСПОЛЬЗОВАТЬ';
    btn.onclick=()=>{
      if(it.type==='potion'){
        const heal=Math.min(it.heal,G.player.maxHp-G.player.hp);
        G.player.hp+=heal;
        log(`+${heal} HP`,'heal');
      }else if(it.type==='mana'){
        const r=Math.min(it.restore,G.player.maxMp-G.player.mp);
        G.player.mp+=r;
        log(`+${r} MP`,'heal');
      }else if(it.type==='weapon'){
        G.player.atk+=it.atk;
        log(`ATK +${it.atk}`,'loot');
      }else if(it.type==='armor'){
        G.player.def+=it.def;
        log(`DEF +${it.def}`,'loot');
      }
      G.inventory.splice(idx,1);
      openInv();
      updateHUD();
      endTurn();
    };
    div.appendChild(btn);
    list.appendChild(div);
  });
  document.getElementById('inv').classList.add('open');
}
function closeInv(){document.getElementById('inv').classList.remove('open');}

// ============ HUD ============
function updateHUD(){
  document.getElementById('hpTxt').textContent=`${G.player.hp}/${G.player.maxHp}`;
  document.getElementById('hpBar').style.width=(G.player.hp/G.player.maxHp*100)+'%';
  document.getElementById('mpTxt').textContent=`${G.player.mp}/${G.player.maxMp}`;
  document.getElementById('mpBar').style.width=(G.player.mp/G.player.maxMp*100)+'%';
  document.getElementById('xpTxt').textContent=`${G.player.xp}/${G.player.xpNext}`;
  document.getElementById('xpBar').style.width=(G.player.xp/G.player.xpNext*100)+'%';
  document.getElementById('lvlTxt').textContent=G.player.lvl;
  document.getElementById('floorTxt').textContent=G.floor;
  document.getElementById('atkTxt').textContent=G.player.atk;
  document.getElementById('defTxt').textContent=G.player.def;
  document.getElementById('coinTxt').textContent=G.player.coins;
}

function log(msg,cls='info'){
  const l=document.getElementById('log');
  const d=document.createElement('div');
  d.className=cls;d.textContent='> '+msg;
  l.appendChild(d);
  while(l.children.length>8)l.removeChild(l.firstChild);
  l.scrollTop=l.scrollHeight;
}

// ============ РЕНДЕР ============
function render(){
  ctx.fillStyle='#0a0a12';
  ctx.fillRect(0,0,W,H);
  
  // Камера следует за игроком
  const camX=G.player.x-Math.floor(W/TILE/2);
  const camY=G.player.y-Math.floor(H/TILE/2);
  
  for(let y=0;y<MAP_H;y++){
    for(let x=0;x<MAP_W;x++){
      const sx=(x-camX)*TILE,sy=(y-camY)*TILE;
      if(sx<-TILE||sx>W||sy<-TILE||sy>H)continue;
      
      if(!G.seen[y][x]){
        continue;
      }
      
      const visible=hasLOS(G.player.x,G.player.y,x,y);
      const dim=visible?1:.4;
      
      const t=G.map[y][x];
      if(t==='#'){
        ctx.fillStyle=`rgb(${Math.floor(60*dim)},${Math.floor(55*dim)},${Math.floor(70*dim)})`;
        ctx.fillRect(sx,sy,TILE,TILE);
        ctx.fillStyle=`rgb(${Math.floor(40*dim)},${Math.floor(35*dim)},${Math.floor(50*dim)})`;
        ctx.fillRect(sx,sy+TILE-3,TILE,3);
      }else{
        ctx.fillStyle=`rgb(${Math.floor(35*dim)},${Math.floor(30*dim)},${Math.floor(40*dim)})`;
        ctx.fillRect(sx,sy,TILE,TILE);
        if((x+y)%7===0){
          ctx.fillStyle=`rgb(${Math.floor(45*dim)},${Math.floor(40*dim)},${Math.floor(50*dim)})`;
          ctx.fillRect(sx+2,sy+2,2,2);
        }
      }
    }
  }
  
  // Лестница
  if(G.seen[G.stairs.y][G.stairs.x]){
    const sx=(G.stairs.x-camX)*TILE,sy=(G.stairs.y-camY)*TILE;
    ctx.fillStyle='#fd5';
    ctx.fillRect(sx+4,sy+4,TILE-8,TILE-8);
    ctx.fillStyle='#a82';
    ctx.fillRect(sx+6,sy+6,TILE-12,TILE-12);
  }
  
  // Предметы
  for(const it of G.items){
    if(!G.seen[it.y][it.x])continue;
    const sx=(it.x-camX)*TILE,sy=(it.y-camY)*TILE;
    ctx.fillStyle=it.color;
    ctx.font='bold 18px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(it.ch,sx+TILE/2,sy+TILE/2);
  }
  
  // Враги
  for(const e of G.enemies){
    if(!G.seen[e.y][e.x])continue;
    const sx=(e.x-camX)*TILE,sy=(e.y-camY)*TILE;
    ctx.fillStyle=e.color;
    ctx.font='bold 20px monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(e.ch,sx+TILE/2,sy+TILE/2);
    // HP bar
    const hpw=TILE*(e.hp/e.maxHp);
    ctx.fillStyle='#300';
    ctx.fillRect(sx+2,sy-3,TILE-4,3);
    ctx.fillStyle='#f33';
    ctx.fillRect(sx+2,sy-3,hpw-4,3);
  }
  
  // Игрок
  const px=(G.player.x-camX)*TILE,py=(G.player.y-camY)*TILE;
  ctx.fillStyle='#4f4';
  ctx.font='bold 22px monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText('@',px+TILE/2,py+TILE/2);
}

// ============ УПРАВЛЕНИЕ ============
document.getElementById('up').onclick=()=>movePlayer(0,-1);
document.getElementById('down').onclick=()=>movePlayer(0,1);
document.getElementById('left').onclick=()=>movePlayer(-1,0);
document.getElementById('right').onclick=()=>movePlayer(1,0);

addEventListener('keydown',e=>{
  if(G.dead)return;
  const k=e.key;
  if(k==='ArrowUp'||k==='w')movePlayer(0,-1);
  else if(k==='ArrowDown'||k==='s')movePlayer(0,1);
  else if(k==='ArrowLeft'||k==='a')movePlayer(-1,0);
  else if(k==='ArrowRight'||k==='d')movePlayer(1,0);
  else if(k==='i')openInv();
  else if(k==='q')usePotion();
  else if(k===' '){e.preventDefault();wait();}
  else if(k==='>'||k==='.')descend();
});

// Тап по клетке
canvas.addEventListener('click',e=>{
  if(G.dead)return;
  const r=canvas.getBoundingClientRect();
  const cx=e.clientX-r.left,cy=e.clientY-r.top;
  const camX=G.player.x-Math.floor(W/TILE/2);
  const camY=G.player.y-Math.floor(H/TILE/2);
  const tx=Math.floor(cx/TILE)+camX;
  const ty=Math.floor(cy/TILE)+camY;
  const dx=tx-G.player.x,dy=ty-G.player.y;
  if(Math.abs(dx)+Math.abs(dy)===1)movePlayer(dx,dy);
});

// ============ СОХРАНЕНИЕ ============
function saveGame(){
  localStorage.setItem('doe_save',JSON.stringify(G));
}
function loadGame(){
  const s=localStorage.getItem('doe_save');
  if(s){
    G=JSON.parse(s);
    return true;
  }
  return false;
}

// ============ СТАРТ ============
function startGame(){
  document.getElementById('title').style.display='none';
  G={
    floor:1,
    map:[],seen:[],
    player:{x:0,y:0,hp:20,maxHp:20,mp:10,maxMp:10,atk:5,def:0,lvl:1,xp:0,xpNext:20,coins:0},
    enemies:[],items:[],inventory:[],
    stairs:{x:0,y:0},
    turn:0,
    meta:G.meta,
    dead:false
  };
  genFloor();
  updateHUD();
}

function continueGame(){
  if(loadGame()){
    document.getElementById('title').style.display='none';
    updateHUD();
  }else{
    alert('Нет сохранения');
  }
}

// Инициализация
document.getElementById('goldDisp').textContent=G.meta.gold;
if(!localStorage.getItem('doe_save')){
  document.getElementById('contBtn').style.display='none';
}

// Главный цикл
function loop(){
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
