<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3 Мировая - Стратегия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
        }

        /* Main Menu */
        #mainMenu {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .menu-title {
            font-size: 48px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            margin-bottom: 10px;
            animation: titlePulse 2s infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .menu-subtitle {
            font-size: 18px;
            opacity: 0.8;
            margin-bottom: 40px;
        }

        .menu-btn {
            width: 280px;
            padding: 18px;
            margin: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px solid #ffd700;
            border-radius: 15px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .menu-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.6);
        }

        .menu-btn:active {
            transform: scale(0.95);
        }

        /* Kingdom Name Input */
        #kingdomNameInput {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            align-items: center;
            justify-content: center;
            z-index: 1100;
            padding: 20px;
        }

        .name-box {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 40px;
            border-radius: 25px;
            border: 3px solid #ffd700;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .name-box h2 {
            font-size: 28px;
            margin-bottom: 20px;
            color: #ffd700;
        }

        .name-box input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border-radius: 12px;
            border: 2px solid #ffd700;
            background: rgba(0,0,0,0.5);
            color: #fff;
            font-size: 18px;
            text-align: center;
        }

        .name-box button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 18px;
            cursor: pointer;
        }

        /* Game Container */
        #gameContainer {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #ffd700;
            flex-wrap: wrap;
            gap: 10px;
        }

        .resource {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .resource-icon {
            font-size: 24px;
        }

        .resource-value {
            color: #ffd700;
        }

        /* Map Container */
        .map-container {
            flex: 1;
            overflow: auto;
            position: relative;
            background: #2d5016;
        }

        .map-grid {
            display: grid;
            grid-template-columns: repeat(20, 60px);
            grid-template-rows: repeat(20, 60px);
            gap: 2px;
            padding: 10px;
            min-width: 1240px;
        }

        .cell {
            width: 60px;
            height: 60px;
            border: 2px solid rgba(0,0,0,0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        .cell.player {
            background: linear-gradient(135deg, #00ff88, #00cc66);
            border-color: #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .cell.enemy {
            background: linear-gradient(135deg, #ff4444, #cc0000);
            border-color: #ff4444;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }

        .cell.neutral {
            background: linear-gradient(135deg, #888, #666);
            border-color: #999;
        }

        .cell.forest {
            background: linear-gradient(135deg, #228b22, #006400);
        }

        .cell.mountain {
            background: linear-gradient(135deg, #8b7355, #654321);
        }

        .cell.water {
            background: linear-gradient(135deg, #4169e1, #0000cd);
        }

        .cell.selected {
            border: 3px solid #ffd700;
            box-shadow: 0 0 20px #ffd700;
            animation: selectedPulse 1s infinite;
        }

        @keyframes selectedPulse {
            0%, 100% { box-shadow: 0 0 20px #ffd700; }
            50% { box-shadow: 0 0 40px #ffd700; }
        }

        .cell-army {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }

        /* Bottom Panel */
        .bottom-panel {
            background: rgba(0,0,0,0.9);
            padding: 15px;
            border-top: 2px solid #ffd700;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: 2px solid #ffd700;
            border-radius: 10px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .action-btn:hover {
            transform: scale(1.05);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            border-radius: 20px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 3px solid #ffd700;
        }

        .modal-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #ffd700;
            text-align: center;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            border: none;
            border-radius: 12px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        /* Leaderboard */
        .leaderboard-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid transparent;
        }

        .leaderboard-item.player {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.2);
        }

        .leaderboard-rank {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            width: 40px;
        }

        .leaderboard-name {
            flex: 1;
            font-weight: bold;
            margin-left: 15px;
        }

        .leaderboard-territory {
            color: #00ff88;
            font-weight: bold;
        }

        /* Profile */
        .profile-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .stat-box {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Diplomacy */
        .diplomacy-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            margin: 10px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .diplomacy-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-war {
            background: #ff4444;
        }

        .status-peace {
            background: #00ff88;
            color: #000;
        }

        .status-alliance {
            background: #ffd700;
            color: #000;
        }

        /* Game Over */
        #gameOver {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #gameOver.active {
            display: flex;
        }

        .game-over-text {
            font-size: 64px;
            font-weight: bold;
            color: #ff4444;
            text-shadow: 0 0 50px rgba(255, 68, 68, 0.8);
            margin-bottom: 30px;
            animation: gameOverPulse 2s infinite;
        }

        @keyframes gameOverPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Victory */
        #victory {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        #victory.active {
            display: flex;
        }

        .victory-text {
            font-size: 64px;
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.8);
            margin-bottom: 30px;
            animation: victoryPulse 2s infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .menu-title {
                font-size: 36px;
            }
            
            .map-grid {
                grid-template-columns: repeat(20, 50px);
                grid-template-rows: repeat(20, 50px);
            }
            
            .cell {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- Main Menu -->
    <div id="mainMenu">
        <div class="menu-title">3 МИРОВАЯ</div>
        <div class="menu-subtitle">Стратегия захвата территорий</div>
        <button class="menu-btn" onclick="startGame()">Начать игру</button>
        <button class="menu-btn" onclick="showProfile()">Профиль</button>
        <button class="menu-btn" onclick="showLeaderboard()">Топ игроков</button>
    </div>

    <!-- Kingdom Name Input -->
    <div id="kingdomNameInput">
        <div class="name-box">
            <h2>Назови своё королевство</h2>
            <input type="text" id="kingdomName" placeholder="Введи название..." maxlength="20">
            <button onclick="confirmKingdomName()">Начать завоевания</button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="gameContainer">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="resource">
                <span class="resource-icon">💰</span>
                <span class="resource-value" id="goldDisplay">1000</span>
            </div>
            <div class="resource">
                <span class="resource-icon">🌾</span>
                <span class="resource-value" id="foodDisplay">500</span>
            </div>
            <div class="resource">
                <span class="resource-icon">⚔️</span>
                <span class="resource-value" id="armyDisplay">100</span>
            </div>
            <div class="resource">
                <span class="resource-icon">🏰</span>
                <span class="resource-value" id="territoryDisplay">1</span>
            </div>
        </div>

        <!-- Map Container -->
        <div class="map-container">
            <div class="map-grid" id="mapGrid"></div>
        </div>

        <!-- Bottom Panel -->
        <div class="bottom-panel">
            <div class="action-buttons">
                <button class="action-btn" onclick="buildFarm()">🌾 Ферма (100💰)</button>
                <button class="action-btn" onclick="buildBarracks()">⚔️ Казарма (200💰)</button>
                <button class="action-btn" onclick="buildWall()">🏰 Стена (150💰)</button>
                <button class="action-btn" onclick="recruitArmy()">👥 Нанять (50💰)</button>
                <button class="action-btn" onclick="attackCell()">⚔️ Атаковать</button>
                <button class="action-btn" onclick="showDiplomacy()">🤝 Дипломатия</button>
                <button class="action-btn" onclick="showLeaderboard()">🏆 Топ</button>
                <button class="action-btn" onclick="showProfile()">👤 Профиль</button>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- Game Over -->
    <div id="gameOver">
        <div class="game-over-text">GAME OVER</div>
        <p style="font-size: 24px; margin-bottom: 30px;">Твоё королевство пало...</p>
        <button class="menu-btn" onclick="restartGame()">Начать заново</button>
    </div>

    <!-- Victory -->
    <div id="victory">
        <div class="victory-text">ПОБЕДА!</div>
        <p style="font-size: 24px; margin-bottom: 30px;">Ты захватил весь мир!</p>
        <button class="menu-btn" onclick="restartGame()">Начать новую игру</button>
    </div>

    <script>
        // Game State
        let gameState = {
            kingdomName: '',
            gold: 1000,
            food: 500,
            army: 100,
            territories: 1,
            buildings: {},
            diplomacy: {},
            selectedCell: null,
            gameOver: false,
            victory: false,
            startTime: Date.now(),
            lastSave: Date.now()
        };

        // Map Configuration
        const MAP_SIZE = 20;
        const TERRAIN_TYPES = ['plain', 'forest', 'mountain', 'water'];
        const TERRAIN_ICONS = { plain: '', forest: '🌲', mountain: '⛰️', water: '🌊' };
        
        // AI Kingdoms
        const AI_NAMES = [
            'Империя Зла', 'Северный Альянс', 'Орда Хаоса', 'Королевство Теней',
            'Лига Свободы', 'Тёмный Орден', 'Священная Империя', 'Клан Волка',
            'Братство Стали', 'Последний Бастион'
        ];

        const AI_COLORS = [
            '#ff4444', '#4444ff', '#ff8800', '#8800ff', '#00ff88',
            '#ff0088', '#88ff00', '#0088ff', '#ff0044', '#44ff88'
        ];

        let map = [];
        let aiKingdoms = [];

        // Initialize Game
        function initGame() {
            const saved = localStorage.getItem('worldWar3Game');
            if (saved) {
                gameState = JSON.parse(saved);
                loadMap();
                showGame();
            }
        }

        // Start Game
        function startGame() {
            const saved = localStorage.getItem('worldWar3Game');
            if (saved) {
                gameState = JSON.parse(saved);
                loadMap();
                showGame();
            } else {
                document.getElementById('mainMenu').style.display = 'none';
                document.getElementById('kingdomNameInput').style.display = 'flex';
            }
        }

        // Confirm Kingdom Name
        function confirmKingdomName() {
            const name = document.getElementById('kingdomName').value.trim();
            if (name.length < 3) {
                alert('Название должно содержать минимум 3 символа!');
                return;
            }
            
            gameState.kingdomName = name;
            generateMap();
            saveGame();
            showGame();
        }

        // Generate Map
        function generateMap() {
            map = [];
            aiKingdoms = [];
            
            // Initialize empty map
            for (let y = 0; y < MAP_SIZE; y++) {
                map[y] = [];
                for (let x = 0; x < MAP_SIZE; x++) {
                    const terrain = TERRAIN_TYPES[Math.floor(Math.random() * TERRAIN_TYPES.length)];
                    map[y][x] = {
                        x, y,
                        terrain,
                        owner: null,
                        army: 0,
                        buildings: []
                    };
                }
            }

            // Place player kingdom (random position)
            const playerStart = getRandomPosition();
            map[playerStart.y][playerStart.x].owner = 'player';
            map[playerStart.y][playerStart.x].army = gameState.army;

            // Place AI kingdoms
            for (let i = 0; i < 10; i++) {
                const pos = getRandomPosition();
                const ai = {
                    name: AI_NAMES[i],
                    color: AI_COLORS[i],
                    territories: 1,
                    army: 100 + Math.floor(Math.random() * 200),
                    diplomacy: {}
                };
                aiKingdoms.push(ai);
                map[pos.y][pos.x].owner = i;
                map[pos.y][pos.x].army = ai.army;
            }

            // Initialize diplomacy
            aiKingdoms.forEach((ai, i) => {
                gameState.diplomacy[i] = 'peace';
                ai.diplomacy = {};
                aiKingdoms.forEach((_, j) => {
                    if (i !== j) ai.diplomacy[j] = 'peace';
                });
            });

            renderMap();
        }

        // Load Map
        function loadMap() {
            const savedMap = localStorage.getItem('worldWar3Map');
            if (savedMap) {
                map = JSON.parse(savedMap);
                aiKingdoms = JSON.parse(localStorage.getItem('worldWar3AI'));
            } else {
                generateMap();
            }
            renderMap();
        }

        // Get Random Position
        function getRandomPosition() {
            let x, y;
            do {
                x = Math.floor(Math.random() * MAP_SIZE);
                y = Math.floor(Math.random() * MAP_SIZE);
            } while (map[y][x].owner !== null || map[y][x].terrain === 'water');
            return { x, y };
        }

        // Render Map
        function renderMap() {
            const grid = document.getElementById('mapGrid');
            grid.innerHTML = '';

            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    const cell = map[y][x];
                    const div = document.createElement('div');
                    div.className = 'cell';
                    div.dataset.x = x;
                    div.dataset.y = y;

                    // Terrain
                    if (cell.terrain === 'forest') div.classList.add('forest');
                    else if (cell.terrain === 'mountain') div.classList.add('mountain');
                    else if (cell.terrain === 'water') div.classList.add('water');

                    // Owner
                    if (cell.owner === 'player') {
                        div.classList.add('player');
                    } else if (cell.owner !== null) {
                        div.classList.add('enemy');
                        div.style.background = `linear-gradient(135deg, ${aiKingdoms[cell.owner].color}, ${aiKingdoms[cell.owner].color}88)`;
                    } else {
                        div.classList.add('neutral');
                    }

                    // Terrain icon
                    div.textContent = TERRAIN_ICONS[cell.terrain];

                    // Army count
                    if (cell.army > 0) {
                        const armyBadge = document.createElement('div');
                        armyBadge.className = 'cell-army';
                        armyBadge.textContent = cell.army;
                        div.appendChild(armyBadge);
                    }

                    // Selected
                    if (gameState.selectedCell && gameState.selectedCell.x === x && gameState.selectedCell.y === y) {
                        div.classList.add('selected');
                    }

                    div.onclick = () => selectCell(x, y);
                    grid.appendChild(div);
                }
            }

            updateUI();
        }

        // Select Cell
        function selectCell(x, y) {
            gameState.selectedCell = { x, y };
            renderMap();
        }

        // Update UI
        function updateUI() {
            document.getElementById('goldDisplay').textContent = Math.floor(gameState.gold);
            document.getElementById('foodDisplay').textContent = Math.floor(gameState.food);
            document.getElementById('armyDisplay').textContent = Math.floor(gameState.army);
            document.getElementById('territoryDisplay').textContent = gameState.territories;
        }

        // Build Farm
        function buildFarm() {
            if (!gameState.selectedCell) {
                alert('Выбери клетку!');
                return;
            }
            if (gameState.gold < 100) {
                alert('Недостаточно золота!');
                return;
            }
            
            const cell = map[gameState.selectedCell.y][gameState.selectedCell.x];
            if (cell.owner !== 'player') {
                alert('Можно строить только на своей территории!');
                return;
            }

            gameState.gold -= 100;
            cell.buildings.push('farm');
            gameState.food += 50;
            saveGame();
            renderMap();
            alert('Ферма построена! +50🌾');
        }

        // Build Barracks
        function buildBarracks() {
            if (!gameState.selectedCell) {
                alert('Выбери клетку!');
                return;
            }
            if (gameState.gold < 200) {
                alert('Недостаточно золота!');
                return;
            }
            
            const cell = map[gameState.selectedCell.y][gameState.selectedCell.x];
            if (cell.owner !== 'player') {
                alert('Можно строить только на своей территории!');
                return;
            }

            gameState.gold -= 200;
            cell.buildings.push('barracks');
            saveGame();
            renderMap();
            alert('Казарма построена! Теперь можно нанимать больше войск.');
        }

        // Build Wall
        function buildWall() {
            if (!gameState.selectedCell) {
                alert('Выбери клетку!');
                return;
            }
            if (gameState.gold < 150) {
                alert('Недостаточно золота!');
                return;
            }
            
            const cell = map[gameState.selectedCell.y][gameState.selectedCell.x];
            if (cell.owner !== 'player') {
                alert('Можно строить только на своей территории!');
                return;
            }

            gameState.gold -= 150;
            cell.buildings.push('wall');
            saveGame();
            renderMap();
            alert('Стена построена! Защита увеличена.');
        }

        // Recruit Army
        function recruitArmy() {
            if (gameState.gold < 50) {
                alert('Недостаточно золота!');
                return;
            }
            if (gameState.food < 20) {
                alert('Недостаточно еды!');
                return;
            }

            gameState.gold -= 50;
            gameState.food -= 20;
            gameState.army += 20;
            
            // Add army to selected cell or random player cell
            if (gameState.selectedCell && map[gameState.selectedCell.y][gameState.selectedCell.x].owner === 'player') {
                map[gameState.selectedCell.y][gameState.selectedCell.x].army += 20;
            } else {
                const playerCells = getPlayerCells();
                if (playerCells.length > 0) {
                    const randomCell = playerCells[Math.floor(Math.random() * playerCells.length)];
                    map[randomCell.y][randomCell.x].army += 20;
                }
            }
            
            saveGame();
            renderMap();
            alert('Нанято 20 воинов!');
        }

        // Attack Cell
        function attackCell() {
            if (!gameState.selectedCell) {
                alert('Выбери клетку для атаки!');
                return;
            }

            const target = map[gameState.selectedCell.y][gameState.selectedCell.x];
            
            // Check if adjacent to player territory
            const adjacentToPlayer = isAdjacentToPlayer(gameState.selectedCell.x, gameState.selectedCell.y);
            if (!adjacentToPlayer && target.owner !== 'player') {
                alert('Можно атаковать только соседние клетки!');
                return;
            }

            if (target.owner === 'player') {
                alert('Это уже твоя территория!');
                return;
            }

            if (target.terrain === 'water') {
                alert('Нельзя атаковать воду!');
                return;
            }

            // Calculate battle
            const playerStrength = gameState.army;
            const targetStrength = target.army + (target.buildings.includes('wall') ? 50 : 0);

            if (playerStrength > targetStrength) {
                // Victory
                const reward = 100 + Math.floor(Math.random() * 200);
                gameState.gold += reward;
                gameState.army -= Math.floor(targetStrength * 0.3);
                target.owner = 'player';
                target.army = Math.floor(playerStrength * 0.7);
                gameState.territories++;
                
                saveGame();
                renderMap();
                alert(`Победа! Захвачена территория. +${reward}💰`);
                
                checkVictory();
            } else {
                // Defeat
                gameState.army -= Math.floor(playerStrength * 0.5);
                saveGame();
                renderMap();
                alert('Поражение! Армия понесла потери.');
                
                checkGameOver();
            }
        }

        // Is Adjacent to Player
        function isAdjacentToPlayer(x, y) {
            const directions = [[0,1], [0,-1], [1,0], [-1,0]];
            for (let [dx, dy] of directions) {
                const nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
                    if (map[ny][nx].owner === 'player') return true;
                }
            }
            return false;
        }

        // Get Player Cells
        function getPlayerCells() {
            const cells = [];
            for (let y = 0; y < MAP_SIZE; y++) {
                for (let x = 0; x < MAP_SIZE; x++) {
                    if (map[y][x].owner === 'player') cells.push({x, y});
                }
            }
            return cells;
        }

        // AI Turn
        function aiTurn() {
            aiKingdoms.forEach((ai, aiIndex) => {
                if (Math.random() < 0.3) { // 30% chance to act
                    // Find adjacent enemy cells
                    const targets = [];
                    for (let y = 0; y < MAP_SIZE; y++) {
                        for (let x = 0; x < MAP_SIZE; x++) {
                            if (map[y][x].owner === aiIndex) {
                                const directions = [[0,1], [0,-1], [1,0], [-1,0]];
                                for (let [dx, dy] of directions) {
                                    const nx = x + dx, ny = y + dy;
                                    if (nx >= 0 && nx < MAP_SIZE && ny >= 0 && ny < MAP_SIZE) {
                                        const target = map[ny][nx];
                                        if (target.owner !== aiIndex && target.owner !== null && target.terrain !== 'water') {
                                            if (ai.diplomacy[target.owner] === 'war' || Math.random() < 0.2) {
                                                targets.push({x: nx, y: ny, cell: target});
                                            }
                                        }
                                    }
                                }
                            }
                        }
                    }

                    if (targets.length > 0 && ai.army > 50) {
                        const target = targets[Math.floor(Math.random() * targets.length)];
                        const targetOwner = target.cell.owner;
                        const targetArmy = target.cell.army;

                        if (ai.army > targetArmy) {
                            // AI wins
                            ai.army -= Math.floor(targetArmy * 0.3);
                            target.cell.owner = aiIndex;
                            target.cell.army = Math.floor(ai.army * 0.7);
                            ai.territories++;
                            
                            if (targetOwner === 'player') {
                                gameState.territories--;
                            } else if (targetOwner !== null) {
                                aiKingdoms[targetOwner].territories--;
                            }
                        } else {
                            // AI loses
                            ai.army -= Math.floor(ai.army * 0.5);
                        }
                    }
                }

                // Random diplomacy changes
                if (Math.random() < 0.05) {
                    const otherAI = Math.floor(Math.random() * 10);
                    if (otherAI !== aiIndex) {
                        const relations = ['war', 'peace', 'alliance'];
                        ai.diplomacy[otherAI] = relations[Math.floor(Math.random() * relations.length)];
                    }
                }
            });

            // Resource generation
            gameState.gold += gameState.territories * 10;
            gameState.food += gameState.territories * 5;
            
            // Army recruitment from barracks
            const playerCells = getPlayerCells();
            playerCells.forEach(cell => {
                if (map[cell.y][cell.x].buildings.includes('barracks')) {
                    map[cell.y][cell.x].army += 5;
                    gameState.army += 5;
                }
            });

            saveGame();
            renderMap();
            checkGameOver();
        }

        // Check Game Over
        function checkGameOver() {
            if (gameState.territories === 0) {
                gameState.gameOver = true;
                document.getElementById('gameOver').classList.add('active');
            }
        }

        // Check Victory
        function checkVictory() {
            if (gameState.territories === MAP_SIZE * MAP_SIZE - 40) { // All non-water cells
                gameState.victory = true;
                document.getElementById('victory').classList.add('active');
            }
        }

        // Show Diplomacy
        function showDiplomacy() {
            let html = '<div class="modal-title">🤝 Дипломатия</div>';
            aiKingdoms.forEach((ai, i) => {
                const status = gameState.diplomacy[i] || 'peace';
                const statusClass = status === 'war' ? 'status-war' : (status === 'alliance' ? 'status-alliance' : 'status-peace');
                const statusText = status === 'war' ? 'Война' : (status === 'alliance' ? 'Союз' : 'Мир');
                
                html += `
                    <div class="diplomacy-item">
                        <div>
                            <div style="font-weight: bold; color: ${ai.color}">${ai.name}</div>
                            <div style="font-size: 12px; opacity: 0.7">Территорий: ${ai.territories}</div>
                        </div>
                        <div>
                            <span class="diplomacy-status ${statusClass}">${statusText}</span>
                            <button class="action-btn" style="margin-left: 10px; padding: 5px 10px; font-size: 12px;" onclick="changeDiplomacy(${i})">Изменить</button>
                        </div>
                    </div>
                `;
            });
            html += '<button class="modal-btn" onclick="closeModal()">Закрыть</button>';
            showModal(html);
        }

        // Change Diplomacy
        function changeDiplomacy(aiIndex) {
            const current = gameState.diplomacy[aiIndex] || 'peace';
            const next = current === 'peace' ? 'war' : (current === 'war' ? 'alliance' : 'peace');
            gameState.diplomacy[aiIndex] = next;
            aiKingdoms[aiIndex].diplomacy['player'] = next;
            saveGame();
            showDiplomacy();
        }

        // Show Leaderboard
        function showLeaderboard() {
            const scores = [{name: gameState.kingdomName || 'Игрок', territories: gameState.territories, isPlayer: true}];
            aiKingdoms.forEach(ai => {
                scores.push({name: ai.name, territories: ai.territories, isPlayer: false});
            });
            scores.sort((a, b) => b.territories - a.territories);

            let html = '<div class="modal-title">🏆 Топ по территориям</div>';
            scores.forEach((score, i) => {
                html += `
                    <div class="leaderboard-item ${score.isPlayer ? 'player' : ''}">
                        <div class="leaderboard-rank">${i + 1}</div>
                        <div class="leaderboard-name">${score.name}</div>
                        <div class="leaderboard-territory">${score.territories} 🏰</div>
                    </div>
                `;
            });
            html += '<button class="modal-btn" onclick="closeModal()">Закрыть</button>';
            showModal(html);
        }

        // Show Profile
        function showProfile() {
            const playTime = Math.floor((Date.now() - gameState.startTime) / 1000);
            const hours = Math.floor(playTime / 3600);
            const minutes = Math.floor((playTime % 3600) / 60);

            let html = `
                <div class="modal-title">👤 Профиль</div>
                <div style="text-align: center; margin: 20px 0;">
                    <input type="text" id="profileName" value="${gameState.kingdomName}" style="width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #ffd700; background: rgba(0,0,0,0.5); color: #fff; font-size: 18px; text-align: center;">
                    <button class="action-btn" style="margin-top: 10px;" onclick="changeName()">Сохранить имя</button>
                </div>
                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-label">Территории</div>
                        <div class="stat-value">${gameState.territories}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Армия</div>
                        <div class="stat-value">${Math.floor(gameState.army)}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Золото</div>
                        <div class="stat-value">${Math.floor(gameState.gold)}</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Время в игре</div>
                        <div class="stat-value">${hours}ч ${minutes}м</div>
                    </div>
                </div>
                <button class="modal-btn" onclick="closeModal()">Закрыть</button>
            `;
            showModal(html);
        }

        // Change Name
        function changeName() {
            const newName = document.getElementById('profileName').value.trim();
            if (newName.length >= 3) {
                gameState.kingdomName = newName;
                saveGame();
                alert('Имя изменено!');
                closeModal();
            } else {
                alert('Имя должно содержать минимум 3 символа!');
            }
        }

        // Show Modal
        function showModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // Show Game
        function showGame() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('kingdomNameInput').style.display = 'none';
            document.getElementById('gameContainer').style.display = 'flex';
            renderMap();
        }

        // Save Game
        function saveGame() {
            gameState.lastSave = Date.now();
            localStorage.setItem('worldWar3Game', JSON.stringify(gameState));
            localStorage.setItem('worldWar3Map', JSON.stringify(map));
            localStorage.setItem('worldWar3AI', JSON.stringify(aiKingdoms));
        }

        // Restart Game
        function restartGame() {
            localStorage.removeItem('worldWar3Game');
            localStorage.removeItem('worldWar3Map');
            localStorage.removeItem('worldWar3AI');
            location.reload();
        }

        // Game Loop
        setInterval(() => {
            if (!gameState.gameOver && !gameState.victory) {
                aiTurn();
            }
        }, 5000); // AI acts every 5 seconds

        // Auto-save
        setInterval(saveGame, 10000);

        // Init
        window.onload = initGame;
    </script>
</body>
</html>
