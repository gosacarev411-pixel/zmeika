<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Зона: Выживание</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            touch-action: manipulation;
        }
        
        .screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        
        .screen.active {
            display: flex;
            flex-direction: column;
        }
        
        /* Верхняя панель */
        .top-bar {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #4a4a4a;
        }
        
        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 0.8em;
        }
        
        .stat-value {
            font-weight: bold;
            color: #ff6b6b;
        }
        
        /* Карта мира */
        #map-screen {
            background: linear-gradient(135deg, #2d3436 0%, #1a1a1a 100%);
        }
        
        .map-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            overflow-y: auto;
        }
        
        .location {
            background: rgba(74, 74, 74, 0.6);
            border: 2px solid #5a5a5a;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .location:active {
            transform: scale(0.95);
            background: rgba(100, 100, 100, 0.8);
        }
        
        .location-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .location-name {
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .location-level {
            font-size: 0.7em;
            color: #888;
            margin-top: 5px;
        }
        
        /* Экран локации */
        #location-screen {
            background: linear-gradient(180deg, #3a3a3a 0%, #1a1a1a 100%);
        }
        
        .location-header {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #4a4a4a;
        }
        
        .location-title {
            font-size: 1.5em;
            color: #ff6b6b;
        }
        
        .objects-container {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            overflow-y: auto;
        }
        
        .object {
            background: rgba(74, 74, 74, 0.6);
            border: 2px solid #5a5a5a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .object:active {
            transform: scale(0.9);
            background: rgba(100, 100, 100, 0.8);
        }
        
        .object-icon {
            font-size: 3em;
            margin-bottom: 10px;
        }
        
        .object-name {
            font-size: 0.9em;
        }
        
        /* Нижняя навигация */
        .bottom-nav {
            background: rgba(0, 0, 0, 0.9);
            padding: 10px;
            display: flex;
            justify-content: space-around;
            border-top: 2px solid #4a4a4a;
        }
        
        .nav-btn {
            background: none;
            border: none;
            color: #e0e0e0;
            font-size: 1.5em;
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 5px;
            transition: all 0.2s;
        }
        
        .nav-btn:active {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* Инвентарь */
        #inventory-screen {
            background: linear-gradient(135deg, #2d3436 0%, #1a1a1a 100%);
        }
        
        .inventory-grid {
            flex: 1;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            overflow-y: auto;
        }
        
        .inventory-slot {
            aspect-ratio: 1;
            background: rgba(74, 74, 74, 0.6);
            border: 2px solid #5a5a5a;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            position: relative;
        }
        
        .item-count {
            position: absolute;
            bottom: 5px;
            right: 5px;
            background: rgba(0, 0, 0, 0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.5em;
        }
        
        /* Прокачка */
        #upgrade-screen {
            background: linear-gradient(135deg, #2d3436 0%, #1a1a1a 100%);
        }
        
        .upgrade-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .upgrade-item {
            background: rgba(74, 74, 74, 0.6);
            border: 2px solid #5a5a5a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .upgrade-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        .upgrade-name {
            font-size: 1.1em;
            font-weight: bold;
        }
        
        .upgrade-level {
            color: #ff6b6b;
        }
        
        .upgrade-btn {
            width: 100%;
            padding: 12px;
            background: #4a4a4a;
            border: none;
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .upgrade-btn:active {
            background: #5a5a5a;
        }
        
        .upgrade-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        /* Уведомления */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid #ff6b6b;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            z-index: 1000;
            display: none;
            animation: fadeIn 0.3s;
        }
        
        .notification.show {
            display: block;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .notification-title {
            font-size: 1.3em;
            color: #ff6b6b;
            margin-bottom: 10px;
        }
        
        .notification-text {
            margin-bottom: 15px;
        }
        
        .notification-btn {
            padding: 10px 30px;
            background: #4a4a4a;
            border: none;
            border-radius: 5px;
            color: #e0e0e0;
            cursor: pointer;
        }
        
        /* Кнопка назад */
        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #5a5a5a;
            border-radius: 5px;
            padding: 8px 15px;
            color: #e0e0e0;
            cursor: pointer;
            z-index: 10;
        }
    </style>
</head>
<body>
    <!-- Экран карты -->
    <div id="map-screen" class="screen active">
        <div class="top-bar">
            <div class="stat">
                <div>❤️ HP</div>
                <div class="stat-value" id="hp">100</div>
            </div>
            <div class="stat">
                <div>⚡ Энергия</div>
                <div class="stat-value" id="energy">100</div>
            </div>
            <div class="stat">
                <div>💰 Очки</div>
                <div class="stat-value" id="points">0</div>
            </div>
        </div>
        
        <div class="map-container" id="map-container"></div>
        
        <div class="bottom-nav">
            <button class="nav-btn" onclick="showScreen('inventory-screen')">🎒</button>
            <button class="nav-btn" onclick="showScreen('upgrade-screen')">⬆️</button>
        </div>
    </div>
    
    <!-- Экран локации -->
    <div id="location-screen" class="screen">
        <button class="back-btn" onclick="showScreen('map-screen')">← Назад</button>
        
        <div class="location-header">
            <div class="location-title" id="location-title">Локация</div>
        </div>
        
        <div class="objects-container" id="objects-container"></div>
    </div>
    
    <!-- Экран инвентаря -->
    <div id="inventory-screen" class="screen">
        <button class="back-btn" onclick="showScreen('map-screen')">← Назад</button>
        
        <div class="top-bar">
            <div class="stat">
                <div>🎒 Инвентарь</div>
            </div>
        </div>
        
        <div class="inventory-grid" id="inventory-grid"></div>
    </div>
    
    <!-- Экран прокачки -->
    <div id="upgrade-screen" class="screen">
        <button class="back-btn" onclick="showScreen('map-screen')">← Назад</button>
        
        <div class="top-bar">
            <div class="stat">
                <div>💰 Очки</div>
                <div class="stat-value" id="upgrade-points">0</div>
            </div>
        </div>
        
        <div class="upgrade-container" id="upgrade-container"></div>
    </div>
    
    <!-- Уведомление -->
    <div class="notification" id="notification">
        <div class="notification-title" id="notification-title">Уведомление</div>
        <div class="notification-text" id="notification-text">Текст</div>
        <button class="notification-btn" onclick="closeNotification()">OK</button>
    </div>

    <script>
        // Игровые данные
        let gameData = {
            hp: 100,
            maxHp: 100,
            energy: 100,
            maxEnergy: 100,
            points: 0,
            damage: 10,
            currentLocation: null,
            inventory: [],
            upgrades: {
                health: 1,
                damage: 1,
                energy: 1
            }
        };
        
        // Локации
        const locations = [
            { id: 1, name: 'Рынок', icon: '🏪', level: 1, objects: ['📦', '🗑️', '🚗'] },
            { id: 2, name: 'Школа', icon: '🏫', level: 2, objects: ['📚', '🎒', '🧟'] },
            { id: 3, name: 'Больница', icon: '🏥', level: 3, objects: ['💊', '🩹', '🧟'] },
            { id: 4, name: 'Военная база', icon: '🏛️', level: 4, objects: ['🔫', '📦', '🧟'] },
            { id: 5, name: 'Метро', icon: '🚇', level: 5, objects: ['🔦', '📦', '🧟'] },
            { id: 6, name: 'Завод', icon: '🏭', level: 6, objects: ['⚙️', '🔧', '🧟'] }
        ];
        
        // Предметы
        const items = {
            '📦': { name: 'Ящик', loot: ['Консервы', 'Бинт'] },
            '🗑️': { name: 'Мусор', loot: ['Еда', 'Вода'] },
            '🚗': { name: 'Машина', loot: ['Бензин', 'Детали'] },
            '📚': { name: 'Книги', loot: ['Знания'] },
            '🎒': { name: 'Рюкзак', loot: ['Еда', 'Вода'] },
            '💊': { name: 'Аптечка', loot: ['Медикаменты'] },
            '🩹': { name: 'Бинты', loot: ['Бинт'] },
            '🔫': { name: 'Оружие', loot: ['Патроны'] },
            '🔦': { name: 'Фонарик', loot: ['Батарейки'] },
            '⚙️': { name: 'Шестерня', loot: ['Детали'] },
            '🔧': { name: 'Инструмент', loot: ['Детали'] },
            '🧟': { name: 'Зомби', loot: ['Очки'], isEnemy: true, hp: 30 }
        };
        
        // Загрузка сохранения
        function loadGame() {
            const saved = localStorage.getItem('zoneSurvival');
            if (saved) {
                gameData = JSON.parse(saved);
            }
            updateUI();
        }
        
        // Сохранение
        function saveGame() {
            localStorage.setItem('zoneSurvival', JSON.stringify(gameData));
        }
        
        // Обновление интерфейса
        function updateUI() {
            document.getElementById('hp').textContent = gameData.hp;
            document.getElementById('energy').textContent = gameData.energy;
            document.getElementById('points').textContent = gameData.points;
            document.getElementById('upgrade-points').textContent = gameData.points;
        }
        
        // Переключение экранов
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'map-screen') {
                renderMap();
            } else if (screenId === 'inventory-screen') {
                renderInventory();
            } else if (screenId === 'upgrade-screen') {
                renderUpgrades();
            }
            
            updateUI();
            saveGame();
        }
        
        // Отрисовка карты
        function renderMap() {
            const container = document.getElementById('map-container');
            container.innerHTML = '';
            
            locations.forEach(loc => {
                const div = document.createElement('div');
                div.className = 'location';
                div.innerHTML = `
                    <div class="location-icon">${loc.icon}</div>
                    <div class="location-name">${loc.name}</div>
                    <div class="location-level">Ур. ${loc.level}</div>
                `;
                div.onclick = () => enterLocation(loc);
                container.appendChild(div);
            });
        }
        
        // Вход в локацию
        function enterLocation(location) {
            if (gameData.energy < 5) {
                showNotification('⚠️ Внимание', 'Недостаточно энергии!');
                return;
            }
            
            gameData.energy -= 5;
            gameData.currentLocation = location;
            
            document.getElementById('location-title').textContent = location.name;
            renderLocationObjects();
            showScreen('location-screen');
        }
        
        // Отрисовка объектов локации
        function renderLocationObjects() {
            const container = document.getElementById('objects-container');
            container.innerHTML = '';
            
            gameData.currentLocation.objects.forEach(objIcon => {
                const obj = items[objIcon];
                const div = document.createElement('div');
                div.className = 'object';
                div.innerHTML = `
                    <div class="object-icon">${objIcon}</div>
                    <div class="object-name">${obj.name}</div>
                `;
                div.onclick = () => interactWithObject(objIcon);
                container.appendChild(div);
            });
        }
        
        // Взаимодействие с объектом
        function interactWithObject(objIcon) {
            const obj = items[objIcon];
            
            if (obj.isEnemy) {
                // Бой с врагом
                const enemyHp = obj.hp;
                const damage = gameData.damage;
                
                if (damage >= enemyHp) {
                    // Победа
                    const loot = obj.loot[0];
                    gameData.points += 10;
                    showNotification('⚔️ Победа!', `Ты убил ${obj.name}!\n+10 очков`);
                } else {
                    // Поражение
                    gameData.hp -= 20;
                    showNotification('💀 Поражение', `${obj.name} атаковал тебя!\n-20 HP`);
                }
            } else {
                // Сбор лута
                const loot = obj.loot[Math.floor(Math.random() * obj.loot.length)];
                addToInventory(loot);
                gameData.points += 5;
                showNotification('✅ Найдено!', `Ты получил: ${loot}\n+5 очков`);
            }
            
            updateUI();
            saveGame();
        }
        
        // Добавление в инвентарь
        function addToInventory(itemName) {
            const existing = gameData.inventory.find(i => i.name === itemName);
            if (existing) {
                existing.count++;
            } else {
                gameData.inventory.push({ name: itemName, count: 1 });
            }
        }
        
        // Отрисовка инвентаря
        function renderInventory() {
            const grid = document.getElementById('inventory-grid');
            grid.innerHTML = '';
            
            gameData.inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = 'inventory-slot';
                div.innerHTML = `
                    <div>${getItemIcon(item.name)}</div>
                    <div class="item-count">${item.count}</div>
                `;
                grid.appendChild(div);
            });
            
            // Пустые слоты
            for (let i = gameData.inventory.length; i < 20; i++) {
                const div = document.createElement('div');
                div.className = 'inventory-slot';
                grid.appendChild(div);
            }
        }
        
        // Получение иконки предмета
        function getItemIcon(itemName) {
            const icons = {
                'Консервы': '🥫',
                'Бинт': '🩹',
                'Еда': '🍖',
                'Вода': '💧',
                'Бензин': '⛽',
                'Детали': '⚙️',
                'Знания': '📖',
                'Медикаменты': '💊',
                'Патроны': '🔫',
                'Батарейки': '🔋'
            };
            return icons[itemName] || '📦';
        }
        
        // Отрисовка улучшений
        function renderUpgrades() {
            const container = document.getElementById('upgrade-container');
            container.innerHTML = '';
            
            const upgrades = [
                { id: 'health', name: '❤️ Здоровье', level: gameData.upgrades.health, cost: 50, effect: '+20 HP' },
                { id: 'damage', name: '⚔️ Урон', level: gameData.upgrades.damage, cost: 75, effect: '+5 урона' },
                { id: 'energy', name: '⚡ Энергия', level: gameData.upgrades.energy, cost: 100, effect: '+10 энергии' }
            ];
            
            upgrades.forEach(upg => {
                const div = document.createElement('div');
                div.className = 'upgrade-item';
                div.innerHTML = `
                    <div class="upgrade-header">
                        <div class="upgrade-name">${upg.name}</div>
                        <div class="upgrade-level">Ур. ${upg.level}</div>
                    </div>
                    <div style="margin-bottom: 10px; color: #888;">${upg.effect}</div>
                    <button class="upgrade-btn" onclick="buyUpgrade('${upg.id}', ${upg.cost})">
                        Улучшить (${upg.cost} очков)
                    </button>
                `;
                container.appendChild(div);
            });
        }
        
        // Покупка улучшения
        function buyUpgrade(upgradeId, cost) {
            if (gameData.points < cost) {
                showNotification('⚠️ Внимание', 'Недостаточно очков!');
                return;
            }
            
            gameData.points -= cost;
            gameData.upgrades[upgradeId]++;
            
            // Применение эффекта
            if (upgradeId === 'health') {
                gameData.maxHp += 20;
                gameData.hp = gameData.maxHp;
            } else if (upgradeId === 'damage') {
                gameData.damage += 5;
            } else if (upgradeId === 'energy') {
                gameData.maxEnergy += 10;
                gameData.energy = gameData.maxEnergy;
            }
            
            showNotification('✅ Улучшено!', 'Характеристика повышена!');
            updateUI();
            renderUpgrades();
            saveGame();
        }
        
        // Уведомление
        function showNotification(title, text) {
            document.getElementById('notification-title').textContent = title;
            document.getElementById('notification-text').textContent = text;
            document.getElementById('notification').classList.add('show');
        }
        
        function closeNotification() {
            document.getElementById('notification').classList.remove('show');
        }
        
        // Восстановление энергии (1 единица в минуту)
        setInterval(() => {
            if (gameData.energy < gameData.maxEnergy) {
                gameData.energy++;
                updateUI();
                saveGame();
            }
        }, 60000);
        
        // Инициализация
        loadGame();
        renderMap();
    </script>
</body>
</html>
